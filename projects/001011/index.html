<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>农机作业监测终端</title>
    <style>
        :root {
            --bg: #F5F5F5;
            --card: #FFFFFF;
            --primary: #2196F3;
            --alarm: #F44336;
            --ok: #4CAF50;
            --text: #212121;
            --sub: #757575;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 12px;
            padding-top: 44px;
        }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
        }
        .card-title {
            font-size: 14px;
            color: var(--sub);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-dot.connected { background: var(--ok); }
        .status-dot.disconnected { background: var(--alarm); }
        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .data-row:last-child { border-bottom: none; }
        .data-label { font-size: 13px; color: var(--sub); }
        .data-value {
            font-size: 28px;
            font-weight: bold;
            color: var(--text);
        }
        .data-value.alarm { color: var(--alarm); }
        .data-unit { font-size: 13px; color: var(--sub); margin-left: 4px; }
        .alarm-badge {
            display: inline-block;
            background: var(--alarm);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            margin: 4px 0;
            width: 100%;
            text-align: center;
        }
        .alarm-ok {
            background: var(--ok);
            color: white;
            padding: 12px 16px;
            border-radius: var(--radius);
            text-align: center;
            font-size: 16px;
            font-weight: 500;
        }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            min-height: 48px;
            transition: background 0.2s;
        }
        .btn:hover { background: #1976D2; }
        .btn:active { background: #1565C0; }
        .btn-mute {
            background: var(--alarm);
        }
        .btn-mute:hover { background: #D32F2F; }
        .threshold-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
        }
        .threshold-label {
            font-size: 14px;
            color: var(--sub);
            flex: 1;
        }
        .threshold-input {
            width: 80px;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
        }
        .threshold-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            min-height: 40px;
        }
        .threshold-btn:hover { background: #1976D2; }
        .threshold-display-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 6px 0;
            border-bottom: 1px solid #eee;
        }
        .threshold-display-row:last-child { border-bottom: none; }
        .thr-label { font-size: 13px; color: var(--sub); }
        .thr-value { font-size: 18px; font-weight: bold; color: var(--primary); }
        .thr-unit { font-size: 12px; color: var(--sub); margin-left: 4px; }
        .log-card { cursor: pointer; }
        .log-content {
            display: none;
            max-height: 300px;
            overflow-y: auto;
            background: #f9f9f9;
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
            font-size: 12px;
            font-family: monospace;
        }
        .log-content.expanded { display: block; }
        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid #eee;
        }
        .log-entry:last-child { border-bottom: none; }
        .gps-text {
            font-size: 13px;
            color: var(--sub);
            padding: 4px 0;
        }
        .alarm-exclamation {
            color: var(--alarm);
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- 状态栏 -->
    <div class="card">
        <div class="status-bar">
            <div>
                <span class="status-dot disconnected" id="statusDot"></span>
                <span id="statusText">未连接</span>
            </div>
            <div>
                <span style="color: var(--sub);">更新: </span>
                <span id="updateTime">--</span>
            </div>
        </div>
    </div>

    <!-- 实时数据卡 -->
    <div class="card">
        <div class="card-title">实时数据</div>
        <div class="data-row">
            <span class="data-label">作业速度</span>
            <div>
                <span class="data-value" id="speed">--</span><span id="speedExcl"></span>
                <span class="data-unit">km/h</span>
            </div>
        </div>
        <div class="data-row">
            <span class="data-label">累计面积</span>
            <div>
                <span class="data-value" id="area">--</span>
                <span class="data-unit">mu</span>
            </div>
        </div>
        <div class="data-row">
            <span class="data-label">GPS 位置</span>
            <div class="gps-text" id="gpsText">定位中...</div>
        </div>
        <div class="gps-text" id="gpsCoords" style="display:none;">
            <span id="lat">--</span>, <span id="lon">--</span>
        </div>
    </div>

    <!-- 传感器数据卡 -->
    <div class="card">
        <div class="card-title">传感器数据</div>
        <div class="data-row">
            <span class="data-label">温度</span>
            <div>
                <span class="data-value" id="temp">--</span><span id="tempExcl"></span>
                <span class="data-unit">℃</span>
            </div>
        </div>
        <div class="data-row">
            <span class="data-label">湿度</span>
            <div>
                <span class="data-value" id="humi">--</span><span id="humiExcl"></span>
                <span class="data-unit">%</span>
            </div>
        </div>
        <div class="data-row">
            <span class="data-label">土壤湿度</span>
            <div>
                <span class="data-value" id="soil">--</span><span id="soilExcl"></span>
                <span class="data-unit">%</span>
            </div>
        </div>
        <div class="data-row">
            <span class="data-label">PH 值</span>
            <div>
                <span class="data-value" id="ph">--</span><span id="phExcl"></span>
            </div>
        </div>
    </div>

    <!-- 报警状态卡 -->
    <div class="card">
        <div class="card-title">报警状态</div>
        <div id="alarmContainer">
            <div class="alarm-ok" id="alarmOk">运行正常 ✓</div>
        </div>
    </div>

    <!-- 控制卡 -->
    <div class="card">
        <div class="card-title">远程控制</div>
        <button class="btn btn-mute" onclick="sendMute()">消 警</button>
    </div>

    <!-- 当前阈值显示卡 -->
    <div class="card">
        <div class="card-title">当前阈值（下位机上报）</div>
        <div class="threshold-display-row">
            <span class="thr-label">速度阈值</span>
            <div><span class="thr-value" id="thrDispSpeed">--</span><span class="thr-unit">km/h</span></div>
        </div>
        <div class="threshold-display-row">
            <span class="thr-label">温度阈值</span>
            <div><span class="thr-value" id="thrDispTemp">--</span><span class="thr-unit">℃</span></div>
        </div>
        <div class="threshold-display-row">
            <span class="thr-label">湿度阈值</span>
            <div><span class="thr-value" id="thrDispHumi">--</span><span class="thr-unit">%</span></div>
        </div>
        <div class="threshold-display-row">
            <span class="thr-label">土壤阈值</span>
            <div><span class="thr-value" id="thrDispSoil">--</span><span class="thr-unit">%</span></div>
        </div>
        <div class="threshold-display-row">
            <span class="thr-label">PH 阈值</span>
            <div><span class="thr-value" id="thrDispPh">--</span></div>
        </div>
    </div>

    <!-- 阈值设置卡 -->
    <div class="card">
        <div class="card-title">阈值设置</div>
        <div class="threshold-row">
            <span class="threshold-label">速度 (1~30)</span>
            <input type="number" class="threshold-input" id="thrInputSpeed" min="1" max="30" value="10">
            <button class="threshold-btn" onclick="setThreshold('speed')">发送</button>
        </div>
        <div class="threshold-row">
            <span class="threshold-label">温度 (0~50)</span>
            <input type="number" class="threshold-input" id="thrInputTemp" min="0" max="50" value="35">
            <button class="threshold-btn" onclick="setThreshold('temp')">发送</button>
        </div>
        <div class="threshold-row">
            <span class="threshold-label">湿度 (0~100)</span>
            <input type="number" class="threshold-input" id="thrInputHumi" min="0" max="100" value="80">
            <button class="threshold-btn" onclick="setThreshold('humi')">发送</button>
        </div>
        <div class="threshold-row">
            <span class="threshold-label">土壤 (0~100)</span>
            <input type="number" class="threshold-input" id="thrInputSoil" min="0" max="100" value="20">
            <button class="threshold-btn" onclick="setThreshold('soil')">发送</button>
        </div>
        <div class="threshold-row">
            <span class="threshold-label">PH (0.0~14.0)</span>
            <input type="number" class="threshold-input" id="thrInputPh" min="0" max="140" value="80" step="1">
            <button class="threshold-btn" onclick="setThreshold('ph')">发送</button>
        </div>
    </div>

    <!-- 日志卡 -->
    <div class="card log-card" onclick="toggleLog()">
        <div class="card-title">
            <span>日志记录</span>
            <span id="logArrow">▼</span>
        </div>
        <div class="log-content" id="logContent"></div>
    </div>

    <script src="mqtt.min.js"></script>
    <script>
        // ==================== MQTT Topic ====================
        const UPLOAD_TOPIC = '583924/471605/jinggaijiance/upload';
        const CMD_TOPIC = '583924/471605/jinggaijiance/cmd';

        // ==================== 数据状态 ====================
        let currentData = {
            speed: null, area: null, lat: null, lon: null,
            temp: null, humi: null, soil: null, ph: null,
            speed_thr: null, temp_thr: null, humi_thr: null, soil_thr: null, ph_thr: null
        };

        // ==================== 同步保护状态（5 个独立阈值） ====================
        let waitingSync = { speed: false, temp: false, humi: false, soil: false, ph: false };
        let pendingValue = { speed: null, temp: null, humi: null, soil: null, ph: null };
        let syncTimeoutTimer = { speed: null, temp: null, humi: null, soil: null, ph: null };
        let lastUserSetTime = { speed: 0, temp: 0, humi: 0, soil: 0, ph: 0 };

        const DEBOUNCE_MS = 500;
        const SYNC_TIMEOUT_MS = 5000;

        // ==================== 日志记录 ====================
        let logs = [];
        const MAX_LOGS = 20;

        function addLog(msg) {
            const time = new Date().toLocaleTimeString();
            logs.unshift(`[${time}] ${msg}`);
            if (logs.length > MAX_LOGS) logs.pop();
            renderLogs();
        }

        function renderLogs() {
            const el = document.getElementById('logContent');
            el.innerHTML = logs.map(l => `<div class="log-entry">${l}</div>`).join('');
        }

        function toggleLog() {
            const el = document.getElementById('logContent');
            const arrow = document.getElementById('logArrow');
            if (el.classList.contains('expanded')) {
                el.classList.remove('expanded');
                arrow.textContent = '▼';
            } else {
                el.classList.add('expanded');
                arrow.textContent = '▲';
            }
        }

        // ==================== MQTT 连接 ====================
        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
            clientId: 'webview_nongji_' + Math.random().toString(36).substr(2, 6),
            reconnectPeriod: 3000
        });

        client.on('connect', () => {
            document.getElementById('statusDot').classList.remove('disconnected');
            document.getElementById('statusDot').classList.add('connected');
            document.getElementById('statusText').textContent = '已连接';
            client.subscribe(UPLOAD_TOPIC);
            addLog('MQTT 已连接');
        });

        client.on('close', () => {
            document.getElementById('statusDot').classList.remove('connected');
            document.getElementById('statusDot').classList.add('disconnected');
            document.getElementById('statusText').textContent = '未连接';
            addLog('MQTT 断开');
        });

        client.on('message', (topic, payload) => {
            const msg = payload.toString();
            parseMessage(msg);
            addLog(`收到: ${msg}`);
        });

        // ==================== 数据解析（带同步保护） ====================
        function parseMessage(msg) {
            const parts = msg.split(',');
            if (parts.length < 5) return;

            // 完整 13 字段解析
            const newData = {
                speed: parseFloat(parts[0]),
                area: parseFloat(parts[1]),
                lat: parseFloat(parts[2]),
                lon: parseFloat(parts[3]),
                temp: parts.length > 4 && parts[4] !== '' ? parseInt(parts[4]) / 10.0 : null,
                humi: parts.length > 5 && parts[5] !== '' ? parseInt(parts[5]) : null,
                soil: parts.length > 6 && parts[6] !== '' ? parseInt(parts[6]) : null,
                ph: parts.length > 7 && parts[7] !== '' ? parseInt(parts[7]) / 10.0 : null,
                speed_thr: parts.length > 8 && parts[8] !== '' ? parseInt(parts[8]) : null,
                temp_thr: parts.length > 9 && parts[9] !== '' ? parseInt(parts[9]) : null,
                humi_thr: parts.length > 10 && parts[10] !== '' ? parseInt(parts[10]) : null,
                soil_thr: parts.length > 11 && parts[11] !== '' ? parseInt(parts[11]) : null,
                ph_thr: parts.length > 12 && parts[12] !== '' ? parseInt(parts[12]) / 10.0 : null
            };

            // 传感器值始终更新
            currentData.speed = newData.speed;
            currentData.area = newData.area;
            currentData.lat = newData.lat;
            currentData.lon = newData.lon;
            currentData.temp = newData.temp;
            currentData.humi = newData.humi;
            currentData.soil = newData.soil;
            currentData.ph = newData.ph;

            // 阈值同步逻辑
            const thresholds = ['speed', 'temp', 'humi', 'soil', 'ph'];
            const rawThrValues = [newData.speed_thr, newData.temp_thr, newData.humi_thr, newData.soil_thr, newData.ph_thr];
            const now = Date.now();

            for (let i = 0; i < thresholds.length; i++) {
                const key = thresholds[i];
                let hasPendingSync = waitingSync[key];

                // 检查同步确认
                if (hasPendingSync && pendingValue[key] !== null) {
                    const expected = pendingValue[key];
                    const received = rawThrValues[i];
                    const tolerance = (key === 'ph') ? 0.2 : 0.5;
                    if (Math.abs(received - expected) < tolerance) {
                        if (syncTimeoutTimer[key]) {
                            clearTimeout(syncTimeoutTimer[key]);
                            syncTimeoutTimer[key] = null;
                        }
                        waitingSync[key] = false;
                        pendingValue[key] = null;
                        lastUserSetTime[key] = 0;
                        console.log(`Sync confirmed for ${key}: ${received}`);
                    }
                }

                // 阈值更新（等待期间冻结）
                if (!lastUserSetTime[key] || (now - lastUserSetTime[key]) >= DEBOUNCE_MS) {
                    if (!waitingSync[key]) {
                        // 写入 currentData
                        if (key === 'speed') currentData.speed_thr = rawThrValues[i];
                        else if (key === 'temp') currentData.temp_thr = rawThrValues[i];
                        else if (key === 'humi') currentData.humi_thr = rawThrValues[i];
                        else if (key === 'soil') currentData.soil_thr = rawThrValues[i];
                        else if (key === 'ph') currentData.ph_thr = rawThrValues[i];
                    }
                }
            }

            updateUI();
            updateTime();
            checkAlarms();
        }

        // ==================== UI 更新 ====================
        function getThr(key) {
            return waitingSync[key] ? pendingValue[key] : currentData[key + '_thr'];
        }

        function updateUI() {
            // 速度
            if (currentData.speed !== null) {
                document.getElementById('speed').textContent = currentData.speed.toFixed(1);
                const thr = getThr('speed');
                document.getElementById('speedExcl').innerHTML = (thr !== null && currentData.speed >= thr) ? '<span class="alarm-exclamation">!</span>' : '';
            }
            // 面积
            if (currentData.area !== null) {
                document.getElementById('area').textContent = currentData.area.toFixed(2);
            }
            // GPS
            if (currentData.lat !== null && currentData.lon !== null) {
                if (currentData.lat === 0.0 && currentData.lon === 0.0) {
                    document.getElementById('gpsText').textContent = '定位中...';
                    document.getElementById('gpsCoords').style.display = 'none';
                } else {
                    document.getElementById('gpsText').textContent = '已定位';
                    document.getElementById('lat').textContent = currentData.lat.toFixed(4);
                    document.getElementById('lon').textContent = currentData.lon.toFixed(4);
                    document.getElementById('gpsCoords').style.display = 'block';
                    reverseGeo(currentData.lat, currentData.lon);
                }
            }
            // 温度
            if (currentData.temp !== null) {
                document.getElementById('temp').textContent = currentData.temp.toFixed(1);
                const thr = getThr('temp');
                document.getElementById('tempExcl').innerHTML = (thr !== null && currentData.temp > thr) ? '<span class="alarm-exclamation">!</span>' : '';
            }
            // 湿度
            if (currentData.humi !== null) {
                document.getElementById('humi').textContent = currentData.humi;
                const thr = getThr('humi');
                document.getElementById('humiExcl').innerHTML = (thr !== null && currentData.humi > thr) ? '<span class="alarm-exclamation">!</span>' : '';
            }
            // 土壤湿度
            if (currentData.soil !== null) {
                document.getElementById('soil').textContent = currentData.soil;
                const thr = getThr('soil');
                // soil=0 视为未放入土壤，不报警
                document.getElementById('soilExcl').innerHTML = (thr !== null && currentData.soil > 0 && currentData.soil < thr) ? '<span class="alarm-exclamation">!</span>' : '';
            }
            // PH 值
            if (currentData.ph !== null) {
                document.getElementById('ph').textContent = currentData.ph.toFixed(1);
                const thr = getThr('ph');
                document.getElementById('phExcl').innerHTML = (thr !== null && currentData.ph > thr) ? '<span class="alarm-exclamation">!</span>' : '';
            }
            // 阈值显示
            const speedThrVal = getThr('speed');
            if (speedThrVal !== null) document.getElementById('thrDispSpeed').textContent = speedThrVal;
            const tempThrVal = getThr('temp');
            if (tempThrVal !== null) document.getElementById('thrDispTemp').textContent = tempThrVal;
            const humiThrVal = getThr('humi');
            if (humiThrVal !== null) document.getElementById('thrDispHumi').textContent = humiThrVal;
            const soilThrVal = getThr('soil');
            if (soilThrVal !== null) document.getElementById('thrDispSoil').textContent = soilThrVal;
            const phThrVal = getThr('ph');
            if (phThrVal !== null) document.getElementById('thrDispPh').textContent = phThrVal.toFixed(1);
        }

        function updateTime() {
            const now = new Date();
            document.getElementById('updateTime').textContent = now.toLocaleTimeString();
        }

        // ==================== GPS 逆地理编码 ====================
        function reverseGeo(lat, lon) {
            if (lat === 0 || lon === 0) return;
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=zh-CN&zoom=10`)
                .then(r => r.json())
                .then(data => {
                    if (data.address) {
                        const parts = [];
                        if (data.address.city || data.address.town) parts.push(data.address.city || data.address.town);
                        if (data.address.county) parts.push(data.address.county);
                        if (data.address.state) parts.push(data.address.state);
                        if (parts.length > 0) {
                            document.getElementById('gpsText').textContent = parts.join(' · ');
                        }
                    }
                })
                .catch(() => {});
        }

        // ==================== 报警判断 ====================
        function checkAlarms() {
            const thrSpeed = getThr('speed');
            if (currentData.speed !== null && thrSpeed !== null && currentData.speed >= thrSpeed) {
                document.getElementById('alarmContainer').innerHTML = '<div class="alarm-badge">超速报警</div>';
            } else {
                document.getElementById('alarmContainer').innerHTML = '<div class="alarm-ok">运行正常 ✓</div>';
            }
        }

        // ==================== 下行指令 ====================
        function sendMute() {
            client.publish(CMD_TOPIC, '01');
            addLog('发送消警指令: 01');
        }

        function setThreshold(key) {
            const cmdMap = { speed: '02', temp: '03', humi: '04', soil: '05', ph: '06' };
            const inputMap = { speed: 'thrInputSpeed', temp: 'thrInputTemp', humi: 'thrInputHumi', soil: 'thrInputSoil', ph: 'thrInputPh' };
            const thrKeyMap = { speed: 'speed_thr', temp: 'temp_thr', humi: 'humi_thr', soil: 'soil_thr', ph: 'ph_thr' };

            const input = document.getElementById(inputMap[key]);
            let value = parseFloat(input.value);
            if (isNaN(value)) {
                alert('请输入有效数值');
                return;
            }

            const cmd = cmdMap[key];

            // PH 阈值需要 ×10 发送
            let sendValue = value;
            let displayValue = value;
            if (key === 'ph') {
                sendValue = Math.round(value * 10);
            } else {
                sendValue = Math.round(value);
            }

            // 范围检查
            const rangeMap = {
                speed: [1, 30], temp: [0, 50], humi: [0, 100], soil: [0, 100], ph: [0, 140]
            };
            const [min, max] = rangeMap[key];
            if (sendValue < min || sendValue > max) {
                alert(`阈值范围: ${min}~${max}`);
                return;
            }

            // 检查是否正在等待同步
            if (waitingSync[key]) {
                return;
            }

            // 设置等待同步状态
            waitingSync[key] = true;
            pendingValue[key] = (key === 'ph') ? sendValue / 10.0 : sendValue;

            // 发送指令
            client.publish(CMD_TOPIC, `${cmd},${sendValue}`);
            addLog(`发送阈值指令: ${cmd},${sendValue}`);

            // 记录用户操作时间
            lastUserSetTime[key] = Date.now();

            // 立即更新显示（预测状态）
            currentData[thrKeyMap[key]] = pendingValue[key];
            updateUI();
            checkAlarms();

            // 超时保护
            syncTimeoutTimer[key] = setTimeout(() => {
                if (waitingSync[key]) {
                    console.warn(`Sync timeout for ${key}, releasing protection`);
                    waitingSync[key] = false;
                    pendingValue[key] = null;
                    syncTimeoutTimer[key] = null;
                }
            }, SYNC_TIMEOUT_MS);

            input.blur();
        }
    </script>
</body>
</html>
