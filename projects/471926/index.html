<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>智能停车场系统</title>
    <style>
        :root {
            --bg: #F5F5F5;
            --card: #FFFFFF;
            --primary: #2196F3;
            --alarm: #F44336;
            --ok: #4CAF50;
            --text: #212121;
            --sub: #757575;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 0 12px 24px;
            max-width: 420px;
            margin: 0 auto;
        }
        h3 { font-size: 15px; font-weight: 600; margin-bottom: 10px; }

        /* 状态栏 */
        .status-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 0; position: sticky; top: 0; z-index: 10;
            background: var(--bg);
        }
        .status-left { display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--alarm); }
        .status-dot.connected { background: var(--ok); }
        .status-text { font-size: 13px; color: var(--sub); }
        .sys-name { font-size: 14px; font-weight: 600; }

        /* 通用卡片 */
        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 16px;
            margin-bottom: 12px;
        }

        /* 蓝牙连接卡 */
        .connect-card { border-left: 4px solid #FF9800; }
        .bt-status-row { margin: 12px 0; font-size: 14px; }
        .status-text-bt { font-weight: bold; }
        .status-connected { color: var(--ok); }
        .status-disconnected { color: var(--alarm); }
        .device-select {
            width: 100%; padding: 10px; margin: 8px 0;
            border-radius: 6px; border: 1px solid #ddd; font-size: 14px;
        }
        .bt-btn {
            width: 100%; height: 44px; margin-top: 8px; border-radius: 8px;
            border: none; color: white; font-size: 14px; font-weight: bold;
            cursor: pointer;
        }
        .bt-btn:active { opacity: 0.85; }
        .bt-btn-primary { background: var(--primary); }
        .bt-btn-danger { background: #FF5722; }

        /* 实时数据 */
        .data-row {
            display: flex; align-items: baseline; justify-content: space-between;
            padding: 8px 0; border-bottom: 1px solid #f0f0f0;
        }
        .data-row:last-child { border-bottom: none; }
        .data-label { font-size: 13px; color: var(--sub); }
        .data-value { font-size: 28px; font-weight: bold; }
        .data-value.alarm { color: var(--alarm); }
        .data-unit { font-size: 13px; color: var(--sub); margin-left: 4px; }

        /* 车位状态 — 4态 */
        .spots-grid { display: flex; gap: 12px; }
        .spot-item {
            flex: 1; text-align: center; padding: 16px 8px;
            border-radius: 10px; background: #f8f8f8; transition: all 0.3s;
        }
        .spot-item.free      { background: #E8F5E9; border: 2px solid var(--ok); }
        .spot-item.allocated { background: #E3F2FD; border: 2px solid #2196F3; }
        .spot-item.occupied  { background: #FFEBEE; border: 2px solid var(--alarm); }
        .spot-item.reserved  { background: #F3E5F5; border: 2px solid #9C27B0; }
        .spot-icon { font-size: 32px; margin-bottom: 6px; }
        .spot-name { font-size: 13px; font-weight: 600; }
        .spot-status { font-size: 11px; margin-top: 2px; }
        .spot-item.free .spot-status      { color: var(--ok); }
        .spot-item.allocated .spot-status { color: #2196F3; }
        .spot-item.occupied .spot-status  { color: var(--alarm); }
        .spot-item.reserved .spot-status  { color: #9C27B0; }

        /* 报警状态 */
        .alarm-item {
            background: #FFEBEE; color: var(--alarm); padding: 10px 12px;
            border-radius: 8px; margin-bottom: 6px; font-size: 13px; font-weight: 500;
        }
        .alarm-item:last-child { margin-bottom: 0; }
        .alarm-ok { color: var(--ok); font-size: 13px; text-align: center; padding: 8px; }

        /* 在场车辆卡 */
        .vehicle-item {
            background: #f8f8f8; border-radius: 10px; padding: 12px; margin-bottom: 8px;
        }
        .vehicle-item:last-child { margin-bottom: 0; }
        .vehicle-uid { font-size: 14px; font-weight: 600; font-family: monospace; }
        .vehicle-meta { font-size: 12px; color: var(--sub); margin: 4px 0 8px; }
        .vehicle-fee { font-size: 22px; font-weight: bold; color: var(--text); }
        .vehicle-pay-btn {
            width: 100%; height: 44px; border: none; border-radius: 8px;
            background: var(--ok); color: #fff; font-size: 14px; font-weight: 600;
            cursor: pointer; margin-top: 8px;
        }
        .vehicle-pay-btn:active { opacity: 0.85; }
        .vehicle-pay-btn.paid { background: #FF9800; }
        .vehicle-empty { font-size: 13px; color: var(--sub); text-align: center; padding: 12px; }

        /* 控制按钮 */
        .ctrl-btn {
            width: 100%; height: 50px; border: none; border-radius: 8px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            margin-bottom: 8px; transition: all 0.15s;
        }
        .ctrl-btn:active { transform: scale(0.97); opacity: 0.85; }
        .ctrl-btn:last-child { margin-bottom: 0; }
        .btn-alarm { background: #FFCDD2; color: #C62828; }
        .btn-pay { background: #E8F5E9; color: #2E7D32; }
        .btn-reserve { background: #E3F2FD; color: #1565C0; }
        .btn-cancel { background: #FFF3E0; color: #E65100; }
        .btn-query { background: #F3E5F5; color: #7B1FA2; }

        /* 预约 */
        .reserve-row {
            display: flex; gap: 8px; margin-bottom: 8px; align-items: center;
        }
        .spot-sel {
            flex: 1; height: 48px; border: 2px solid #e0e0e0; border-radius: 8px;
            background: #fafafa; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: all 0.15s;
        }
        .spot-sel.selected { border-color: var(--primary); background: #E3F2FD; color: var(--primary); }
        .reserve-info { font-size: 13px; color: var(--sub); margin: 8px 0; }
        .countdown { font-size: 22px; font-weight: bold; color: var(--primary); text-align: center; margin: 8px 0; }

        /* 支付卡 */
        .fee-display { text-align: center; margin-bottom: 12px; }
        .fee-amount { font-size: 36px; font-weight: bold; color: var(--text); }
        .fee-label { font-size: 13px; color: var(--sub); }
        .fee-rate { font-size: 12px; color: var(--sub); margin-top: 4px; }

        /* 阈值设置 */
        .threshold-row {
            display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
        }
        .threshold-row:last-child { margin-bottom: 0; }
        .thr-label { font-size: 13px; flex: 1; }
        .thr-input {
            width: 80px; height: 40px; border: 1px solid #e0e0e0; border-radius: 8px;
            text-align: center; font-size: 14px; outline: none;
        }
        .thr-input:focus { border-color: var(--primary); }
        .thr-send {
            height: 40px; min-width: 60px; border: none; border-radius: 8px;
            background: var(--primary); color: #fff; font-size: 13px;
            font-weight: 600; cursor: pointer;
        }
        .thr-send:active { opacity: 0.8; }

        /* 日志（折叠） */
        .log-header {
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; user-select: none;
        }
        .log-toggle { font-size: 12px; color: var(--sub); }
        .log-body { display: none; max-height: 200px; overflow-y: auto; margin-top: 10px; }
        .log-body.show { display: block; }
        .log-line { font-size: 11px; color: var(--sub); padding: 3px 0; border-bottom: 1px solid #f5f5f5; font-family: monospace; }

        /* RFID状态 */
        .rfid-badge {
            display: inline-block; padding: 2px 8px; border-radius: 6px;
            font-size: 12px; font-weight: 600;
        }
        .rfid-0 { background: #f0f0f0; color: #999; }
        .rfid-1 { background: #E8F5E9; color: #2E7D32; }
        .rfid-2 { background: #FFEBEE; color: #C62828; }
        .rfid-3 { background: #E3F2FD; color: #1565C0; }

        /* 满位报警弹窗 */
        .full-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4); z-index: 100;
            align-items: center; justify-content: center;
        }
        .full-overlay.show { display: flex; }
        .full-modal {
            background: #fff; border-radius: 16px; padding: 24px;
            max-width: 300px; text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .full-modal h2 { color: var(--alarm); font-size: 20px; margin-bottom: 8px; }
        .full-modal p { font-size: 14px; color: var(--sub); margin-bottom: 16px; }
        .full-modal button {
            height: 44px; width: 100%; border: none; border-radius: 8px;
            background: var(--alarm); color: #fff; font-size: 15px;
            font-weight: 600; cursor: pointer;
        }
    </style>
</head>
<body>

<!-- 状态栏 -->
<div class="status-bar">
    <div class="status-left">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">未连接</span>
    </div>
    <span class="sys-name">智能停车场</span>
</div>

<!-- 蓝牙连接卡 -->
<div class="card connect-card" id="connectCard">
    <h3>蓝牙连接</h3>
    <div class="bt-status-row">
        <span class="status-label">状态：</span>
        <span id="btStatus" class="status-text-bt status-disconnected">未连接</span>
    </div>
    <button class="bt-btn bt-btn-primary" id="btnScan" onclick="scanDevices()">扫描设备</button>
    <select id="deviceList" class="device-select"></select>
    <button class="bt-btn bt-btn-primary" id="btnConnect" onclick="connectSelected()">连接</button>
    <button class="bt-btn bt-btn-danger" id="btnDisconnect" onclick="disconnectBt()" style="display:none">断开</button>
</div>

<!-- 实时数据卡 -->
<div class="card">
    <h3>实时数据</h3>
    <div class="data-row">
        <span class="data-label">入口距离</span>
        <div><span class="data-value" id="v_ent_dist">--</span><span class="data-unit">cm</span></div>
    </div>
    <div class="data-row">
        <span class="data-label">车位1 距离</span>
        <div><span class="data-value" id="v_s1_dist">--</span><span class="data-unit">cm</span></div>
    </div>
    <div class="data-row">
        <span class="data-label">车位2 距离</span>
        <div><span class="data-value" id="v_s2_dist">--</span><span class="data-unit">cm</span></div>
    </div>
    <div class="data-row">
        <span class="data-label">车位3 距离</span>
        <div><span class="data-value" id="v_s3_dist">--</span><span class="data-unit">cm</span></div>
    </div>
    <div class="data-row">
        <span class="data-label">RFID 状态</span>
        <span class="rfid-badge rfid-0" id="v_rfid">无卡</span>
    </div>
    <div class="data-row">
        <span class="data-label">时间</span>
        <div><span class="data-value" id="v_time" style="font-size:22px;">--:--:--</span></div>
    </div>
</div>

<!-- 车位状态卡（4态） -->
<div class="card">
    <h3>车位状态</h3>
    <div class="spots-grid">
        <div class="spot-item free" id="spot1">
            <div class="spot-icon">&#128663;</div>
            <div class="spot-name">车位1</div>
            <div class="spot-status">空闲</div>
        </div>
        <div class="spot-item free" id="spot2">
            <div class="spot-icon">&#128663;</div>
            <div class="spot-name">车位2</div>
            <div class="spot-status">空闲</div>
        </div>
        <div class="spot-item free" id="spot3">
            <div class="spot-icon">&#128663;</div>
            <div class="spot-name">车位3</div>
            <div class="spot-status">空闲</div>
        </div>
    </div>
</div>

<!-- 报警状态卡 -->
<div class="card">
    <h3>报警状态</h3>
    <div id="alarmBox"><div class="alarm-ok">运行正常 &#10003;</div></div>
</div>

<!-- 在场车辆卡 -->
<div class="card">
    <h3>在场车辆</h3>
    <div id="vehicleList"><div class="vehicle-empty">暂无在场车辆</div></div>
</div>

<!-- 预约卡 -->
<div class="card">
    <h3>车位预约</h3>
    <div class="reserve-row">
        <button class="spot-sel" data-spot="1" onclick="selSpot(1)">车位1</button>
        <button class="spot-sel" data-spot="2" onclick="selSpot(2)">车位2</button>
        <button class="spot-sel" data-spot="3" onclick="selSpot(3)">车位3</button>
    </div>
    <div class="reserve-info" id="reserveInfo">当前无预约</div>
    <div class="countdown" id="reserveCountdown"></div>
    <button class="ctrl-btn btn-reserve" onclick="doReserve()">预约选定车位</button>
    <button class="ctrl-btn btn-cancel" onclick="cancelReserve()">取消预约</button>
    <button class="ctrl-btn btn-query" onclick="queryReserve()">查询预约状态</button>
</div>

<!-- 支付卡 -->
<div class="card">
    <h3>停车费用</h3>
    <div class="fee-display">
        <div class="fee-label">累计费用</div>
        <div class="fee-amount" id="v_fee">&#165;0.00</div>
        <div class="fee-rate" id="v_rate_info">费率：-- 元/小时</div>
    </div>
    <button class="ctrl-btn btn-pay" onclick="confirmPay()">确认支付并抬闸</button>
</div>

<!-- 阈值设置卡 -->
<div class="card">
    <h3>阈值设置</h3>
    <div class="threshold-row">
        <span class="thr-label">入口检测阈值 (cm)</span>
        <input class="thr-input" id="thr_ent" type="number" min="10" max="80" value="30">
        <button class="thr-send" onclick="sendThreshold('02','thr_ent')">发送</button>
    </div>
    <div class="threshold-row">
        <span class="thr-label">车位占用阈值 (cm)</span>
        <input class="thr-input" id="thr_spot" type="number" min="5" max="50" value="10">
        <button class="thr-send" onclick="sendThreshold('03','thr_spot')">发送</button>
    </div>
    <div class="threshold-row">
        <span class="thr-label">费率 (元/小时)</span>
        <input class="thr-input" id="thr_rate" type="number" min="1" max="20" value="5">
        <button class="thr-send" onclick="sendThreshold('04','thr_rate')">发送</button>
    </div>
</div>

<!-- 控制卡 -->
<div class="card">
    <h3>快捷控制</h3>
    <button class="ctrl-btn btn-alarm" onclick="sendCmd('01')">消警</button>
</div>

<!-- 日志卡（折叠） -->
<div class="card">
    <div class="log-header" onclick="toggleLog()">
        <h3 style="margin-bottom:0;">通信日志</h3>
        <span class="log-toggle" id="logToggle">&#9654; 展开</span>
    </div>
    <div class="log-body" id="logBody"></div>
</div>

<!-- 满位报警弹窗 -->
<div class="full-overlay" id="fullOverlay">
    <div class="full-modal">
        <h2>&#9888; 满位报警</h2>
        <p>3个车位全部占用，停车场已满！</p>
        <button onclick="dismissFullAlarm()">我知道了</button>
    </div>
</div>

<script>
    // ==================== 蓝牙通信状态 ====================
    let isBtConnected = false;
    let logExpanded = false;
    let selectedSpot = 1;

    // 数据状态
    let currentData = {
        s1_dist: 0, s2_dist: 0, s3_dist: 0, ent_dist: 0,
        rfid: 0, s1_sts: 0, s2_sts: 0, s3_sts: 0,
        res_sts: 0, rate: 5, fee: 0,
        hh: 0, mm: 0, ss: 0,
        ent_th: 30, spot_th: 10
    };

    // 阈值同步状态机
    let waitingSync = { ent: false, spot: false, rate: false };

    // 在场车辆列表
    let parkedCars = [];

    // 车位4态状态机（APP端维护，对应 PRD 空闲/已分配/已占用/已预约）
    let spotStates = ['free', 'free', 'free'];  // 3个车位的当前状态
    let reservedSpots = new Set();                // APP预约的车位号集合
    let paidSpots = new Set();                    // 已支付但车未离开的车位

    // ==================== 蓝牙控制函数 ====================
    function scanDevices() {
        if (window.BluetoothBridge) {
            window.BluetoothBridge.getPairedDevices();
            addLog('BT: 扫描已配对设备');
        } else {
            alert('请在 Android WebView 环境中运行');
        }
    }

    function connectSelected() {
        const addr = document.getElementById('deviceList').value;
        if (!addr) { alert('请先选择设备'); return; }
        if (window.BluetoothBridge) {
            window.BluetoothBridge.connect(addr);
            addLog('BT: 连接 ' + addr);
        }
    }

    function disconnectBt() {
        if (window.BluetoothBridge) {
            window.BluetoothBridge.disconnect();
            addLog('BT: 断开连接');
        }
    }

    function sendViaBt(cmd) {
        if (!isBtConnected) {
            alert('蓝牙未连接，请先连接设备');
            return;
        }
        if (window.BluetoothBridge) {
            window.BluetoothBridge.send(cmd + '\n');
            addLog('TX: ' + cmd);
        }
    }

    // ==================== 回调函数（Android 调用） ====================
    window.onBtDeviceList = function(deviceArray) {
        const select = document.getElementById('deviceList');
        select.innerHTML = '';
        deviceArray.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d.address;
            opt.textContent = d.name + ' (' + d.address + ')';
            select.appendChild(opt);
        });
        addLog('BT: 发现 ' + deviceArray.length + ' 个设备');
    };

    window.onBtConnected = function(address) {
        isBtConnected = true;
        document.getElementById('btStatus').textContent = '已连接：' + address;
        document.getElementById('btStatus').className = 'status-text-bt status-connected';
        document.getElementById('statusDot').classList.add('connected');
        document.getElementById('statusText').textContent = '蓝牙已连接';
        document.getElementById('btnScan').style.display = 'none';
        document.getElementById('deviceList').disabled = true;
        document.getElementById('btnConnect').style.display = 'none';
        document.getElementById('btnDisconnect').style.display = 'block';
        addLog('BT: 已连接 ' + address);
    };

    window.onBtDisconnected = function() {
        isBtConnected = false;
        document.getElementById('btStatus').textContent = '未连接';
        document.getElementById('btStatus').className = 'status-text-bt status-disconnected';
        document.getElementById('statusDot').classList.remove('connected');
        document.getElementById('statusText').textContent = '未连接';
        document.getElementById('btnScan').style.display = 'block';
        document.getElementById('deviceList').disabled = false;
        document.getElementById('btnConnect').style.display = 'block';
        document.getElementById('btnDisconnect').style.display = 'none';
        addLog('BT: 已断开');
    };

    window.onBtError = function(errMsg) {
        alert('蓝牙错误：' + errMsg);
        isBtConnected = false;
        window.onBtDisconnected();
    };

    window.onBtData = function(line) {
        addLog('RX: ' + line);
        const trimmed = line.trim();
        if (trimmed.startsWith('CARD,')) {
            handleCardEvent(trimmed);
        } else {
            parseAndUpdate(trimmed);
        }
    };

    // ==================== 刷卡事件处理 ====================
    function handleCardEvent(msg) {
        const parts = msg.split(',');
        if (parts.length < 4) return;
        const uid = parts[1];       // UID_xxxxxxxx
        const timestamp = parts[2]; // HHMMSS
        const sts = parseInt(parts[3]);

        const statusMap = { 1: '有效卡', 2: '无效卡', 3: '预约卡' };
        const statusText = statusMap[sts] || '未知卡';

        if (sts === 1 || sts === 3) {
            const exists = parkedCars.find(c => c.uid === uid);
            if (!exists) {
                // 分配第一个空闲车位（4态：free 状态）
                let spotIdx = spotStates.indexOf('free');
                if (spotIdx === -1) {
                    addLog('无空闲车位，拒绝分配');
                    return;
                }
                parkedCars.push({
                    uid: uid,
                    entryTime: timestamp,
                    fee: 0,
                    spotIndex: spotIdx,
                    paid: false
                });
                // 预约卡 → 已预约(P)，有效卡 → 已分配(B)
                spotStates[spotIdx] = (sts === 3) ? 'reserved' : 'allocated';
                addLog('入场: ' + uid + ' @' + timestamp + ' → 车位' + (spotIdx + 1));
                renderVehicles();
            }
        } else if (sts === 2) {
            addLog('无效卡: ' + uid);
        }
    }

    // ==================== 周期数据解析 ====================
    function parseAndUpdate(msg) {
        const parts = msg.split(',');
        if (parts.length < 16) { addLog('数据字段不足，忽略'); return; }

        const newData = {
            s1_dist: parseInt(parts[0]),
            s2_dist: parseInt(parts[1]),
            s3_dist: parseInt(parts[2]),
            ent_dist: parseInt(parts[3]),
            rfid: parseInt(parts[4]),
            s1_sts: parseInt(parts[5]),
            s2_sts: parseInt(parts[6]),
            s3_sts: parseInt(parts[7]),
            res_sts: parseInt(parts[8]),
            rate: parseInt(parts[9]),
            fee: parseInt(parts[10]),
            hh: parseInt(parts[11]),
            mm: parseInt(parts[12]),
            ss: parseInt(parts[13]),
            ent_th: parseInt(parts[14]),
            spot_th: parseInt(parts[15])
        };

        currentData.s1_dist = newData.s1_dist;
        currentData.s2_dist = newData.s2_dist;
        currentData.s3_dist = newData.s3_dist;
        currentData.ent_dist = newData.ent_dist;
        currentData.rfid = newData.rfid;
        currentData.s1_sts = newData.s1_sts;
        currentData.s2_sts = newData.s2_sts;
        currentData.s3_sts = newData.s3_sts;
        currentData.res_sts = newData.res_sts;
        currentData.fee = newData.fee;
        currentData.hh = newData.hh;
        currentData.mm = newData.mm;
        currentData.ss = newData.ss;

        if (!waitingSync.ent) currentData.ent_th = newData.ent_th;
        if (!waitingSync.spot) currentData.spot_th = newData.spot_th;
        if (!waitingSync.rate) currentData.rate = newData.rate;

        if (waitingSync.ent && Math.abs(newData.ent_th - currentData.ent_th) < 1) waitingSync.ent = false;
        if (waitingSync.spot && Math.abs(newData.spot_th - currentData.spot_th) < 1) waitingSync.spot = false;
        if (waitingSync.rate && Math.abs(newData.rate - currentData.rate) < 1) waitingSync.rate = false;

        updateVehicleFees();
        updateSpotStates();  // 4态状态机更新
        updateUI();
        checkVehicleDeparture();

        if (!waitingSync.ent && !waitingSync.spot && !waitingSync.rate) {
            checkAlarms();
        }
    }

    // ==================== 车位4态状态机 ====================
    function isSpotOccupied(idx) {
        const dists = [currentData.s1_dist, currentData.s2_dist, currentData.s3_dist];
        const d = dists[idx];
        return d > 0 && d !== 999 && d < currentData.spot_th;
    }

    function updateSpotStates() {
        for (let i = 0; i < 3; i++) {
            const occ = isSpotOccupied(i);
            const st = spotStates[i];

            switch (st) {
                case 'free':
                    if (occ) spotStates[i] = 'occupied';
                    else if (reservedSpots.has(i + 1)) spotStates[i] = 'reserved';
                    break;
                case 'allocated':
                    if (occ) spotStates[i] = 'occupied';
                    break;
                case 'occupied':
                    if (!occ) {
                        // 车离开：已支付 → free，未支付 → 保持 occupied
                        if (paidSpots.has(i)) {
                            spotStates[i] = 'free';
                            paidSpots.delete(i);
                            reservedSpots.delete(i + 1);
                        }
                    }
                    break;
                case 'reserved':
                    if (occ) {
                        spotStates[i] = 'occupied';
                        reservedSpots.delete(i + 1);
                    }
                    break;
            }
        }
        // 所有车位空闲时，清理残留
        if (spotStates.every(s => s === 'free')) {
            paidSpots.clear();
            reservedSpots.clear();
        }
    }

    // ==================== UI 更新 ====================
    function updateUI() {
        setDist('v_ent_dist', currentData.ent_dist);
        setDist('v_s1_dist', currentData.s1_dist);
        setDist('v_s2_dist', currentData.s2_dist);
        setDist('v_s3_dist', currentData.s3_dist);

        const entEl = document.getElementById('v_ent_dist');
        entEl.classList.toggle('alarm', currentData.ent_dist > 0 && currentData.ent_dist !== 999 && currentData.ent_dist < currentData.ent_th);

        const rfidEl = document.getElementById('v_rfid');
        const rfidMap = { 0: ['无卡', 'rfid-0'], 1: ['有效卡', 'rfid-1'], 2: ['无效卡', 'rfid-2'], 3: ['预约卡', 'rfid-3'] };
        const [rfidTxt, rfidCls] = rfidMap[currentData.rfid] || ['未知', 'rfid-0'];
        rfidEl.textContent = rfidTxt;
        rfidEl.className = 'rfid-badge ' + rfidCls;

        document.getElementById('v_time').textContent =
            pad(currentData.hh) + ':' + pad(currentData.mm) + ':' + pad(currentData.ss);

        updateSpotUI('spot1', spotStates[0]);
        updateSpotUI('spot2', spotStates[1]);
        updateSpotUI('spot3', spotStates[2]);

        document.getElementById('v_fee').textContent = '¥' + (currentData.fee / 100).toFixed(2);
        document.getElementById('v_rate_info').textContent = '费率：' + currentData.rate + ' 元/小时';

        if (currentData.res_sts > 0) {
            document.getElementById('reserveInfo').textContent = '已预约，剩余 ' + currentData.res_sts + ' 分钟';
            document.getElementById('reserveCountdown').textContent = currentData.res_sts + ' min';
        } else {
            document.getElementById('reserveInfo').textContent = '当前无预约';
            document.getElementById('reserveCountdown').textContent = '';
        }

        if (!waitingSync.ent) document.getElementById('thr_ent').value = currentData.ent_th;
        if (!waitingSync.spot) document.getElementById('thr_spot').value = currentData.spot_th;
        if (!waitingSync.rate) document.getElementById('thr_rate').value = currentData.rate;
    }

    function setDist(elId, val) {
        const el = document.getElementById(elId);
        el.textContent = (val === 0 || val === 999) ? '--' : val;
    }

    function updateSpotUI(elId, state) {
        const el = document.getElementById(elId);
        el.classList.remove('free', 'allocated', 'occupied', 'reserved');
        el.classList.add(state);

        const icons = { free: '\u{1F697}', allocated: '\u{1F535}', occupied: '\u{1F534}', reserved: '\u{1F7E3}' };
        const labels = { free: '空闲', allocated: '已分配', occupied: '已占用', reserved: '已预约' };
        el.querySelector('.spot-icon').innerHTML = icons[state] || '\u{1F697}';
        el.querySelector('.spot-status').textContent = labels[state] || '未知';
    }

    function pad(n) { return String(n).padStart(2, '0'); }

    // ==================== 在场车辆管理 ====================
    function updateVehicleFees() {
        parkedCars.forEach(car => {
            car.fee = currentData.fee / 100;
        });
        renderVehicles();
    }

    function renderVehicles() {
        const container = document.getElementById('vehicleList');
        if (parkedCars.length === 0) {
            container.innerHTML = '<div class="vehicle-empty">暂无在场车辆</div>';
            return;
        }
        container.innerHTML = parkedCars.map((car, i) => {
            const paidClass = car.paid ? ' paid' : '';
            const btnText = car.paid ? '已支付，等待离开' : '支付并出场';
            return '<div class="vehicle-item">' +
                '<div class="vehicle-uid">' + car.uid + '</div>' +
                '<div class="vehicle-meta">入场时间：' + formatTime(car.entryTime) + ' · 车位' + (car.spotIndex + 1) + '</div>' +
                '<div class="vehicle-fee">¥' + car.fee.toFixed(2) + '</div>' +
                '<button class="vehicle-pay-btn' + paidClass + '" onclick="payVehicle(' + i + ')">' + btnText + '</button>' +
            '</div>';
        }).join('');
    }

    function formatTime(ts) {
        const s = String(ts);
        if (s.length === 6) return s.substring(0,2) + ':' + s.substring(2,4) + ':' + s.substring(4,6);
        return ts;
    }

    function payVehicle(index) {
        if (index >= 0 && index < parkedCars.length) {
            const car = parkedCars[index];
            if (car.paid) {
                addLog('车辆 ' + car.uid + ' 已支付，等待车离开');
                return;
            }
            sendViaBt('05');
            car.paid = true;
            paidSpots.add(car.spotIndex);
            addLog('支付: ' + car.uid + ' → 等待车离开');
            renderVehicles();
        }
    }

    // 检测车位空闲 → 移除车辆记录
    function checkVehicleDeparture() {
        for (let i = parkedCars.length - 1; i >= 0; i--) {
            const car = parkedCars[i];
            if (spotStates[car.spotIndex] === 'free') {
                addLog('车辆已离开: ' + car.uid);
                parkedCars.splice(i, 1);
                renderVehicles();
            }
        }
    }

    // ==================== 报警判断 ====================
    function checkAlarms() {
        const alarms = [];

        if (currentData.ent_dist > 0 && currentData.ent_dist !== 999 && currentData.ent_dist < currentData.ent_th) {
            alarms.push('入口有车，请刷卡');
        }

        const fullCount = spotStates.filter(s => s === 'occupied').length;
        if (fullCount === 3) {
            alarms.push('满位报警！3个车位全部占用');
            document.getElementById('fullOverlay').classList.add('show');
            playAlarmSound();
        } else {
            document.getElementById('fullOverlay').classList.remove('show');
        }

        renderAlarms(alarms);
    }

    function renderAlarms(alarms) {
        const box = document.getElementById('alarmBox');
        if (alarms.length === 0) {
            box.innerHTML = '<div class="alarm-ok">运行正常 &#10003;</div>';
        } else {
            box.innerHTML = alarms.map(a => '<div class="alarm-item">' + a + '</div>').join('');
        }
    }

    let audioCtx = null;
    function playAlarmSound() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.value = 800; gain.gain.value = 0.1;
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } catch (e) {}
    }

    function dismissFullAlarm() {
        document.getElementById('fullOverlay').classList.remove('show');
    }

    // ==================== 下行指令 ====================
    function sendCmd(cmd) {
        sendViaBt(cmd);
        if (cmd === '01') {
            renderAlarms([]);
            dismissFullAlarm();
        }
    }

    function sendThreshold(code, inputId) {
        const val = parseInt(document.getElementById(inputId).value);
        if (isNaN(val)) return;
        sendViaBt(code + ',' + val);

        if (code === '02') { waitingSync.ent = true; currentData.ent_th = val; }
        else if (code === '03') { waitingSync.spot = true; currentData.spot_th = val; }
        else if (code === '04') { waitingSync.rate = true; currentData.rate = val; }

        updateUI();
        if (code === '03') checkAlarms();
    }

    // 预约
    function selSpot(n) {
        selectedSpot = n;
        document.querySelectorAll('.spot-sel').forEach(el => {
            el.classList.toggle('selected', parseInt(el.dataset.spot) === n);
        });
    }

    function doReserve() {
        if (spotStates[selectedSpot - 1] !== 'free') {
            alert('车位' + selectedSpot + '当前不可预约');
            return;
        }
        sendViaBt('06,' + selectedSpot);
        addLog('预约车位' + selectedSpot);
    }
    function cancelReserve() { sendViaBt('07'); }
    function queryReserve() { sendViaBt('08'); }
    function confirmPay() { sendViaBt('05'); }

    // ==================== 日志 ====================
    function addLog(msg) {
        const body = document.getElementById('logBody');
        const now = new Date();
        const ts = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
        const line = document.createElement('div');
        line.className = 'log-line';
        line.textContent = '[' + ts + '] ' + msg;
        body.insertBefore(line, body.firstChild);
        while (body.children.length > 20) body.removeChild(body.lastChild);
    }

    function toggleLog() {
        logExpanded = !logExpanded;
        document.getElementById('logBody').classList.toggle('show', logExpanded);
        document.getElementById('logToggle').textContent = logExpanded ? '▼ 收起' : '▶ 展开';
    }

    // ==================== 启动 ====================
    selSpot(1);
</script>

</body>
</html>
