<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无法访问此页 - Microsoft Edge</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            background: #f7f7f7;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            color: #1b1b1b;
            font-size: 15px;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .wrap {
            max-width: 560px;
            width: 100%;
        }
        .icon {
            margin-bottom: 32px;
        }
        .icon svg {
            width: 64px;
            height: 64px;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #1b1b1b;
        }
        .info {
            color: #6b6b6b;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 24px;
        }
        .fix {
            margin-bottom: 16px;
        }
        .fix a {
            color: #0078d4;
            text-decoration: none;
            font-size: 14px;
        }
        .fix a:hover {
            text-decoration: underline;
        }
        .fix ul {
            padding-left: 20px;
        }
        .fix li {
            margin-bottom: 4px;
            color: #6b6b6b;
            font-size: 14px;
        }
        .err {
            margin-top: 20px;
            font-size: 13px;
            color: #999;
        }
        .btn {
            margin-top: 20px;
            display: inline-block;
            padding: 8px 24px;
            background: #0078d4;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        .btn:hover { background: #106ebe; }
        .btn:active { background: #005a9e; }
    </style>
</head>
<body>

<div class="wrap">

    <div class="icon">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <circle cx="32" cy="32" r="28" fill="none" stroke="#6b6b6b" stroke-width="2"/>
            <ellipse cx="32" cy="32" rx="16" ry="28" fill="none" stroke="#6b6b6b" stroke-width="1.5"/>
            <line x1="4" y1="32" x2="60" y2="32" stroke="#6b6b6b" stroke-width="1.5"/>
            <circle cx="32" cy="20" r="6" fill="#e81123"/>
            <text x="32" y="24" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">!</text>
        </svg>
    </div>

    <h1>无法访问此页</h1>

    <div class="info">
        <p>连接已重置。请尝试以下操作：</p>
    </div>

    <div class="fix">
        <ul>
            <li>确保你已连接到互联网</li>
            <li>运行"网络和 Internet 疑难解答"</li>
            <li>检查是否有代理服务器设置</li>
            <li>联系网站管理员</li>
        </ul>
    </div>

    <button class="btn" onclick="location.reload()">刷新</button>

    <div class="err">ERR_CONNECTION_RESET</div>

</div>

</body>
</html>
