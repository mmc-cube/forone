<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>每周总览</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --blue: #2563eb;
      --blue2: #1d4ed8;
      --blue-soft: #dbeafe;
      --gray-soft: #f1f5f9;
      --shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: max(14px, env(safe-area-inset-top)) 14px 12px;
      background: linear-gradient(135deg, var(--blue2), #3b82f6);
      color: white;
      box-shadow: 0 8px 26px rgba(37, 99, 235, 0.25);
      border-bottom-left-radius: 22px;
      border-bottom-right-radius: 22px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      max-width: 760px;
      margin: 0 auto;
    }

    .title-block h1 {
      margin: 0;
      font-size: 22px;
    }

    .title-block p {
      margin: 4px 0 0;
      font-size: 13px;
      opacity: 0.9;
    }

    .header-link {
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 7px 10px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.28);
      color: white;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .page {
      max-width: 760px;
      margin: 0 auto;
      padding: 14px 12px 34px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      margin: 12px 0;
      overflow: hidden;
    }

    .card-pad {
      padding: 16px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 20px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 800;
      color: var(--blue);
      background: var(--blue-soft);
      white-space: nowrap;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .summary-item {
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: #fafafa;
    }

    .summary-day {
      font-weight: 900;
      color: var(--blue2);
    }

    .summary-item.rest .summary-day {
      color: #64748b;
    }

    .summary-content strong {
      display: block;
      margin-bottom: 3px;
      font-size: 15px;
    }

    .summary-content p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .footer-note {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin: 18px 0 0;
    }

    @media (min-width: 680px) {
      .summary-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .title-block h1 {
        font-size: 24px;
      }

      .page {
        padding-top: 18px;
      }
    }
  </style>
</head>

<body>
  <header class="app-header">
    <div class="header-top">
      <div class="title-block">
        <h1>每周总览</h1>
        <p>8周循环</p>
      </div>
      <a class="header-link" href="mobile_today_training_plan.html">今日训练</a>
    </div>
  </header>

  <main class="page">
    <section class="card">
      <div class="card-pad">
        <div class="section-title">
          <h2>每周总览</h2>
          <span class="badge">8周循环</span>
        </div>
        <div class="summary-grid">
          <div class="summary-item">
            <div class="summary-day">周一</div>
            <div class="summary-content">
              <strong>主训练 A</strong>
              <p>反手引体日：背、胳膊、胸、肩、腹。</p>
            </div>
          </div>

          <div class="summary-item">
            <div class="summary-day">周二</div>
            <div class="summary-content">
              <strong>腹部短练</strong>
              <p>平板支撑 + 死虫，8-10分钟。</p>
            </div>
          </div>

          <div class="summary-item">
            <div class="summary-day">周三</div>
            <div class="summary-content">
              <strong>主训练 B</strong>
              <p>正手引体日：找背部发力。</p>
            </div>
          </div>

          <div class="summary-item rest">
            <div class="summary-day">周四</div>
            <div class="summary-content">
              <strong>休息</strong>
              <p>散步、轻微拉伸，不练上肢。</p>
            </div>
          </div>

          <div class="summary-item">
            <div class="summary-day">周五</div>
            <div class="summary-content">
              <strong>主训练 C</strong>
              <p>反手提高次数日：堆引体总次数。</p>
            </div>
          </div>

          <div class="summary-item">
            <div class="summary-day">周六</div>
            <div class="summary-content">
              <strong>腹部短练</strong>
              <p>平板支撑 + 死虫/屈膝抬腿。</p>
            </div>
          </div>

          <div class="summary-item rest">
            <div class="summary-day">周日</div>
            <div class="summary-content">
              <strong>休息</strong>
              <p>恢复，不硬练。</p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <p class="footer-note">执行原则：周一反手，周三正手，周五反手；周二周六短练腹部；周四周日恢复。</p>
  </main>
</body>
</html>
