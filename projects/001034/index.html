<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>畜禽舍环境监控系统</title>
    <style>
        :root {
            --bg: #F5F5F5;
            --card: #FFFFFF;
            --primary: #2196F3;
            --alarm: #F44336;
            --ok: #4CAF50;
            --text: #212121;
            --sub: #757575;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 12px;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
        }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
        }

        .card-title {
            font-size: 14px;
            color: var(--sub);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Tab 页签 */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .tab {
            flex: 1;
            height: 44px;
            border: none;
            border-radius: 8px;
            background: #FFFFFF;
            color: var(--sub);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: background 0.2s, color 0.2s;
        }

        .tab.active {
            background: var(--primary);
            color: white;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* 状态栏 */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--sub);
        }

        .status-dot.connected {
            background: var(--ok);
        }

        .status-dot.disconnected {
            background: var(--alarm);
        }

        .status-text {
            font-size: 14px;
        }

        /* 数据行 */
        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .data-row:last-child {
            border-bottom: none;
        }

        .data-label {
            font-size: 13px;
            color: var(--sub);
        }

        .data-value {
            font-size: 28px;
            font-weight: bold;
            color: var(--text);
        }

        .data-unit {
            font-size: 13px;
            color: var(--sub);
            margin-left: 4px;
        }

        .data-value.alarm {
            color: var(--alarm);
        }

        .state-value {
            font-size: 20px;
            font-weight: bold;
            color: var(--sub);
        }

        .state-value.on {
            color: var(--primary);
        }

        /* 报警状态 */
        .alarm-item {
            background: var(--alarm);
            color: white;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .alarm-item:last-child {
            margin-bottom: 0;
        }

        .ok-text {
            color: var(--ok);
            font-size: 14px;
            text-align: center;
            padding: 12px;
        }

        /* 按钮 */
        .btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:active {
            background: #1976D2;
        }

        .btn-alarm {
            background: var(--alarm);
        }

        .btn-alarm:active {
            background: #D32F2F;
        }

        /* 阈值输入 */
        .threshold-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .threshold-row:last-of-type {
            margin-bottom: 16px;
        }

        .threshold-label {
            font-size: 13px;
            color: var(--sub);
            width: 80px;
        }

        .threshold-input {
            flex: 1;
            width: 80px;
            height: 40px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 0 8px;
            font-size: 16px;
            text-align: center;
        }

        .threshold-input::placeholder {
            color: #bbb;
        }

        select.threshold-input {
            background: white;
        }

        /* 当日统计框 */
        .stats-row {
            display: flex;
            gap: 8px;
        }

        .stat {
            flex: 1;
            text-align: center;
            background: #F5F7FA;
            border-radius: 8px;
            padding: 10px 4px;
        }

        .stat-lab {
            font-size: 12px;
            color: var(--sub);
        }

        .stat-val {
            font-size: 22px;
            font-weight: bold;
            color: var(--primary);
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Tab 页签 -->
        <div class="tabs">
            <button class="tab active" id="tab-rt">实时监控</button>
            <button class="tab" id="tab-his">历史数据</button>
        </div>

        <!-- ==================== 页 1：实时监控 ==================== -->
        <div class="page active" id="page-rt">
            <!-- 状态栏 -->
            <div class="card">
                <div class="status-bar">
                    <div class="status-dot" id="statusDot"></div>
                    <span class="status-text" id="statusText">连接中…</span>
                </div>
            </div>

            <!-- 实时数据卡 -->
            <div class="card">
                <div class="card-title">实时数据</div>
                <div class="data-row">
                    <span class="data-label">温度</span>
                    <div>
                        <span class="data-value" id="v-temp">--</span>
                        <span class="data-unit">℃</span>
                    </div>
                </div>
                <div class="data-row">
                    <span class="data-label">湿度</span>
                    <div>
                        <span class="data-value" id="v-humi">--</span>
                        <span class="data-unit">%RH</span>
                    </div>
                </div>
                <div class="data-row">
                    <span class="data-label">烟雾指数</span>
                    <div>
                        <span class="data-value" id="v-smoke">--</span>
                        <span class="data-unit">/100</span>
                    </div>
                </div>
                <div class="data-row">
                    <span class="data-label">光照</span>
                    <div>
                        <span class="data-value" id="v-lux">--</span>
                        <span class="data-unit"></span>
                    </div>
                </div>
            </div>

            <!-- 报警状态卡 -->
            <div class="card" id="alarmCard">
                <div class="card-title">报警状态</div>
                <div id="alarmContent">
                    <div class="ok-text">运行正常 ✓</div>
                </div>
            </div>

            <!-- 执行器状态卡 -->
            <div class="card">
                <div class="card-title">执行器状态（本地推算）</div>
                <div class="data-row">
                    <span class="data-label">补光灯</span>
                    <span class="state-value" id="st-l1">--</span>
                </div>
                <div class="data-row">
                    <span class="data-label">保温灯</span>
                    <span class="state-value" id="st-l2">--</span>
                </div>
                <div class="data-row">
                    <span class="data-label">排气扇</span>
                    <span class="state-value" id="st-fan">--</span>
                </div>
            </div>

            <!-- 阈值卡（当前值 + 远程修改） -->
            <div class="card">
                <div class="card-title">当前阈值（可远程修改）</div>
                <div class="threshold-row">
                    <span class="threshold-label">温度下限 ℃</span>
                    <input class="threshold-input" id="in-temp" type="number" min="-10" max="80" step="1">
                </div>
                <div class="threshold-row">
                    <span class="threshold-label">湿度上限 %</span>
                    <input class="threshold-input" id="in-humi" type="number" min="0" max="100" step="1">
                </div>
                <div class="threshold-row">
                    <span class="threshold-label">烟雾上限</span>
                    <input class="threshold-input" id="in-smoke" type="number" min="0" max="250" step="1">
                </div>
                <div class="threshold-row">
                    <span class="threshold-label">光照下限</span>
                    <input class="threshold-input" id="in-lux" type="number" min="0" max="4095" step="50">
                </div>
                <button class="btn" id="btn-set">下发设置</button>
            </div>

            <!-- 控制卡 -->
            <div class="card">
                <div class="card-title">控制</div>
                <button class="btn btn-alarm" id="btn-clear">消警</button>
            </div>
        </div>

        <!-- ==================== 页 2：历史数据 ==================== -->
        <div class="page" id="page-his">
            <div class="card">
                <div class="card-title">按天查询（数据每 1 分钟上报一次）</div>
                <div class="threshold-row">
                    <select class="threshold-input" id="h-ident">
                        <option value="Temperature">温度</option>
                        <option value="Humidity">湿度</option>
                        <option value="Smoke">烟雾指数</option>
                        <option value="LightLux">光照</option>
                    </select>
                    <input class="threshold-input" id="h-date" type="date">
                </div>
                <button class="btn" id="btn-hist">查询</button>
            </div>
            <div class="card">
                <div class="card-title"><span id="hmsg">选择日期后点"查询"</span></div>
                <canvas id="chart" style="width:100%;height:300px;display:block"></canvas>
            </div>
            <div class="card" id="statsCard" style="display:none">
                <div class="card-title">当日统计（按原始数据计算）</div>
                <div class="stats-row">
                    <div class="stat"><div class="stat-lab">日最高</div><div class="stat-val" id="st-max">--</div></div>
                    <div class="stat"><div class="stat-lab">日最低</div><div class="stat-val" id="st-min">--</div></div>
                    <div class="stat"><div class="stat-lab">日平均</div><div class="stat-val" id="st-avg">--</div></div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" style="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000a;color:#fff;
         padding:8px 16px;border-radius:20px;font-size:13px;display:none;z-index:9"></div>

    <script>
        /* ================== 配置 ================== */
        const PID  = "K6WNT1O5e0";
        const DEV  = "stm32";
        const TOKEN = "version=2018-10-31&res=products%2FK6WNT1O5e0&et=1924833600&method=md5&sign=mACoUHwqz6r%2FPK5wjQkJHg%3D%3D";
        const BASE = "https://iot-api.heclouds.com";
        const POLL_MS = 1000;   // 页面每 1 秒同步一次平台最新值
        const UPLOAD_S = 60;   // 固件固定 1 分钟上报一次

        const $ = id => document.getElementById(id);
        const toast = m => { const t=$("toast"); t.textContent=m; t.style.display="block";
                             clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none",2600); };
        const sleep = ms => new Promise(r=>setTimeout(r,ms));
        const hdr = () => ({ "Authorization": TOKEN });

        /* ================== Tab 切换 ================== */
        $("tab-rt").onclick = () => switchTab("rt");
        $("tab-his").onclick = () => switchTab("his");
        function switchTab(t) {
            $("tab-rt").classList.toggle("active", t === "rt");
            $("tab-his").classList.toggle("active", t === "his");
            $("page-rt").classList.toggle("active", t === "rt");
            $("page-his").classList.toggle("active", t === "his");
            if (t === "his" && lastPts) drawChart();
        }

        /* ================== 实时数据 ================== */
        let D = {};   // identifier -> value
        async function pollOnce(){
            try{
                const r = await fetch(`${BASE}/thingmodel/query-device-property?product_id=${PID}&device_name=${DEV}`,
                                      {headers:hdr()}).then(x=>x.json());
                if(r.code!==0) throw r.msg;
                const now = Date.now(); let newest = 0;
                // 该接口的 data 直接就是数组(不是 {list:[...]})
                const items = Array.isArray(r.data) ? r.data : ((r.data && r.data.list) || []);
                items.forEach(it=>{
                    if(it.time){ const t=new Date(it.time).getTime(); if(t>newest) newest=t; }
                    if(it.value!==null && it.value!==undefined) D[it.identifier]=it.value;
                });
                render(newest);
            }catch(e){
                $("statusDot").className = "status-dot disconnected";
                $("statusText").textContent = "连接失败";
            }
        }
        function render(newest){
            const T=+D.Temperature, H=+D.Humidity, S=+D.Smoke, L=+D.LightLux;
            const tT=+D.ThrTempLower, tH=+D.ThrHumiUpper, tS=+D.ThrNh3Upper, tL=+D.LuxMin;
            const ok = v => !isNaN(v);
            const set = (id,v,dec) => $(id).textContent = ok(v) ? (dec? v.toFixed(1) : Math.round(v)) : "--";
            set("v-temp",T,1); set("v-humi",H,0); set("v-smoke",S,1); set("v-lux",L,0);
            // 超限标红（与固件判断一致）
            $("v-temp").classList.toggle("alarm", ok(T)&&ok(tT)&&T<tT);
            $("v-humi").classList.toggle("alarm", ok(H)&&ok(tH)&&H>tH);
            $("v-smoke").classList.toggle("alarm", ok(S)&&ok(tS)&&S>tS);
            $("v-lux").classList.toggle("alarm", ok(L)&&ok(tL)&&L<tL);
            // 执行器（本地推算，与固件 task_logic 一致）
            const l1 = ok(L)&&ok(tL)&&L<tL, l2 = ok(T)&&ok(tT)&&T<tT;
            const fan = (ok(S)&&ok(tS)&&S>tS) || (ok(H)&&ok(tH)&&H>tH);
            $("st-l1").textContent = l1 ? "ON" : "OFF";
            $("st-l2").textContent = l2 ? "ON" : "OFF";
            $("st-fan").textContent = fan ? "ON" : "OFF";
            $("st-l1").classList.toggle("on", l1);
            $("st-l2").classList.toggle("on", l2);
            $("st-fan").classList.toggle("on", fan);
            // 报警文字（同旧上位机）
            const alarms = [];
            if (l2) alarms.push("温度过低");
            if (ok(H)&&ok(tH)&&H>tH) alarms.push("湿度超标");
            if (ok(S)&&ok(tS)&&S>tS) alarms.push("烟雾超标");
            if (l1) alarms.push("光照不足");
            $("alarmContent").innerHTML = alarms.length
                ? alarms.map(a=>`<div class="alarm-item">${a}</div>`).join("")
                : '<div class="ok-text">运行正常 ✓</div>';
            // 在线判定：60s 上报 + 60s 容忍
            if (newest) {
                const age = (Date.now()-newest)/1000;
                const on = age < UPLOAD_S*2 + 30;
                $("statusDot").className = "status-dot " + (on ? "connected" : "disconnected");
                $("statusText").textContent = on
                    ? (age<90 ? "已连接 · 刚刚更新" : `已连接 · ${Math.round(age/60)} 分钟前更新`)
                    : "设备离线";
            }
        }

        /* ================== 属性下发 ================== */
        async function setProps(params){
            try{
                const r = await fetch(`${BASE}/thingmodel/set-device-property`,{
                    method:"POST", headers:{...hdr(),"Content-Type":"application/json"},
                    body:JSON.stringify({product_id:PID,device_name:DEV,params})
                }).then(x=>x.json());
                toast(r.code===0?"✅ 下发成功":`❌ ${r.code} ${r.msg||""}`);
            }catch(e){ toast("❌ 请求失败"); }
        }
        $("btn-clear").onclick = ()=>setProps({AlarmClear:true});
        $("btn-set").onclick = ()=>{
            const p={};
            const t=$("in-temp").value, h=$("in-humi").value, s=$("in-smoke").value, l=$("in-lux").value;
            if(t!=="") p.ThrTempLower=+t;   if(h!=="") p.ThrHumiUpper=+h;
            if(s!=="") p.ThrNh3Upper=+s;    if(l!=="") p.LuxMin=+l;
            if(!Object.keys(p).length){ toast("请先填写要修改的项"); return; }
            setProps(p);
        };

        /* ================== 历史查询（按天，自动翻页拉全） ================== */
        async function fetchHistory(ident, startMs, endMs, onProg){
            let all=[], offset=0;
            while(true){
                const u = `${BASE}/thingmodel/query-device-property-history?product_id=${PID}&device_name=${DEV}`
                        + `&identifier=${ident}&start_time=${startMs}&end_time=${endMs}&sort=1&offset=${offset}&limit=100`;
                const r = await fetch(u,{headers:hdr()}).then(x=>x.json());
                if(r.code!==0) throw (r.msg||("code "+r.code));
                const list=(r.data&&r.data.list)||[];
                all=all.concat(list);
                onProg(`已拉取 ${all.length} 条…`);
                if(list.length<100 || all.length>30000) break;   // 尾页 / 安全上限
                offset+=100; await sleep(120);
            }
            return all;
        }

        /* ================== 原生 canvas 曲线（零依赖） ================== */
        let lastPts=null, lastRange=null;
        // 按小时聚合: 每小时取最高值(与"日最高"口径一致) → 一天最多 24 个点
        function aggregateHourly(pts, dayStart){
            const buckets = new Map();
            pts.forEach(p=>{
                const h = Math.floor((p[0]-dayStart)/3600000);
                if(!buckets.has(h)) buckets.set(h, []);
                buckets.get(h).push(p[1]);
            });
            return [...buckets.entries()].sort((a,b)=>a[0]-b[0])
                .map(([h,arr])=>[dayStart + h*3600000 + 1800000, Math.max(...arr)]);
        }
        function drawChart(){
            const cv=$("chart"), dpr=window.devicePixelRatio||1;
            const W=cv.clientWidth||380, H=300;
            cv.width=W*dpr; cv.height=H*dpr;
            const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr);
            ctx.clearRect(0,0,W,H);
            ctx.font="11px sans-serif";
            if(!lastPts || !lastPts.length){
                ctx.fillStyle="#757575"; ctx.fillText("该日无数据", W/2-30, H/2); return;
            }
            const [ds,de]=lastRange;
            const L=48,R=12,T=14,B=26, pw=W-L-R, ph=H-T-B;
            let lo=Infinity,hi=-Infinity;
            lastPts.forEach(p=>{ lo=Math.min(lo,p[1]); hi=Math.max(hi,p[1]); });
            if(lo===hi){ lo-=1; hi+=1; }
            const pad=(hi-lo)*0.12; lo-=pad; hi+=pad;
            const X=ms=>L+pw*(ms-ds)/(de-ds);
            const Y=v=>T+ph*(1-(v-lo)/(hi-lo));
            ctx.strokeStyle="#eee"; ctx.fillStyle="#757575";
            for(let i=0;i<=4;i++){
                const y=T+ph*i/4;
                ctx.beginPath(); ctx.moveTo(L,y); ctx.lineTo(W-R,y); ctx.stroke();
                ctx.fillText((hi-(hi-lo)*i/4).toFixed(Math.abs(hi-lo)<10?1:0), 6, y+4);
            }
            for(let h=0;h<=24;h+=4){
                const x=X(ds+h*3600000);
                ctx.fillText(String(h).padStart(2,"0")+":00", Math.min(x,W-R-26), H-8);
                ctx.beginPath(); ctx.moveTo(x,T+ph); ctx.lineTo(x,T+ph+4); ctx.stroke();
            }
  // 断线绘制: 聚合后相邻小时点正常间隔 1h, 间隔超过 1.5h 说明缺了整段数据 → 断开不连线
  const GAP_MS = 90*60*1000;
  const runs = []; let cur = [lastPts[0]];
  for(let i=1;i<lastPts.length;i++){
      if(lastPts[i][0]-lastPts[i-1][0] <= GAP_MS) cur.push(lastPts[i]);
      else { runs.push(cur); cur=[lastPts[i]]; }
  }
  runs.push(cur);
  runs.forEach(run=>{
      ctx.beginPath();
      run.forEach((p,i)=>{ const x=X(p[0]),y=Y(p[1]); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
      if(run.length===1){                       // 孤立单点: 画圆点, 不硬拉线
          ctx.fillStyle="#2196F3";
          ctx.arc(X(run[0][0]), Y(run[0][1]), 3, 0, Math.PI*2); ctx.fill();
          return;
      }
      ctx.strokeStyle="#2196F3"; ctx.lineWidth=2; ctx.lineJoin="round"; ctx.stroke();
      ctx.lineTo(X(run[run.length-1][0]),T+ph);
      ctx.lineTo(X(run[0][0]),T+ph); ctx.closePath();
      ctx.fillStyle="rgba(33,150,243,.10)"; ctx.fill();
  });
}
        $("btn-hist").onclick = async ()=>{
            const ident=$("h-ident").value, date=$("h-date").value;
            if(!date){ toast("请选择日期"); return; }
            const start=new Date(date+"T00:00:00+08:00").getTime();
            const end=start+86400000;
            $("btn-hist").disabled=true; $("hmsg").textContent="查询中…";
            try{
                const list=await fetchHistory(ident,start,end,m=>$("hmsg").textContent=m);
                // 统计框: 用原始数据算 日最高/最低/平均
                const vals=list.map(it=>+it.value);
                if(vals.length){
                    $("st-max").textContent=Math.max(...vals).toFixed(1);
                    $("st-min").textContent=Math.min(...vals).toFixed(1);
                    $("st-avg").textContent=(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);
                }
                $("statsCard").style.display = vals.length ? "block" : "none";
                // 曲线折叠: 按小时聚合, 一天 24 个点连线
                lastPts=aggregateHourly(list.map(it=>[+new Date(it.time), +it.value]), start);
                lastRange=[start,end];
                $("hmsg").textContent=`共 ${list.length} 条原始数据 · 折叠为 ${lastPts.length} 个小时点·每小时取最高（${date}）`;
                drawChart();
            }catch(e){ $("hmsg").textContent="查询失败："+e; }
            $("btn-hist").disabled=false;
        };
        $("h-date").value = new Date().toLocaleDateString("sv-SE",{timeZone:"Asia/Shanghai"});
        window.addEventListener("resize",()=>{ if(lastPts) drawChart(); });

        /* ================== 启动 ================== */
        pollOnce().then(()=>{
            if(D.ThrTempLower!=null) $("in-temp").placeholder=D.ThrTempLower;
            if(D.ThrHumiUpper!=null) $("in-humi").placeholder=D.ThrHumiUpper;
            if(D.ThrNh3Upper!=null)  $("in-smoke").placeholder=D.ThrNh3Upper;
            if(D.LuxMin!=null)       $("in-lux").placeholder=D.LuxMin;
            setInterval(pollOnce, POLL_MS);
        });
    </script>
</body>
</html>
