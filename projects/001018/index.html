<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>智能光伏追光系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --bg: #F5F5F5;
    --card: #FFFFFF;
    --primary: #2196F3;
    --alarm: #F44336;
    --ok: #4CAF50;
    --text: #212121;
    --sub: #757575;
    --shadow: 0 2px 8px rgba(0,0,0,0.08);
    --radius: 12px;
}
html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
}
body { display: flex; flex-direction: column; max-width: 420px; margin: 0 auto; }

/* ---- Tab 内容区 ---- */
.tab-content { display: none; flex: 1; overflow-y: auto; padding: 12px; }
.tab-content.active { display: block; }

/* ---- 底部 Tab 栏 ---- */
.tab-bar {
    display: flex; height: 56px; background: #FFFFFF;
    border-top: 1px solid #E0E0E0; flex-shrink: 0;
}
.tab-item {
    flex: 1; display: flex; flex-direction: row; align-items: center; justify-content: center;
    cursor: pointer; color: #666; font-size: 14px; font-weight: 500;
    user-select: none; -webkit-tap-highlight-color: transparent; position: relative;
}
.tab-item .tab-ico {
    width: 18px; height: 18px; margin-right: 6px; border: 2px solid currentColor; border-radius: 4px;
}
.tab-item[data-tab="data"] .tab-ico { border-radius: 50%; }
.tab-item[data-tab="log"]  .tab-ico { border-radius: 4px 4px 4px 0; }
.tab-item.active { color: var(--primary); font-weight: 600; }
.badge {
    display: none; position: absolute; top: 8px; right: calc(50% - 32px);
    min-width: 16px; height: 16px; line-height: 16px; padding: 0 4px;
    background: var(--alarm); color: #fff; border-radius: 8px;
    font-size: 11px; font-weight: 600; text-align: center;
}
.badge.show { display: block; }

/* ---- 卡片 ---- */
.card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 14px; margin-bottom: 12px;
}
.card-title { font-size: 13px; color: var(--sub); margin-bottom: 10px; font-weight: 600; }

/* ---- 状态栏 ---- */
.status-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #BDBDBD; display: inline-block; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--alarm); }
#mqtt-text { font-size: 14px; font-weight: 600; }
.chip {
    font-size: 12px; padding: 3px 10px; border-radius: 12px;
    background: #EEEEEE; color: var(--sub); font-weight: 600;
}
.chip.on  { background: #E3F2FD; color: var(--primary); }
.chip.dis { background: #FFF3E0; color: #E65100; }
.chip.lock { background: #F5F5F5; color: #9E9E9E; }

/* ---- 实时数据 ---- */
.data-row { display: flex; align-items: baseline; justify-content: space-between; padding: 6px 0; }
.data-row + .data-row { border-top: 1px solid #F0F0F0; }
.data-name { font-size: 13px; color: var(--sub); }
.data-val { font-size: 28px; font-weight: bold; }
.data-unit { font-size: 13px; color: var(--sub); margin-left: 4px; }
.data-val.alarm { color: var(--alarm); }
.data-val.small { font-size: 22px; }

/* ---- 报警 ---- */
.alarm-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: #FFEBEE; color: var(--alarm); border-radius: 8px;
    padding: 10px 12px; margin-top: 8px; font-size: 14px; font-weight: 600;
}
.alarm-ok { display: flex; align-items: center; gap: 6px; margin-top: 8px; color: var(--ok); font-size: 14px; font-weight: 600; }
.btn-mute {
    background: var(--alarm); color: #fff; border: none; border-radius: 8px;
    height: 40px; padding: 0 16px; font-size: 14px; font-weight: 600;
}
.btn-mute:disabled { background: #BDBDBD; }

/* ---- 控制卡 ---- */
.ctl-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; }
.ctl-row + .ctl-row { border-top: 1px solid #F0F0F0; }
.ctl-label { font-size: 15px; font-weight: 600; }
.ctl-sub { font-size: 12px; color: var(--sub); font-weight: 400; margin-top: 2px; }

/* 开关 */
.switch { position: relative; width: 52px; height: 30px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
    position: absolute; inset: 0; background: #CFCFCF; border-radius: 15px;
    transition: .2s; cursor: pointer;
}
.slider::before {
    content: ""; position: absolute; width: 24px; height: 24px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25);
}
.switch input:checked + .slider { background: var(--primary); }
.switch input:checked + .slider::before { transform: translateX(22px); }

/* 点动方向盘 */
.jog-wrap { display: flex; justify-content: center; padding: 10px 0 4px; }
.jog-grid {
    display: grid; grid-template-columns: repeat(3, 64px);
    grid-template-rows: repeat(3, 52px); gap: 8px;
}
.jog-btn {
    border: none; border-radius: 10px; background: #E3F2FD; color: var(--primary);
    font-size: 20px; font-weight: 700; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.jog-btn:active { background: var(--primary); color: #fff; }
.jog-btn span { font-size: 11px; font-weight: 500; display: block; line-height: 1; margin-top: 2px; }
.jog-center { display: flex; align-items: center; justify-content: center; color: #BDBDBD; font-size: 12px; }

/* 通用按钮 */
.btn {
    border: none; border-radius: 8px; height: 48px; min-width: 84px;
    font-size: 15px; font-weight: 600; cursor: pointer; background: var(--primary); color: #fff;
    -webkit-tap-highlight-color: transparent;
}
.btn:active { opacity: .85; }

/* ---- 阈值 ---- */
.thr-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; }
.thr-row + .thr-row { border-top: 1px solid #F0F0F0; }
.thr-info { flex: 1; min-width: 0; }
.thr-label { font-size: 14px; font-weight: 600; }
.thr-current { font-size: 12px; color: var(--sub); margin-top: 2px; }
.thr-current b { color: var(--primary); }
.thr-row input {
    width: 80px; height: 44px; border: 1px solid #E0E0E0; border-radius: 8px;
    text-align: center; font-size: 15px; background: #FAFAFA;
}
.thr-row input:focus { outline: none; border-color: var(--primary); }
.thr-send { height: 44px; min-width: 64px; font-size: 14px; }

/* ---- 日志 ---- */
.log-list { font-family: Menlo, Consolas, monospace; font-size: 11px; line-height: 1.7; color: #555; }
.log-list div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log-list .up { color: var(--primary); }

/* ---- Toast ---- */
#toast {
    position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%);
    background: rgba(33,33,33,.9); color: #fff; padding: 9px 18px; border-radius: 20px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 99;
    max-width: 80%; text-align: center;
}
#toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- ================= 数据 Tab ================= -->
<div class="tab-content active" id="tab-data">
    <!-- 状态栏 -->
    <div class="card">
        <div class="status-row">
            <span class="dot" id="mqtt-dot"></span><span id="mqtt-text">未连接</span>
            <span class="chip lock" id="chip-mode">--</span>
            <span class="chip" id="chip-chg">--</span>
        </div>
    </div>
    <!-- 实时数据卡 -->
    <div class="card">
        <div class="card-title">实时电参量</div>
        <div class="data-row"><span class="data-name">电池电压</span>
            <span><span class="data-val" id="v-vbat">--</span><span class="data-unit">V</span></span></div>
        <div class="data-row"><span class="data-name">电流（充电为正）</span>
            <span><span class="data-val" id="v-i">--</span><span class="data-unit">mA</span></span></div>
        <div class="data-row"><span class="data-name">功率</span>
            <span><span class="data-val" id="v-p">--</span><span class="data-unit">mW</span></span></div>
    </div>
    <!-- 追光数据卡 -->
    <div class="card">
        <div class="card-title">追光状态</div>
        <div class="data-row"><span class="data-name">方位角</span>
            <span><span class="data-val small" id="v-pan">--</span><span class="data-unit">°</span></span></div>
        <div class="data-row"><span class="data-name">俯仰角</span>
            <span><span class="data-val small" id="v-tilt">--</span><span class="data-unit">°</span></span></div>
        <div class="data-row"><span class="data-name">水平偏差 dH（左−右）</span>
            <span><span class="data-val small" id="v-dh">--</span></span></div>
        <div class="data-row"><span class="data-name">垂直偏差 dV（上−下）</span>
            <span><span class="data-val small" id="v-dv">--</span></span></div>
    </div>
    <!-- 报警状态卡 -->
    <div class="card">
        <div class="card-title">报警</div>
        <div class="alarm-ok" id="alarm-ok">运行正常 ✓</div>
        <div id="alarm-list"></div>
        <div style="margin-top:10px; text-align:right;">
            <button class="btn-mute" id="btn-mute" onclick="sendCmd('07'); toast('已静音');">静音</button>
        </div>
    </div>
</div>

<!-- ================= 控制 Tab ================= -->
<div class="tab-content" id="tab-ctl">
    <!-- 控制卡 -->
    <div class="card">
        <div class="card-title">控制</div>
        <div class="ctl-row">
            <div><div class="ctl-label">自动追光</div>
                 <div class="ctl-sub" id="track-sub">--</div></div>
            <label class="switch"><input type="checkbox" id="sw-track" onchange="onTrackSwitch(this.checked)"><span class="slider"></span></label>
        </div>
        <div class="ctl-row" style="display:block;">
            <div class="ctl-label">手动点动</div>
            <div class="ctl-sub">按住连续转，每次约 4.4°</div>
            <div class="jog-wrap">
                <div class="jog-grid">
                    <div></div>
                    <button class="jog-btn" id="jog-up">↑<span>上</span></button>
                    <div></div>
                    <button class="jog-btn" id="jog-left">←<span>左</span></button>
                    <div class="jog-center">点动</div>
                    <button class="jog-btn" id="jog-right">→<span>右</span></button>
                    <div></div>
                    <button class="jog-btn" id="jog-down">↓<span>下</span></button>
                    <div></div>
                </div>
            </div>
        </div>
        <div class="ctl-row">
            <div><div class="ctl-label">放电负载</div>
                 <div class="ctl-sub" id="dis-sub">--</div></div>
            <label class="switch"><input type="checkbox" id="sw-dis" onchange="onDisSwitch(this.checked)"><span class="slider"></span></label>
        </div>
    </div>
    <!-- 阈值设置卡 -->
    <div class="card">
        <div class="card-title">设置</div>
        <div class="thr-row">
            <div class="thr-info">
                <div class="thr-label">低电量阈值 (mV)</div>
                <div class="thr-current">当前：<b id="cur-thr">--</b></div>
            </div>
            <input id="input-thr" type="number" inputmode="numeric" placeholder="2500~4200">
            <button class="btn thr-send" onclick="sendThreshold('thr','05',2500,4200)">发送</button>
        </div>
        <div class="thr-row">
            <div class="thr-info">
                <div class="thr-label">放电超时 (s)</div>
                <div class="thr-current">当前：<b id="cur-tout">--</b></div>
            </div>
            <input id="input-tout" type="number" inputmode="numeric" placeholder="0,10~300">
            <button class="btn thr-send" onclick="sendThreshold('tout','06',0,300)">发送</button>
        </div>
    </div>
</div>

<!-- ================= 日志 Tab ================= -->
<div class="tab-content" id="tab-log">
    <div class="card">
        <div class="card-title">日志（最近 20 条，最新在上）</div>
        <div class="log-list" id="log-list"></div>
    </div>
</div>

<!-- ================= Tab 栏 ================= -->
<div class="tab-bar">
    <div class="tab-item active" data-tab="data"><span class="tab-ico"></span>数据<span class="badge" id="alarm-badge"></span></div>
    <div class="tab-item" data-tab="ctl"><span class="tab-ico"></span>控制</div>
    <div class="tab-item" data-tab="log"><span class="tab-ico"></span>日志</div>
</div>

<div id="toast"></div>

<script src="mqtt.min.js"></script>
<script>
/* ================= 协议（PRD 锁定，硬编码） ================= */
const UPLOAD_TOPIC = '001/002/pvtracker/upload';
const CMD_TOPIC    = '001/002/pvtracker/cmd';
const FRAME_PREFIX = '$D,';

/* ================= 全局状态 ================= */
const cur = { vbat_mv:null, i_ma:null, p_mw:null, pan:null, tilt:null, dh:null, dv:null,
              mode:null, dis_flag:null, thr_low_mv:null, dis_timeout_s:null };
let appMuted = false;                       /* APP 端静音显示（报警恢复自动解除） */

/* 乐观更新待确认标记（内部用，不进界面） */
const pending = { mode:null, dis_flag:null, thr_low_mv:null, dis_timeout_s:null };

/* 阈值编辑保护：每阈值独立 dirty/focused */
const thrEdit = { thr:{dirty:false,focused:false}, tout:{dirty:false,focused:false} };

/* ================= MQTT ================= */
let client = null;
function mqttConnect() {
    client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
        clientId: 'pvtrk_' + Math.random().toString(36).substr(2, 8),
        reconnectPeriod: 3000
    });
    client.on('connect', () => {
        setMqttUI(true);
        client.subscribe(UPLOAD_TOPIC);
        log('已连接 broker，订阅上行');
    });
    client.on('reconnect', () => setMqttUI(false));
    client.on('close',     () => setMqttUI(false));
    client.on('offline',   () => setMqttUI(false));
    client.on('message', (topic, payload) => onUplink(payload.toString()));
}
function setMqttUI(ok) {
    document.getElementById('mqtt-dot').className = 'dot ' + (ok ? 'ok' : 'bad');
    document.getElementById('mqtt-text').textContent = ok ? '已连接' : '未连接';
}

/* ================= 上行解析（$D,11 字段，序号固定） ================= */
function onUplink(s) {
    if (!s || s.indexOf(FRAME_PREFIX) !== 0) return;
    const parts = s.slice(FRAME_PREFIX.length).trim().split(',');
    if (parts.length < 11) return;
    cur.vbat_mv = parseFloat(parts[0]);
    cur.i_ma    = parseFloat(parts[1]);
    cur.p_mw    = parseFloat(parts[2]);
    cur.pan     = parseFloat(parts[3]);
    cur.tilt    = parseFloat(parts[4]);
    cur.dh      = parseFloat(parts[5]);
    cur.dv      = parseFloat(parts[6]);
    cur.mode    = parseInt(parts[7], 10);      /* 0=TRACK 1=LOCK */
    cur.dis_flag= parseInt(parts[8], 10);
    cur.thr_low_mv = parseInt(parts[9], 10);
    cur.dis_timeout_s = parseInt(parts[10], 10);
    log(s.trim());

    /* 设备回传与待确认值一致 → 静默接管 */
    if (pending.mode !== null && cur.mode === pending.mode) pending.mode = null;
    if (pending.dis_flag !== null && cur.dis_flag === pending.dis_flag) pending.dis_flag = null;
    onUplinkThreshold('thr',  cur.thr_low_mv);
    onUplinkThreshold('tout', cur.dis_timeout_s);

    updateUI();
    checkAlarms();
}

/* ================= 界面刷新 ================= */
const $ = id => document.getElementById(id);
function fmtSigned(v) { return (v >= 0 ? '+' : '') + v; }
function updateUI() {
    if (cur.vbat_mv !== null && !isNaN(cur.vbat_mv)) {
        $('v-vbat').textContent = (cur.vbat_mv / 1000).toFixed(2);
        $('v-i').textContent = fmtSigned(cur.i_ma);
        $('v-p').textContent = cur.p_mw;
        $('v-pan').textContent = fmtSigned(cur.pan / 10).replace(/\.0$/, '');
        $('v-tilt').textContent = fmtSigned(cur.tilt / 10).replace(/\.0$/, '');
        $('v-dh').textContent = fmtSigned(cur.dh);
        $('v-dv').textContent = fmtSigned(cur.dv);
    }

    /* 状态 chips（待确认期间显示预测值） */
    const mode = pending.mode !== null ? pending.mode : cur.mode;
    $('chip-mode').textContent = mode === 0 ? 'TRACK' : (mode === 1 ? 'LOCK' : '--');
    $('chip-mode').className = 'chip ' + (mode === 0 ? 'on' : 'lock');
    const i = cur.i_ma;
    const chg = (i === null || isNaN(i)) ? '--' : (i >= 1 ? 'CHG' : (i <= -1 ? 'DIS' : 'IDLE'));
    $('chip-chg').textContent = chg;
    $('chip-chg').className = 'chip' + (chg === 'CHG' ? ' on' : (chg === 'DIS' ? ' dis' : ''));

    /* 开关状态 */
    const tracking = mode === 0;
    $('sw-track').checked = tracking;
    $('track-sub').textContent = tracking ? '追光运行中' : '已锁定（保持当前位置）';
    const dis = pending.dis_flag !== null ? pending.dis_flag : cur.dis_flag;
    $('sw-dis').checked = dis === 1;
    $('dis-sub').textContent = dis === 1 ? '放电中（水泥电阻负载）' : '已关闭';
}

/* ================= 报警（APP 端判断：仅 LOW_BAT） ================= */
function checkAlarms() {
    const alarms = [];
    const lowbat = (cur.vbat_mv !== null && cur.thr_low_mv !== null && cur.vbat_mv < cur.thr_low_mv);
    if (lowbat && !appMuted) alarms.push('电池电量低（' + cur.vbat_mv + ' mV < 阈值 ' + cur.thr_low_mv + ' mV）');
    if (!lowbat) appMuted = false;      /* 报警恢复自动解除静音（与固件逻辑一致） */

    const list = $('alarm-list');
    list.innerHTML = alarms.map(a => '<div class="alarm-bar"><span>' + a + '</span></div>').join('');
    $('alarm-ok').style.display = alarms.length ? 'none' : 'flex';
    $('btn-mute').disabled = !lowbat;

    const badge = $('alarm-badge');
    if (alarms.length) { badge.textContent = alarms.length; badge.classList.add('show'); }
    else badge.classList.remove('show');
}

/* ================= 下行 ================= */
function sendCmd(cmd) {
    if (!client) { toast('未连接'); return; }
    client.publish(CMD_TOPIC, cmd);
    log('↑ ' + cmd);
}

/* 自动追光开关：开=02(TRACK) 关=01(LOCK) */
function onTrackSwitch(on) {
    const cmd = on ? '02' : '01';
    pending.mode = on ? 0 : 1;
    sendCmd(cmd);
    updateUI();
    toast(on ? '已恢复追光' : '已锁定追光');
}
/* 放电开关：开=03 关=04 */
function onDisSwitch(on) {
    const cmd = on ? '03' : '04';
    pending.dis_flag = on ? 1 : 0;
    sendCmd(cmd);
    updateUI();
    toast(on ? '已发送开放电' : '已发送关放电');
}

/* 点动：长按每 400ms 连续发（松手停止） */
let jogTimer = null;
function jogStart(cmd) {
    if (jogTimer) return;
    sendCmd(cmd);
    jogTimer = setInterval(() => sendCmd(cmd), 400);
}
function jogEnd() { clearInterval(jogTimer); jogTimer = null; }
function bindJog(id, cmd) {
    const el = $(id);
    el.addEventListener('touchstart', e => { e.preventDefault(); jogStart(cmd); });
    el.addEventListener('touchend',   e => { e.preventDefault(); jogEnd(); });
    el.addEventListener('mousedown',  () => jogStart(cmd));
    el.addEventListener('mouseup',    () => jogEnd());
    el.addEventListener('mouseleave', () => jogEnd());
}
bindJog('jog-left',  '08');
bindJog('jog-right', '09');
bindJog('jog-up',    '10');
bindJog('jog-down',  '11');

/* ================= 阈值：展示/输入分离 + 乐观更新 ================= */
function bindThrInput(key) {
    const el = $('input-' + key);
    el.addEventListener('focus', () => { thrEdit[key].focused = true; });
    el.addEventListener('blur',  () => { thrEdit[key].focused = false; });
    el.addEventListener('input', () => { thrEdit[key].dirty = true; });
}
bindThrInput('thr'); bindThrInput('tout');

function sendThreshold(key, code, min, max) {
    const el = $('input-' + key);
    const val = parseFloat(el.value);
    if (!Number.isFinite(val) || val < min || val > max) {
        toast('请输入 ' + min + ' ~ ' + max + ' 之间的数值');
        return;
    }
    sendCmd(code + ',' + val);
    thrEdit[key].dirty = false;
    applyThresholdOptimistic(key, val);
    toast('已发送');
}
function applyThresholdOptimistic(key, value) {
    pending[key === 'thr' ? 'thr_low_mv' : 'dis_timeout_s'] = value;
    $('cur-' + key).textContent = value;
    pendingTimer(key, value);
    checkAlarms();
}
function onUplinkThreshold(key, deviceValue) {
    const pkey = key === 'thr' ? 'thr_low_mv' : 'dis_timeout_s';
    if (pending[pkey] !== null && deviceValue === pending[pkey]) {
        clearTimeout(pending[pkey].timer);
        pending[pkey] = null;               /* 设备确认，静默接管 */
    }
    const display = pending[pkey] !== null ? pending[pkey].value : deviceValue;
    $('cur-' + key).textContent = display;
    if (!thrEdit[key].focused && !thrEdit[key].dirty) {
        $('input-' + key).value = deviceValue;   /* 仅未编辑时同步输入框 */
    }
}
function pendingTimer(key, value) {
    const pkey = key === 'thr' ? 'thr_low_mv' : 'dis_timeout_s';
    if (pending[pkey] && pending[pkey].timer) clearTimeout(pending[pkey].timer);
    pending[pkey] = { value: value, timer: setTimeout(() => { pending[pkey] = null; updateUI(); }, 5000) };
}

/* ================= 日志 / Toast / Tab ================= */
const logs = [];
function log(s) {
    const t = new Date();
    const hh = String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0') + ':' + String(t.getSeconds()).padStart(2,'0');
    logs.unshift('<div class="' + (s.indexOf('↑') === 2 ? 'up' : '') + '">[' + hh + '] ' + s + '</div>');
    if (logs.length > 20) logs.pop();
    $('log-list').innerHTML = logs.join('');
}
let toastTimer = null;
function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}
document.querySelectorAll('.tab-item').forEach(item => {
    item.addEventListener('click', () => {
        const tab = item.dataset.tab;
        document.querySelectorAll('.tab-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        $('tab-' + tab).classList.add('active');
    });
});

/* ================= 启动 ================= */
updateUI();
checkAlarms();
mqttConnect();
</script>
</body>
</html>
