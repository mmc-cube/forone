<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>教室设备管理节电系统</title>
<style>
  :root {
    --bg: #F5F5F5;
    --card: #FFFFFF;
    --primary: #2196F3;
    --alarm: #F44336;
    --warn: #FF9800;
    --ok: #4CAF50;
    --text: #212121;
    --sub: #757575;
    --line: #E8E8E8;
    --shadow: 0 2px 8px rgba(0,0,0,0.08);
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;                      /* 禁止整页滚动 */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  body { display: flex; flex-direction: column; max-width: 420px; margin: 0 auto; }

  /* ── 顶部状态栏 ── */
  .topbar {
    flex-shrink: 0;
    background: var(--primary);
    color: #fff;
    padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .topbar h1 { font-size: 16px; font-weight: 600; }
  .bt-status { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #ccc; flex-shrink: 0; transition: background .3s; }
  .dot.connected { background: #69F0AE; }
  .dot.scanning  { background: #FFD740; animation: blink .8s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

  /* ── Tab 内容区：占满剩余空间，独立滚动 ── */
  .tab-content { display: none; flex: 1; overflow-y: auto; padding: 12px; }
  .tab-content.active { display: block; }

  /* ── 底部 Tab 栏 ── */
  .tab-bar {
    display: flex; height: 56px; flex-shrink: 0;
    background: var(--card); border-top: 1px solid var(--line);
  }
  .tab-item {
    flex: 1; display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: #666; font-size: 14px; font-weight: 500; user-select: none;
  }
  .tab-item.active { color: var(--primary); font-weight: 600; }

  /* ── 卡片 ── */
  .card {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 14px 16px; margin-bottom: 12px;
  }
  .card:last-child { margin-bottom: 0; }
  .card-title {
    font-size: 13px; color: var(--sub); font-weight: 700; letter-spacing: .8px;
    margin-bottom: 12px; text-transform: uppercase;
  }

  /* ── 蓝牙连接 ── */
  .device-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .device-item {
    padding: 10px 14px; background: var(--bg); border-radius: 8px; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
  }
  .device-item:active { background: #E3F2FD; }
  .device-name { font-size: 14px; font-weight: 600; }
  .device-addr { font-size: 13px; color: var(--sub); }
  .device-connect-btn {
    height: 32px; padding: 0 12px; background: var(--primary); color: #fff;
    border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; flex-shrink: 0;
  }
  .hint { font-size: 13px; color: #BDBDBD; text-align: center; padding: 8px 0; }

  /* ── 按钮 ── */
  .btn { width: 100%; min-height: 48px; border-radius: 10px; border: none; cursor: pointer;
         font-size: 15px; font-weight: 600; transition: opacity .15s; }
  .btn:active { opacity: .75; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-ghost { background: #fff; color: var(--sub); border: 1px solid var(--line); margin-top: 10px; min-height: 44px; font-size: 14px; font-weight: 500; }
  .btn-send { min-height: 44px; padding: 0 16px; border-radius: 8px; border: none; background: var(--primary);
              color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; flex-shrink: 0; }
  .btn:disabled, .btn-send:disabled { background: #E0E0E0; color: #9E9E9E; cursor: not-allowed; }

  /* ── 实时数据 ── */
  .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .data-item { background: var(--bg); border-radius: 8px; padding: 10px 6px; text-align: center; }
  .data-item.wide { grid-column: span 2; }
  .data-label { font-size: 13px; color: var(--sub); margin-bottom: 4px; }
  .data-value { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; transition: color .2s; }
  .data-value.wide { font-size: 28px; }
  .data-unit { font-size: 13px; color: var(--sub); margin-top: 2px; }
  .data-value.alarm { color: var(--alarm); }
  .no-data { color: #BDBDBD; }

  /* ── 状态行 ── */
  .state-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px;
  }
  .state-row:last-child { border-bottom: none; padding-bottom: 0; }
  .state-name { color: var(--sub); font-size: 13px; }
  .state-val { font-weight: 700; font-size: 15px; }
  .state-val.on  { color: var(--ok); }
  .state-val.off { color: #9E9E9E; }
  .state-val.manual { color: var(--warn); }

  /* ── 报警 ── */
  .alarm-banner {
    border-radius: 10px; padding: 12px 14px; font-size: 15px; font-weight: 600; text-align: center;
    background: #E8F5E9; color: var(--ok); transition: background .3s, color .3s;
  }
  .alarm-banner.level-alarm { background: #FFEBEE; color: var(--alarm); }
  .alarm-banner.level-warn  { background: #FFF3E0; color: var(--warn); }
  .alarm-list { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .alarm-line { font-size: 13px; padding: 8px 10px; border-radius: 6px; background: #FFEBEE; color: var(--alarm); }
  .alarm-line.warn { background: #FFF3E0; color: #E65100; }

  /* ── 阈值 ── */
  .thr-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .thr-row:last-child { margin-bottom: 0; }
  .thr-label { font-size: 13px; color: var(--sub); width: 82px; flex-shrink: 0; }
  .thr-input {
    flex: 1; min-height: 44px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px;
    font-size: 15px; color: var(--text); background: var(--bg); outline: none;
  }
  .thr-input:focus { border-color: var(--primary); background: #fff; }

  /* ── 日志 ── */
  .log-box {
    background: #FAFAFA; border-radius: 8px; padding: 8px 10px; max-height: 60vh; overflow-y: auto;
    font-size: 13px; font-family: "Courier New", monospace; color: #555; line-height: 1.7;
    white-space: pre-wrap; word-break: break-all;
  }

  /* ── 已连接摘要条（连接后折叠设备列表） ── */
  .bt-connected-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 12px; margin-bottom: 10px; background: #E8F5E9; border-radius: 8px;
  }
  .btn-mini {
    min-height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px;
    background: #FFFFFF; color: var(--primary); font-size: 13px; font-weight: 600; cursor: pointer;
  }

  /* ── 全局浮层提示 ── */
  .toast {
    position: fixed; left: 50%; bottom: 74px; transform: translateX(-50%);
    background: rgba(33, 33, 33, .92); color: #FFFFFF; font-size: 13px; line-height: 1.5;
    padding: 10px 16px; border-radius: 20px; max-width: 88%; text-align: center;
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 99;
  }
  .toast.show { opacity: 1; }

  /* ── 调试模式横幅 ── */
  .debug-banner {
    background: #FFF3E0; color: #E65100; font-size: 13px;
    padding: 8px 12px; text-align: center;
  }
</style>
</head>
<body>

<!-- ══ 状态栏 ══ -->
<div class="topbar">
  <h1>教室设备管理节电系统</h1>
  <div class="bt-status">
    <div class="dot" id="dot"></div>
    <span id="bt-label">未连接</span>
  </div>
</div>

<!-- ══ 调试模式横幅（无蓝牙桥时显示）══ -->
<div class="debug-banner" id="debug-banner" style="display:none">调试模式：未检测到蓝牙桥（BluetoothBridge），当前显示的是模拟数据</div>

<!-- ══ Tab：数据 ══ -->
<section id="tab-data" class="tab-content active">

  <div class="card">
    <div class="card-title">蓝牙连接</div>
    <!-- 已连接：折叠设备列表，只留一行摘要 + 更换入口 -->
    <div class="bt-connected-bar" id="bt-connected-bar" style="display:none">
      <div>
        <div class="device-name" id="bt-connected-name">已连接</div>
        <div class="device-addr" id="bt-connected-addr"></div>
      </div>
      <button class="btn-mini" onclick="expandDevices()">更换设备</button>
    </div>
    <!-- 未连接：展开设备列表与扫描按钮 -->
    <div id="device-area">
      <div class="device-list" id="device-list">
        <div class="hint">点击下方按钮扫描已配对设备</div>
      </div>
      <button class="btn btn-primary" id="btn-scan" onclick="scanDevices()">扫描配对设备</button>
    </div>
    <button class="btn btn-ghost" id="btn-disconnect" style="display:none" onclick="doDisconnect()">断开连接</button>
  </div>

  <div class="card">
    <div class="card-title">实时数据</div>
    <div class="data-grid">
      <div class="data-item">
        <div class="data-label">温度</div>
        <div class="data-value no-data" id="v-temp">--</div>
        <div class="data-unit">℃</div>
      </div>
      <div class="data-item">
        <div class="data-label">湿度</div>
        <div class="data-value no-data" id="v-humi">--</div>
        <div class="data-unit">%</div>
      </div>
      <div class="data-item">
        <div class="data-label">照度</div>
        <div class="data-value no-data" id="v-lux">---</div>
        <div class="data-unit">lx</div>
      </div>
      <div class="data-item">
        <div class="data-label">人体感应</div>
        <div class="data-value no-data" id="v-occ">--</div>
        <div class="data-unit">PIR</div>
      </div>
      <div class="data-item wide">
        <div class="data-label">门窗状态</div>
        <div class="data-value wide no-data" id="v-door">--</div>
        <div class="data-unit">磁簧开关</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">报警状态</div>
    <div class="alarm-banner" id="alarm-banner">等待数据</div>
    <div class="alarm-list" id="alarm-list"></div>
  </div>

</section>

<!-- ══ Tab：控制 ══ -->
<section id="tab-ctrl" class="tab-content">

  <div class="card">
    <div class="card-title">运行模式</div>
    <div class="state-row">
      <span class="state-name">当前模式</span>
      <span class="state-val off" id="mode-now">--</span>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-primary" id="btn-auto" style="flex:1" onclick="setMode('10')">切到 AUTO</button>
      <button class="btn btn-primary" id="btn-manual" style="flex:1" onclick="setMode('11')">切到 MANUAL</button>
    </div>
    <div class="hint" id="mode-hint" style="margin-top:8px">AUTO 模式下执行器由传感器自动控制</div>
  </div>

  <div class="card">
    <div class="card-title">远程控制</div>
    <div class="state-row">
      <span class="state-name">吊扇</span>
      <span class="state-val off" id="st-fan">--</span>
    </div>
    <button class="btn btn-primary" id="b-fan" style="margin-bottom:12px" onclick="toggleDevice('fan')">切换吊扇</button>
    <div class="state-row">
      <span class="state-name">空调</span>
      <span class="state-val off" id="st-ac">--</span>
    </div>
    <button class="btn btn-primary" id="b-ac" style="margin-bottom:12px" onclick="toggleDevice('ac')">切换空调</button>
    <div class="state-row">
      <span class="state-name">照明灯</span>
      <span class="state-val off" id="st-lamp">--</span>
    </div>
    <button class="btn btn-primary" id="b-lamp" onclick="toggleDevice('lamp')">切换照明灯</button>
  </div>

  <div class="card">
    <div class="card-title">阈值设置</div>
    <div class="thr-row">
      <span class="thr-label">照度阈值</span>
      <input class="thr-input" id="in-lux" type="number" min="0" max="500" step="10" placeholder="lx">
      <button class="btn-send" onclick="sendThr('lux')">发送</button>
    </div>
    <div class="thr-row">
      <span class="thr-label">低温下限</span>
      <input class="thr-input" id="in-cold" type="number" min="0" max="500" step="1" placeholder="℃">
      <button class="btn-send" onclick="sendThr('cold')">发送</button>
    </div>
    <div class="thr-row">
      <span class="thr-label">舒适区上限</span>
      <input class="thr-input" id="in-comfort" type="number" min="0" max="500" step="1" placeholder="℃">
      <button class="btn-send" onclick="sendThr('comfort')">发送</button>
    </div>
    <div class="thr-row">
      <span class="thr-label">高温区起点</span>
      <input class="thr-input" id="in-hot" type="number" min="0" max="500" step="1" placeholder="℃">
      <button class="btn-send" onclick="sendThr('hot')">发送</button>
    </div>
    <div class="hint" id="thr-hint" style="text-align:left;margin-top:10px">当前阈值：等待设备上报</div>
  </div>

</section>

<!-- ══ Tab：日志 ══ -->
<section id="tab-log" class="tab-content">
  <div class="card">
    <div class="card-title">通信日志（最近 20 条，最新在上）</div>
    <div class="log-box" id="log-box">暂无记录</div>
  </div>
</section>

<!-- ══ 底部 Tab 栏 ══ -->
<nav class="tab-bar">
  <div class="tab-item active" data-tab="data">数据</div>
  <div class="tab-item" data-tab="ctrl">控制</div>
  <div class="tab-item" data-tab="log">日志</div>
</nav>

<!-- ══ 全局浮层提示 ══ -->
<div class="toast" id="toast"></div>

<script>
/* ════════════════════════════════════════════════
   全局状态
   ════════════════════════════════════════════════ */
let isConnected = false;
let debugMode = 0;            /* 浏览器调试流的模式，跟随本地切模式 */
let deviceCache = [];         /* 最近一次扫描到的设备，用于连接时取名字 */
let connectedInfo = { name: '', address: '' };
let btTimer = null;           /* 扫描 / 连接的超时定时器 */
let toastTimer = null;
let currentData = {
  temp: 0, humi: 0, lux: 0, occ: 0, door: 0,
  fan: 0, ac: 0, lamp: 0,
  thrLux: 100, thrCold: 15, thrComfort: 24, thrHot: 30,
  mode: -1,                 /* -1=未知 0=AUTO 1=MANUAL */
  valid: false
};
const DEBOUNCE_MS = 800;
const lastUserSet = { lux: 0, cold: 0, comfort: 0, hot: 0, fan: 0, ac: 0, lamp: 0, mode: 0 };

/* ════════════════════════════════════════════════
   Tab 切换
   ════════════════════════════════════════════════ */
document.querySelectorAll('.tab-item').forEach(item => {
  item.addEventListener('click', () => {
    const tab = item.dataset.tab;
    document.querySelectorAll('.tab-item').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
  });
});

/* ════════════════════════════════════════════════
   BluetoothBridge 回调（Android 原生调用）
   ════════════════════════════════════════════════ */

/** 收到配对设备列表 */
window.onBtDeviceList = function (devices) {
  clearBtTimer();
  setStatus('disconnected');            /* 列表到手，结束"连接中…" */
  deviceCache = devices || [];
  const list = document.getElementById('device-list');
  if (!devices || devices.length === 0) {
    list.innerHTML = '<div class="hint">未找到已配对设备，请先在系统蓝牙设置中配对蓝牙模块</div>';
    toast('没有已配对的设备——请先在系统蓝牙里配对模块', 3000);
    return;
  }
  list.innerHTML = devices.map(d => `
    <div class="device-item" onclick="doConnect('${d.address}')">
      <div>
        <div class="device-name">${d.name || '未知设备'}</div>
        <div class="device-addr">${d.address}</div>
      </div>
      <button class="device-connect-btn">连接</button>
    </div>
  `).join('');
  log('找到 ' + devices.length + ' 个已配对设备');
};

/** 连接成功 */
window.onBtConnected = function (address) {
  isConnected = true;
  clearBtTimer();
  setStatus('connected');
  if (address) connectedInfo.address = address;
  showConnectedBar();                    /* 连接后折叠设备列表 */
  toast('已连接' + (connectedInfo.name ? '：' + connectedInfo.name : ''));
  log('已连接：' + address);
};

/** 已连接：折叠设备列表，只留一行摘要 */
function showConnectedBar() {
  document.getElementById('bt-connected-name').textContent = connectedInfo.name || '已连接';
  document.getElementById('bt-connected-addr').textContent = connectedInfo.address || '';
  document.getElementById('bt-connected-bar').style.display = 'flex';
  document.getElementById('device-area').style.display = 'none';
  document.getElementById('btn-disconnect').style.display = 'block';
}

/** 未连接：展开设备列表 */
function showDeviceList() {
  document.getElementById('bt-connected-bar').style.display = 'none';
  document.getElementById('device-area').style.display = 'block';
  document.getElementById('btn-disconnect').style.display = 'none';
}

/** 更换设备：收起摘要条，展开列表并重新扫描 */
function expandDevices() {
  showDeviceList();
  scanDevices();
}

/** 连接断开 */
window.onBtDisconnected = function () {
  isConnected = false;
  clearBtTimer();
  setStatus('disconnected');
  showDeviceList();
  greyActuators();
  log('蓝牙已断开');
};

/** 收到一行串口数据 */
window.onBtData = function (line) {
  parseFrame(line);
};

/** 错误回调 */
window.onBtError = function (msg) {
  log('[错误] ' + msg);
  isConnected = false;
  clearBtTimer();
  setStatus('disconnected');
  showDeviceList();
  greyActuators();
  toast('[错误] ' + msg, 3000);
};

/* ════════════════════════════════════════════════
   操作函数
   ════════════════════════════════════════════════ */
function scanDevices() {
  const list = document.getElementById('device-list');
  list.innerHTML = '<div class="hint">正在获取已配对设备…</div>';
  if (window.BluetoothBridge) {
    if (!isConnected) setStatus('scanning');   /* 已连接换设备时不动状态栏 */
    log('正在获取配对设备...');
    startBtTimer(6000, '没有收到设备列表——请确认 App 已获得蓝牙权限，且模块已在系统蓝牙中配对');
    window.BluetoothBridge.getPairedDevices();
  } else {
    log('[调试模式] BluetoothBridge 不可用，加载模拟设备');
    setStatus('scanning');
    window.onBtDeviceList([{ name: 'HC-05', address: '00:00:00:00:00:00' }]);
  }
}

function doConnect(address) {
  const hit = deviceCache.find(x => x.address === address);
  connectedInfo = { name: (hit && hit.name) || '', address: address };
  if (window.BluetoothBridge) {
    log('正在连接 ' + address + ' ...');
    setStatus('scanning');
    startBtTimer(10000, '连接超时——请确认模块已上电、处于可连接状态');
    window.BluetoothBridge.connect(address);
  } else {
    log('[调试] 模拟连接成功');
    window.onBtConnected(address);
    startDebugFeed();
  }
}

/* ── 超时与全局提示 ── */
function startBtTimer(ms, msg) {
  clearBtTimer();
  btTimer = setTimeout(() => {
    btTimer = null;
    setStatus('disconnected');
    toast(msg, 3500);
    log('[超时] ' + msg);
  }, ms);
}

function clearBtTimer() {
  if (btTimer) { clearTimeout(btTimer); btTimer = null; }
}

function toast(msg, ms) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms || 2000);
}

/** 无蓝牙桥时挂出调试横幅，避免把模拟数据当真 */
function checkBridge() {
  const b = document.getElementById('debug-banner');
  if (b) b.style.display = window.BluetoothBridge ? 'none' : 'block';
}

function doDisconnect() {
  if (window.BluetoothBridge) {
    window.BluetoothBridge.disconnect();
  } else {
    window.onBtDisconnected();
  }
}

/** 统一发送：末尾补 \n */
function sendCmd(str) {
  if (!isConnected) {
    log('[提示] 蓝牙未连接，指令未发送');
    toast('蓝牙未连接，指令未发送');
    return false;
  }
  if (window.BluetoothBridge) {
    window.BluetoothBridge.send(str + '\n');
  }
  log('[TX] ' + str);
  return true;
}

/* ── 模式切换（10=AUTO，11=MANUAL） ── */
function setMode(code) {
  if (!sendCmd(code)) {
    setModeHint('蓝牙未连接，指令未发送');
    return;
  }
  /* 乐观更新：立即切换本地模式，800ms 内不被在途上报覆盖 */
  currentData.mode = (code === '11') ? 1 : 0;
  lastUserSet.mode = Date.now();
  debugMode = currentData.mode;
  updateUI();
}

/* ── 执行器开/关（仅 MANUAL 有效，下发 21/22/23,值） ── */
function toggleDevice(which) {
  if (currentData.mode !== 1) {
    const why = currentData.mode === 0
      ? '当前 AUTO 模式，执行器由传感器自动控制'
      : '尚未收到设备数据，请先连接蓝牙';
    setModeHint(why);
    toast(why);
    log('[提示] 仅 MANUAL 模式可手动控制执行器');
    return;
  }
  const map = {
    fan:  { code: '21', val: currentData.fan  },
    ac:   { code: '22', val: currentData.ac   },
    lamp: { code: '23', val: currentData.lamp }
  };
  const m = map[which];
  const next = m.val ? 0 : 1;          /* 按当前状态取反 */
  if (!sendCmd(m.code + ',' + next)) {
    setModeHint('蓝牙未连接，指令未发送');
    return;
  }
  /* 乐观更新：立即翻转本地状态，800ms 内不被在途上报覆盖 */
  currentData[which] = next;
  lastUserSet[which] = Date.now();
  updateUI();
}

function setModeHint(t) {
  const el = document.getElementById('mode-hint');
  if (el) el.textContent = t;
}

function greyActuators() {
  ['b-fan', 'b-ac', 'b-lamp'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.disabled = true;
  });
}

/* ── 阈值设置（02/03/04/05,值） ── */
function sendThr(key) {
  const map = {
    lux:     { code: '02', input: 'in-lux',     data: 'thrLux',     unit: ' lx' },
    cold:    { code: '03', input: 'in-cold',    data: 'thrCold',    unit: ' ℃' },
    comfort: { code: '04', input: 'in-comfort', data: 'thrComfort', unit: ' ℃' },
    hot:     { code: '05', input: 'in-hot',     data: 'thrHot',     unit: ' ℃' }
  };
  const m = map[key];
  const el = document.getElementById(m.input);
  const val = parseFloat(el.value);
  if (isNaN(val) || val < 0 || val > 500) {
    log('[设置] 请输入 0~500 之间的数值');
    toast('请输入 0~500 之间的数值');
    el.focus();
    return;
  }
  if (!sendCmd(m.code + ',' + val)) return;

  /* 乐观更新：立即刷新显示，800ms 内不被上报覆盖 */
  currentData[m.data] = val;
  lastUserSet[key] = Date.now();
  renderThresholds();
  checkAlarms(currentData);
  toast('已发送 ' + fieldName(key) + '=' + val);
}

/* ════════════════════════════════════════════════
   数据解析
   格式：温度,湿度,照度,有人,门窗,吊扇,空调,照明灯,
        LUX_TH,T_COLD,T_COMFORT,T_HOT,SYSTEM_MODE
   ════════════════════════════════════════════════ */
function parseFrame(line) {
  const raw = String(line).trim();
  if (!raw) return;

  const p = raw.split(',');
  if (p.length < 13) {
    log('[格式错误] ' + raw);
    return;
  }

  const d = {
    temp:       parseFloat(p[0]),
    humi:       parseFloat(p[1]),
    lux:        parseInt(p[2], 10),
    occ:        parseInt(p[3], 10),
    door:       parseInt(p[4], 10),
    fan:        parseInt(p[5], 10),
    ac:         parseInt(p[6], 10),
    lamp:       parseInt(p[7], 10),
    thrLux:     parseFloat(p[8]),
    thrCold:    parseFloat(p[9]),
    thrComfort: parseFloat(p[10]),
    thrHot:     parseFloat(p[11]),
    mode:       parseInt(p[12], 10),
    valid:      true
  };

  /* 数值字段校验（温度允许 -1 表示读取失败） */
  const numKeys = ['humi','lux','occ','door','fan','ac','lamp','thrLux','thrCold','thrComfort','thrHot','mode'];
  if (isNaN(d.temp) || numKeys.some(k => isNaN(d[k]))) {
    log('[数值异常] ' + raw);
    return;
  }

  /* 用户刚操作过的字段：800ms 内沿用本地值，避免被在途的旧上报打回 */
  const nowTs = Date.now();
  ['fan', 'ac', 'lamp'].forEach(k => {
    if (nowTs - lastUserSet[k] < DEBOUNCE_MS) d[k] = currentData[k];
  });
  if (nowTs - lastUserSet.mode < DEBOUNCE_MS) d.mode = currentData.mode;

  currentData = d;
  addLog(raw);
  updateUI();
  checkAlarms(d);
}

/* ════════════════════════════════════════════════
   UI 刷新
   ════════════════════════════════════════════════ */
function updateUI() {
  const d = currentData;
  if (!d.valid) return;

  /* 温度：-1 表示 DHT11 读取失败 */
  const tempFail = (d.temp === -1);
  setText('v-temp', tempFail ? '--' : d.temp.toFixed(1));
  toggleNoData('v-temp', tempFail);
  toggleAlarm('v-temp', !tempFail && (d.temp < d.thrCold || d.temp > d.thrHot));

  /* 湿度：-1 表示 DHT11 读取失败 */
  const humiFail = (d.humi === -1);
  setText('v-humi', humiFail ? '--' : d.humi.toFixed(0));
  toggleNoData('v-humi', humiFail);

  /* 照度：0 表示 BH1750 读取失败 */
  const luxFail = (d.lux === 0);
  setText('v-lux', luxFail ? '---' : String(d.lux));
  toggleNoData('v-lux', luxFail);
  toggleAlarm('v-lux', !luxFail && d.lux < d.thrLux);

  setText('v-occ', d.occ ? '有人' : '无人');
  toggleNoData('v-occ', false);
  setValClass('v-occ', d.occ ? 'data-value' : 'data-value alarm');

  setText('v-door', d.door ? '打开' : '关闭');
  toggleNoData('v-door', false);
  setValClass('v-door', d.door ? 'data-value wide alarm' : 'data-value wide');

  /* 执行器状态 */
  setValClass('st-fan', 'state-val ' + (d.fan ? 'on' : 'off'));
  setText('st-fan', d.fan ? '开' : '关');
  setValClass('st-ac', 'state-val ' + (d.ac ? 'on' : 'off'));
  setText('st-ac', d.ac ? '开' : '关');
  setValClass('st-lamp', 'state-val ' + (d.lamp ? 'on' : 'off'));
  setText('st-lamp', d.lamp ? '开' : '关');

  /* 模式（0=AUTO 1=MANUAL） */
  const isManual = (d.mode === 1);
  setText('mode-now', d.mode === 1 ? 'MANUAL' : (d.mode === 0 ? 'AUTO' : '--'));
  setValClass('mode-now', 'state-val ' + (isManual ? 'manual' : 'off'));

  /* 模式联动：AUTO 或未连接时执行器按钮置灰 */
  ['b-fan', 'b-ac', 'b-lamp'].forEach(id => {
    document.getElementById(id).disabled = !isManual || !isConnected;
  });
  document.getElementById('btn-auto').disabled = (d.mode === 0);
  document.getElementById('btn-manual').disabled = (d.mode === 1);
  document.getElementById('mode-hint').textContent = isManual
    ? 'MANUAL 模式：可手动控制吊扇 / 空调 / 照明灯'
    : 'AUTO 模式：执行器由传感器自动控制，控制按钮已禁用';

  renderThresholds();

  /* 阈值输入框默认值（用户未输入时） */
  fillThrInput('in-lux', 'thrLux', 'lux');
  fillThrInput('in-cold', 'thrCold', 'cold');
  fillThrInput('in-comfort', 'thrComfort', 'comfort');
  fillThrInput('in-hot', 'thrHot', 'hot');
}

function renderThresholds() {
  const d = currentData;
  const rows = [
    ['lux', 'thrLux', '  lx'],
    ['cold', 'thrCold', '  ℃'],
    ['comfort', 'thrComfort', '  ℃'],
    ['hot', 'thrHot', '  ℃']
  ];
  const parts = [];
  rows.forEach(([key, field, unit]) => {
    parts.push(fieldName(key) + '=' + Number(d[field]).toFixed(0) + unit.trim());
  });
  document.getElementById('thr-hint').textContent = '当前阈值：' + parts.join('  |  ');
}

function fieldName(key) {
  return { lux: 'LUX_TH', cold: 'T_COLD', comfort: 'T_COMFORT', hot: 'T_HOT' }[key] || key;
}

/** 阈值输入框填默认值：只在用户没正在编辑时填 */
function fillThrInput(inputId, dataField, key) {
  const el = document.getElementById(inputId);
  if (document.activeElement === el) return;
  if (Date.now() - lastUserSet[key] < DEBOUNCE_MS) return;
  el.value = Number(currentData[dataField]).toFixed(0);
}

/* ════════════════════════════════════════════════
   报警判断（JS 端，按 PRD 第四层规则）
   ════════════════════════════════════════════════ */
function checkAlarms(d) {
  const banner = document.getElementById('alarm-banner');
  const list = document.getElementById('alarm-list');
  const alarms = [];   /* 红色 */
  const warns  = [];   /* 橙色 */

  if (d.temp === -1) {
    alarms.push('温度传感器读取失败');
  } else if (d.temp < d.thrCold) {
    alarms.push('温度低于下限');
  } else if (d.temp > d.thrHot) {
    alarms.push('温度高于上限');
  } else if (d.temp >= d.thrComfort && d.temp <= d.thrHot) {
    warns.push('温度偏高');
  }

  if (d.lux === 0) {
    alarms.push('照度传感器读取失败');
  } else if (d.lux < d.thrLux && d.mode === 0) {
    warns.push('照度不足，已自动开灯');
  }

  if (d.door === 1) warns.push('门窗已打开');
  if (d.occ === 0)  warns.push('室内无人');

  /* Banner */
  banner.className = 'alarm-banner';
  if (alarms.length > 0) {
    banner.classList.add('level-alarm');
    banner.textContent = alarms[0];
  } else if (warns.length > 0) {
    banner.classList.add('level-warn');
    banner.textContent = warns[0];
  } else {
    banner.textContent = '运行正常';
  }

  /* 明细 */
  const lines = alarms.map(t => '<div class="alarm-line">' + t + '</div>')
    .concat(warns.map(t => '<div class="alarm-line warn">' + t + '</div>'));
  list.innerHTML = lines.join('');
}

/* ════════════════════════════════════════════════
   辅助
   ════════════════════════════════════════════════ */
function setText(id, val) { const el = document.getElementById(id); if (el) el.textContent = val; }
function setValClass(id, cls) { const el = document.getElementById(id); if (el) el.className = cls; }
function toggleNoData(id, on) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.toggle('no-data', !!on);
}
function toggleAlarm(id, on) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.toggle('alarm', !!on);
}

function setStatus(s) {
  const dot = document.getElementById('dot');
  const label = document.getElementById('bt-label');
  dot.className = 'dot';
  if (s === 'connected') {
    dot.classList.add('connected'); label.textContent = '已连接'; isConnected = true;
  } else if (s === 'scanning') {
    dot.classList.add('scanning'); label.textContent = '连接中...';
  } else {
    label.textContent = '未连接'; isConnected = false;
  }
}

/* ── 日志（最近 20 条，最新在最上面） ── */
const MAX_LOG = 20;
let logLines = [];
let lastFrameLog = '';

function log(msg) {
  const ts = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  logLines.unshift('[' + ts + '] ' + msg);
  if (logLines.length > MAX_LOG) logLines.pop();
  renderLog();
}

/** 原始报文单独入日志（过滤重复帧） */
function addLog(raw) {
  if (raw === lastFrameLog) return;
  lastFrameLog = raw;
  const ts = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  logLines.unshift('[' + ts + '] RX ' + raw);
  if (logLines.length > MAX_LOG) logLines.pop();
  renderLog();
}

function renderLog() {
  const box = document.getElementById('log-box');
  box.textContent = logLines.length ? logLines.join('\n') : '暂无记录';
}

/* ── 浏览器调试：模拟数据流 ── */
let debugTimer = null;
function startDebugFeed() {
  if (debugTimer) return;
  let t = 0;
  debugTimer = setInterval(() => {
    t += 0.1;
    const temp = 24 + Math.sin(t) * 4;
    const thrCold = 15, thrComfort = 24, thrHot = 30;
    let zone = 0;
    if (temp < thrCold) zone = 0;
    else if (temp < thrComfort) zone = 1;
    else if (temp < thrHot) zone = 2;
    else zone = 3;
    const line = [
      temp.toFixed(1),
      (60 + Math.sin(t * 0.5) * 10).toFixed(0),
      String(100 + Math.round(Math.abs(Math.sin(t * 0.3)) * 400)),
      '1',
      '0',
      zone >= 2 ? '1' : '0',
      zone === 0 || zone === 3 ? '1' : '0',
      '0',
      '100', '15', '24', '30',
      String(debugMode)
    ].join(',');
    parseFrame(line);
  }, 1000);
}

/* 初始状态：未连接 → 执行器按钮置灰，连接并收到数据后由 updateUI 接管 */
greyActuators();
setModeHint('未连接蓝牙，请先在"数据"页扫描并连接设备');
log('页面已加载，请先连接蓝牙设备');
setTimeout(checkBridge, 600);          /* 桥可能晚于页面加载注入，延迟检测 */
</script>
