<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>便携式气象参数记录仪</title>
<style>
:root{
  --bg:#F5F5F5; --card:#FFFFFF; --primary:#2196F3; --alarm:#F44336;
  --ok:#4CAF50; --text:#212121; --sub:#757575;
  --shadow:0 2px 8px rgba(0,0,0,.08); --radius:12px; --line:#E0E0E0;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);}
body{display:flex;flex-direction:column;max-width:420px;margin:0 auto;}

/* ---------- Tab 内容 ---------- */
.tab-content{display:none;flex:1;overflow-y:auto;padding:12px;}
.tab-content.active{display:block;}

/* ---------- 底部 Tab ---------- */
.tab-bar{display:flex;height:56px;background:#FFF;border-top:1px solid var(--line);flex-shrink:0;}
.tab-item{flex:1;display:flex;align-items:center;justify-content:center;color:#666;font-size:15px;font-weight:500;cursor:pointer;user-select:none;}
.tab-item.active{color:var(--primary);font-weight:700;}
.tab-item .badge{display:none;min-width:16px;height:16px;line-height:16px;padding:0 4px;margin-left:4px;border-radius:8px;background:var(--alarm);color:#fff;font-size:11px;text-align:center;}
.tab-item .badge.show{display:inline-block;}

/* ---------- 卡片 ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px;}
.card-title{font-size:13px;color:var(--sub);margin-bottom:10px;letter-spacing:.5px;}

/* ---------- 状态栏 ---------- */
.status-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.dot{width:9px;height:9px;border-radius:50%;background:#BDBDBD;flex-shrink:0;}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(76,175,80,.15);}
.dot.off{background:var(--alarm);}
.status-text{font-size:13px;color:var(--sub);flex:1;}
.btn{height:40px;padding:0 14px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-size:13px;font-weight:600;cursor:pointer;}
.btn:active{opacity:.8;}
.btn.ghost{background:#ECEFF1;color:#455A64;}
.btn.danger{background:var(--alarm);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.select-row{display:flex;gap:8px;margin-bottom:10px;}
.select-row select{flex:1;height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 8px;font-size:13px;color:var(--text);}

/* ---------- 实时数据 ---------- */
.time-big{font-size:34px;font-weight:700;letter-spacing:1px;line-height:1.1;}
.date-sub{font-size:13px;color:var(--sub);margin-top:4px;}
.metric{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #F0F0F0;}
.metric:last-child{border-bottom:none;}
.metric .label{font-size:13px;color:var(--sub);}
.metric .value{font-size:28px;font-weight:700;line-height:1;}
.metric .unit{font-size:13px;color:var(--sub);font-weight:400;margin-left:4px;}
.metric .value.alarm{color:var(--alarm);}

.alarm-ok{display:flex;align-items:center;gap:8px;color:var(--ok);font-size:15px;font-weight:600;}
.alarm-on{background:#FFEBEE;border-radius:8px;padding:10px;color:var(--alarm);font-size:14px;font-weight:600;line-height:1.5;}
.alarm-off{color:var(--ok);font-size:14px;font-weight:600;}

/* ---------- 控制 ---------- */
.ctrl-btn{width:100%;height:52px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-size:16px;font-weight:700;margin-top:10px;cursor:pointer;}
.ctrl-btn:active{opacity:.85;}
.ctrl-btn.secondary{background:#455A64;}
.ctrl-btn:disabled{opacity:.45;}
.sync-status{font-size:13px;margin-top:10px;color:var(--sub);min-height:20px;}
.sync-status.ok{color:var(--ok);font-weight:600;}
.sync-status.err{color:var(--alarm);font-weight:600;}

.thr-item{padding:12px 0;border-bottom:1px solid #F0F0F0;}
.thr-item:last-of-type{border-bottom:none;padding-bottom:4px;}
.thr-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;}
.thr-name{font-size:14px;font-weight:600;color:var(--text);}
.thr-cur{font-size:12px;color:var(--sub);}
.thr-cur b{font-size:18px;font-weight:700;color:var(--primary);margin:0 2px;}
.thr-set{display:flex;align-items:center;gap:8px;}
.thr-set input,.thr-set select{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:8px;padding:0 8px;font-size:14px;color:var(--text);background:#fff;}
.thr-set .unit{font-size:13px;color:var(--sub);flex-shrink:0;}
.thr-set .btn{height:40px;flex-shrink:0;}
.chart-bar{display:flex;gap:8px;margin-bottom:8px;}
.chart-bar select{flex:1;min-width:0;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 8px;font-size:13px;color:var(--text);background:#fff;}
.chart-bar .btn{height:36px;}
.seg{display:flex;background:#ECEFF1;border-radius:8px;padding:3px;margin-bottom:10px;}
.seg button{flex:1;height:32px;border:none;background:transparent;border-radius:6px;font-size:13px;color:#607D8B;font-weight:600;cursor:pointer;}
.seg button.active{background:#FFF;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12);}
canvas{display:block;width:100%;height:200px;background:#FAFAFA;border-radius:6px;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
.stats>div{background:#F7F9FA;border-radius:8px;padding:8px 4px;text-align:center;}
.stats span{display:block;font-size:11px;color:var(--sub);}
.stats b{display:block;font-size:16px;font-weight:700;color:var(--text);margin-top:2px;}
.stats i{display:block;font-size:10px;color:#90A4AE;font-style:normal;min-height:13px;}

/* ---------- 日志 ---------- */

/* ---------- 环境提示 ---------- */
.bridge-tip{display:none;background:#FFF3E0;color:#E65100;border-radius:8px;padding:10px;font-size:12px;line-height:1.5;margin-bottom:12px;}
.bridge-tip.show{display:block;}
</style>
</head>
<body>

<!-- ================= 数据 Tab ================= -->
<section id="tab-data" class="tab-content active">
  <div class="bridge-tip" id="bridgeTip">当前浏览器不支持蓝牙桥接。请用 Android WebView 壳运行本页面，普通浏览器只能查看界面。</div>

  <div class="card">
    <div class="status-row">
      <span class="dot off" id="btDot"></span>
      <span class="status-text" id="btStatus">未连接</span>
      <button class="btn ghost" id="btnScan" onclick="scanDevices()">扫描</button>
      <button class="btn" id="btnConnect" onclick="connectSelected()">连接</button>
      <button class="btn danger" id="btnDisconnect" onclick="disconnectBt()" style="display:none;">断开</button>
    </div>
    <div class="select-row">
      <select id="deviceList">
        <option value="">请先扫描已配对设备</option>
      </select>
    </div>
  </div>

  <div class="card">
    <div class="card-title">设备时间</div>
    <div class="time-big" id="timeText">--:--:--</div>
    <div class="date-sub" id="dateText">----</div>
  </div>

  <div class="card">
    <div class="card-title">实时气象参数</div>
    <div class="metric">
      <span class="label">温度</span>
      <span><span class="value" id="vTemp">--</span><span class="unit">℃</span></span>
    </div>
    <div class="metric">
      <span class="label">湿度</span>
      <span><span class="value" id="vHumi">--</span><span class="unit">%RH</span></span>
    </div>
    <div class="metric">
      <span class="label">气压</span>
      <span><span class="value" id="vPress">--</span><span class="unit">hPa</span></span>
    </div>
    <div class="metric">
      <span class="label">雨情</span>
      <span><span class="value" id="vRain">--</span></span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">报警状态</div>
    <div id="alarmBox"><span class="alarm-off">等待设备数据…</span></div>
  </div>
</section>

<!-- ================= 控制 Tab ================= -->
<section id="tab-control" class="tab-content">
  <div class="card">
    <div class="card-title">时间同步</div>
    <button class="ctrl-btn" id="btnSyncTime" onclick="syncTime()">同步时间</button>
    <div class="sync-status" id="syncStatus"></div>
  </div>

  <div class="card">
    <div class="card-title">报警阈值</div>

    <div class="thr-item">
      <div class="thr-head">
        <span class="thr-name">温度阈值</span>
        <span class="thr-cur"><b id="curT">--</b> ℃</span>
      </div>
      <div class="thr-set">
        <input id="tMaxInput" type="number" min="20" max="50" value="35" oninput="markInputTouched('T')">
        <span class="unit">℃</span>
        <button class="btn" onclick="sendThreshold('T')">下发</button>
      </div>
    </div>

    <div class="thr-item">
      <div class="thr-head">
        <span class="thr-name">湿度阈值</span>
        <span class="thr-cur"><b id="curH">--</b> %RH</span>
      </div>
      <div class="thr-set">
        <input id="hMaxInput" type="number" min="30" max="99" value="80" oninput="markInputTouched('H')">
        <span class="unit">%</span>
        <button class="btn" onclick="sendThreshold('H')">下发</button>
      </div>
    </div>

    <div class="sync-status" id="thrStatus"></div>
  </div>

  <div class="card">
    <div class="card-title">记录周期</div>
    <div class="thr-item">
      <div class="thr-head">
        <span class="thr-name">记录周期</span>
        <span class="thr-cur"><b id="curC">--</b></span>
      </div>
      <div class="thr-set">
        <select id="cycleSelect">
          <option value="0">20 秒</option>
          <option value="1">1 分钟</option>
          <option value="2">5 分钟</option>
          <option value="3">30 分钟</option>
        </select>
        <button class="btn" onclick="sendCycle()">下发</button>
      </div>
    </div>
    <div class="sync-status" id="cycStatus"></div>
  </div>
</section>

<!-- ================= 日志 Tab ================= -->
<section id="tab-log" class="tab-content">
  <div class="card">
    <div class="card-title">波形记录</div>

    <div class="chart-bar">
      <select id="daySelect" onchange="renderCharts()"></select>
      <button class="btn ghost" onclick="clearHistory()">清空</button>
    </div>

    <div class="seg" id="metricSeg">
      <button data-m="1" class="active" onclick="setMetric(1)">温度</button>
      <button data-m="2" onclick="setMetric(2)">湿度</button>
      <button data-m="3" onclick="setMetric(3)">气压</button>
    </div>

    <canvas id="chart"></canvas>

    <div class="stats">
      <div><span>日均</span><b id="stAvg">--</b><i></i></div>
      <div><span>日高</span><b id="stMax">--</b><i id="stMaxTime"></i></div>
      <div><span>日低</span><b id="stMin">--</b><i id="stMinTime"></i></div>
    </div>
  </div>
</section>

<!-- ================= 底部 Tab ================= -->
<nav class="tab-bar">
  <div class="tab-item active" data-tab="data">数据</div>
  <div class="tab-item" data-tab="control">控制</div>
  <div class="tab-item" data-tab="log">日志</div>
</nav>

<script>
/* ================================================================
 * 全局状态
 * ================================================================ */
var isBtConnected = false;
var syncTimer = null;

/* 阈值三份状态：
   reported = 设备上报的实际值
   shown    = 界面阈值显示值（下发后先显示新值，设备确认后接管）
   pending  = 已下发、尚未被设备上报确认的值 */
var reported = { Tmax: null, Hmax: null, Cyc: null };
var shown    = { Tmax: null, Hmax: null, Cyc: null };
var pending  = { Tmax: null, Hmax: null, Cyc: null };
var pendingUntil = { Tmax: 0, Hmax: 0, Cyc: 0 };
var PENDING_HOLD_MS = 2500;

/* 输入框是“要下发的值”，由用户编辑，不用设备值反复覆盖 */
var inputTouched = { T: false, H: false };
var inputsSeeded = false;

var CYCLE_NAME = ['20 秒', '1 分钟', '5 分钟', '30 分钟'];

/* 最近一帧遥测，用于本地报警原因说明 */
var currentData = { T: null, H: null, P: null, Rain: null, ALM: null };

/* ================================================================
 * Tab 切换
 * ================================================================ */
document.querySelectorAll('.tab-item').forEach(function(item){
  item.addEventListener('click', function(){
    var tab = item.dataset.tab;
    document.querySelectorAll('.tab-item').forEach(function(i){ i.classList.remove('active'); });
    item.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(function(c){ c.classList.remove('active'); });
    document.getElementById('tab-' + tab).classList.add('active');
    if (tab === 'log') setTimeout(renderCharts, 0);
  });
});

/* ================================================================
 * 日志
 * ================================================================ */
function addLog(text){
  var list = document.getElementById('logList');
  if (!list) return;   /* 原始数据卡已移除，日志不再展示 */
  var empty = list.querySelector('.empty');
  if (empty) list.removeChild(empty);

  var d = new Date();
  var hh = String(d.getHours()).padStart(2,'0');
  var mm = String(d.getMinutes()).padStart(2,'0');
  var ss = String(d.getSeconds()).padStart(2,'0');

  var el = document.createElement('div');
  el.className = 'log-item';
  el.innerHTML = '<span class="log-time">' + hh + ':' + mm + ':' + ss + '</span>' +
                 escapeHtml(text);
  list.insertBefore(el, list.firstChild);
  while (list.children.length > 20) list.removeChild(list.lastChild);
}

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ================================================================
 * 蓝牙控制（Android WebView BluetoothBridge）
 * ================================================================ */
function scanDevices(){
  if (window.BluetoothBridge) {
    window.BluetoothBridge.getPairedDevices();
  } else {
    document.getElementById('bridgeTip').classList.add('show');
  }
}

function connectSelected(){
  var addr = document.getElementById('deviceList').value;
  if (!addr) { alert('请先扫描并选择设备'); return; }
  if (!window.BluetoothBridge) {
    document.getElementById('bridgeTip').classList.add('show');
    return;
  }
  window.BluetoothBridge.connect(addr);
}

function disconnectBt(){
  if (window.BluetoothBridge) window.BluetoothBridge.disconnect();
}

function sendViaBt(cmd){
  if (!isBtConnected || !window.BluetoothBridge) {
    alert('蓝牙未连接，请先在“数据”页连接设备');
    return false;
  }
  /* 下位机按 \r / \n 成行解析：不带行结束符时指令会一直留在接收缓冲里不执行，
     表现就是“发了阈值但收不到 OK/CFG”。这里统一补 \r\n（Android 壳若也补，
     多出的空行会被设备忽略，不影响）。 */
  window.BluetoothBridge.send(cmd + '\r\n');
  addLog('→ ' + cmd);
  return true;
}

/* ================================================================
 * 蓝牙回调（Android 调用）
 * ================================================================ */
window.onBtDeviceList = function(deviceArray){
  var select = document.getElementById('deviceList');
  select.innerHTML = '';

  if (!deviceArray || !deviceArray.length) {
    var opt = document.createElement('option');
    opt.value = '';
    opt.textContent = '未找到已配对设备，请先在系统蓝牙里配对';
    select.appendChild(opt);
    addLog('扫描完成：没有已配对设备');
    return;
  }

  deviceArray.forEach(function(d){
    var o = document.createElement('option');
    o.value = d.address;
    o.textContent = d.name + ' (' + d.address + ')';
    select.appendChild(o);
  });
  addLog('扫描到 ' + deviceArray.length + ' 个设备');
};

window.onBtConnected = function(address){
  isBtConnected = true;
  document.getElementById('btDot').className = 'dot on';
  document.getElementById('btStatus').textContent = '已连接：' + address;
  document.getElementById('btnScan').style.display = 'none';
  document.getElementById('btnConnect').style.display = 'none';
  document.getElementById('btnDisconnect').style.display = 'block';
  document.getElementById('deviceList').disabled = true;
  addLog('已连接：' + address);

  /* 连接后先同步配置；收到 CFG: 回复后再读记录，避免两条指令撞车 */
  setTimeout(function(){ if (isBtConnected) sendViaBt('4'); }, 400);
};

window.onBtDisconnected = function(){
  isBtConnected = false;
  document.getElementById('btDot').className = 'dot off';
  document.getElementById('btStatus').textContent = '未连接';
  document.getElementById('btnScan').style.display = 'block';
  document.getElementById('btnConnect').style.display = 'block';
  document.getElementById('btnDisconnect').style.display = 'none';
  document.getElementById('deviceList').disabled = false;
  document.getElementById('timeText').textContent = '--:--:--';
  document.getElementById('dateText').textContent = '----';
  document.getElementById('vTemp').textContent = '--';
  document.getElementById('vHumi').textContent = '--';
  document.getElementById('vPress').textContent = '--';
  document.getElementById('vRain').textContent = '--';
  document.getElementById('alarmBox').innerHTML = '<span class="alarm-off">等待设备数据…</span>';

  reported = { Tmax: null, Hmax: null, Cyc: null };
  shown    = { Tmax: null, Hmax: null, Cyc: null };
  pending  = { Tmax: null, Hmax: null, Cyc: null };
  pendingUntil = { Tmax: 0, Hmax: 0, Cyc: 0 };
  inputTouched = { T: false, H: false };
  inputsSeeded = false;
  currentData  = { T: null, H: null, P: null, Rain: null, ALM: null };
  updateThresholdView();
  setThrStatus('', '');
  setCycStatus('', '');
  ['vTemp', 'vHumi', 'vRain'].forEach(function(id){
    document.getElementById(id).classList.remove('alarm');
  });

  addLog('连接已断开');
};

window.onBtError = function(errMsg){
  addLog('蓝牙错误：' + errMsg);
};

/* 蓝牙壳可能把多行拼在一次回调里（每秒上报 + 指令应答），
   必须按行拆开逐条处理，否则应答会被粘到遥测行里丢掉。 */
window.onBtData = function(payload){
  String(payload).split(/[\r\n]+/).forEach(function(raw){
    var line = raw.trim();
    if (line) handleLine(line);
  });
};

function handleLine(line){
  addLog(line);

  if (line.indexOf('OK:1') === 0)  { onThresholdAck('Tmax', line); return; }
  if (line.indexOf('ERR:1') === 0) { onThresholdErr('Tmax', '温度阈值下发失败（20~50）'); return; }
  if (line.indexOf('OK:2') === 0)  { onThresholdAck('Hmax', line); return; }
  if (line.indexOf('ERR:2') === 0) { onThresholdErr('Hmax', '湿度阈值下发失败（30~99）'); return; }
  if (line.indexOf('OK:3') === 0)  { onThresholdAck('Cyc', line); return; }
  if (line.indexOf('ERR:3') === 0) { onThresholdErr('Cyc', '记录周期下发失败'); return; }
  if (line.indexOf('OK:7') === 0) {
    setSyncStatus('时间同步成功', 'ok');
    if (syncTimer) { clearTimeout(syncTimer); syncTimer = null; }
    return;
  }
  if (line.indexOf('ERR:7') === 0) {
    setSyncStatus('时间同步失败（格式/范围错误）', 'err');
    if (syncTimer) { clearTimeout(syncTimer); syncTimer = null; }
    return;
  }
  if (line.indexOf('CFG:') === 0) { parseConfig(line); return; }

  parseTelemetry(line);
};

/* ================================================================
 * 上行解析
 * 格式：D:2026-10-21 18:30:25,T:25.6,H:60.0,P:1027.1,Rain:0,ALM:0
 * ================================================================ */
function parseTelemetry(line){
  var obj = {};
  line.split(',').forEach(function(seg){
    var i = seg.indexOf(':');
    if (i > 0) obj[seg.slice(0, i).trim()] = seg.slice(i + 1).trim();
  });

  /* D/T/H 齐了才当遥测行处理，避免把模块日志误当数据 */
  if (obj.D === undefined || obj.T === undefined || obj.H === undefined) return;

  var dt = obj.D.split(' ');
  if (dt.length >= 2) {
    document.getElementById('dateText').textContent = dt[0];
    document.getElementById('timeText').textContent = dt[1];
  } else {
    document.getElementById('dateText').textContent = obj.D;
  }

  currentData.T    = numOrNull(obj.T);
  currentData.H    = numOrNull(obj.H);
  currentData.P    = numOrNull(obj.P);
  currentData.Rain = numOrNull(obj.Rain);
  currentData.ALM  = numOrNull(obj.ALM);

  /* 阈值随每秒上报一起来：OLED 按键改过的值也能看到 */
  if (obj.Tmax !== undefined) applyReported('Tmax', numOrNull(obj.Tmax));
  if (obj.Hmax !== undefined) applyReported('Hmax', numOrNull(obj.Hmax));
  if (obj.Cyc !== undefined)  applyReported('Cyc',  numOrNull(obj.Cyc));

  var vTemp  = document.getElementById('vTemp');
  var vHumi  = document.getElementById('vHumi');
  var vPress = document.getElementById('vPress');
  var vRain  = document.getElementById('vRain');

  vTemp.textContent = obj.T;
  vHumi.textContent = obj.H;
  vPress.textContent = (obj.P !== undefined) ? obj.P : '--';

  var rainText = (currentData.Rain === 2) ? '大雨' : (currentData.Rain === 1) ? '小雨' : '无雨';
  vRain.textContent = rainText;

  /* 超限字段标红，与下方阈值回显对应 */
  vTemp.classList.toggle('alarm',
    shown.Tmax !== null && currentData.T !== null && currentData.T > shown.Tmax);
  vHumi.classList.toggle('alarm',
    shown.Hmax !== null && currentData.H !== null && currentData.H > shown.Hmax);
  vRain.classList.toggle('alarm', currentData.Rain >= 1);

  renderAlarm();

  /* 数据变化时才落一个波形采样点 */
  recordSample();
}

/* 报警卡：设备 ALM 为准，本地再用回传阈值说明是哪个条件触发 */
function renderAlarm(){
  var box = document.getElementById('alarmBox');

  if (currentData.ALM !== 1) {
    box.innerHTML = '<div class="alarm-ok">运行正常</div>';
    return;
  }

  var reasons = [];
  if (shown.Tmax !== null && currentData.T !== null && currentData.T > shown.Tmax) {
    reasons.push('温度 ' + currentData.T.toFixed(1) + '℃ > 上限 ' + shown.Tmax + '℃');
  }
  if (shown.Hmax !== null && currentData.H !== null && currentData.H > shown.Hmax) {
    reasons.push('湿度 ' + currentData.H.toFixed(1) + '% > 上限 ' + shown.Hmax + '%');
  }
  if (currentData.Rain >= 1) {
    reasons.push(currentData.Rain >= 2 ? '检测到大雨' : '检测到小雨');
  }

  box.innerHTML = '<div class="alarm-on">设备报警中' +
    (reasons.length ? '：' + reasons.join('；') : '') + '</div>';
}

/* ================================================================
 * 时间同步
 * ================================================================ */
function pad2(n){ return String(n).padStart(2, '0'); }

function syncTime(){
  if (!isBtConnected) { alert('请先连接蓝牙设备'); return; }

  var now = new Date();
  var cmd = '7,' + now.getFullYear() + ',' +
            (now.getMonth() + 1) + ',' + now.getDate() + ',' +
            now.getHours() + ',' + now.getMinutes() + ',' + now.getSeconds();

  if (!sendViaBt(cmd)) return;

  setSyncStatus('已发送，等待设备确认…', '');
  if (syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(function(){
    setSyncStatus('同步超时，未收到 OK:7', 'err');
    syncTimer = null;
  }, 3000);
}

function setSyncStatus(text, cls){
  var el = document.getElementById('syncStatus');
  el.textContent = text;
  el.className = 'sync-status ' + (cls || '');
}

/* ================================================================
 * 设备阈值：显示与下发分离
 * ----------------------------------------------------------------
 *   - 每行右侧直接显示“阈值名 + 下位机实际生效值”
 *   - 输入框是用户要下发的值，不被设备回传值覆盖
 *   - 下发后界面立即显示新值，设备确认/上报后自然接管；
 *     设备拒绝时回退到实际值，界面上不出现过程性文案
 * ================================================================ */
function numOrNull(v){
  var n = parseFloat(v);
  return isNaN(n) ? null : n;
}

function cycleText(v){
  return (v === null || !CYCLE_NAME[v]) ? '--' : CYCLE_NAME[v];
}

function updateThresholdView(){
  document.getElementById('curT').textContent = (shown.Tmax === null) ? '--' : shown.Tmax;
  document.getElementById('curH').textContent = (shown.Hmax === null) ? '--' : shown.Hmax;
  document.getElementById('curC').textContent = cycleText(shown.Cyc);
}

function markInputTouched(which){
  inputTouched[which] = true;
}

/* 首次拿到设备阈值时初始化输入框；之后不再覆盖用户输入 */
function seedInputsOnce(){
  if (inputsSeeded) return;
  if (reported.Tmax === null && reported.Hmax === null && reported.Cyc === null) return;

  if (!inputTouched.T && reported.Tmax !== null) {
    document.getElementById('tMaxInput').value = reported.Tmax;
  }
  if (!inputTouched.H && reported.Hmax !== null) {
    document.getElementById('hMaxInput').value = reported.Hmax;
  }
  if (reported.Cyc !== null) {
    document.getElementById('cycleSelect').value = String(reported.Cyc);
  }
  inputsSeeded = true;
}

/* 设备上报/应答的值生效 */
function applyReported(key, v){
  if (v === null) return;
  reported[key] = v;

  if (pending[key] !== null) {
    if (v === pending[key] || Date.now() >= pendingUntil[key]) {
      /* 已确认，或等待超时：以设备为准 */
      pending[key] = null;
      shown[key] = v;
    }
    /* 确认前忽略旧上报，避免下发后界面闪回旧值 */
  } else {
    shown[key] = v;
  }

  updateThresholdView();
  seedInputsOnce();
}

/* 下发后立即按目标值显示，不等设备回传 */
function applyPending(key, v){
  pending[key] = v;
  pendingUntil[key] = Date.now() + PENDING_HOLD_MS;
  shown[key] = v;
  updateThresholdView();
}

function clearPending(key){
  pending[key] = null;
  shown[key] = reported[key];
  updateThresholdView();
}

function onThresholdAck(key, line){
  var v = numOrNull(line.split(',')[1]);
  if (v !== null) {
    pending[key] = null;
    reported[key] = v;
    shown[key] = v;
    updateThresholdView();
  }
  if (key === 'Cyc') {
    setCycStatus('已生效：' + cycleText(v), 'ok');
  } else {
    setThrStatus((key === 'Tmax' ? '温度阈值' : '湿度阈值') +
                 '已生效：' + (v === null ? '--' : v), 'ok');
  }
}

function onThresholdErr(key, msg){
  clearPending(key);
  if (key === 'Cyc') setCycStatus(msg, 'err');
  else setThrStatus(msg, 'err');
}

/* ================================================================
 * 阈值 / 记录周期下发
 * ================================================================ */
function sendThreshold(which){
  var isTemp = (which === 'T');
  var key = isTemp ? 'Tmax' : 'Hmax';
  var val = parseInt(document.getElementById(isTemp ? 'tMaxInput' : 'hMaxInput').value, 10);
  var min = isTemp ? 20 : 30;
  var max = isTemp ? 50 : 99;

  if (isNaN(val) || val < min || val > max) {
    setThrStatus('请输入 ' + min + '~' + max + ' 之间的值', 'err');
    return;
  }

  if (!sendViaBt((isTemp ? '1,' : '2,') + val)) return;

  applyPending(key, val);
  setThrStatus('已下发', 'ok');
}

function sendCycle(){
  var v = parseInt(document.getElementById('cycleSelect').value, 10);
  if (isNaN(v) || v < 0 || v > 3) return;
  if (!sendViaBt('3,' + v)) return;

  applyPending('Cyc', v);
  setCycStatus('已下发', 'ok');
}

function setThrStatus(text, cls){
  var el = document.getElementById('thrStatus');
  el.textContent = text;
  el.className = 'sync-status ' + (cls || '');
}

function setCycStatus(text, cls){
  var el = document.getElementById('cycStatus');
  el.textContent = text;
  el.className = 'sync-status ' + (cls || '');
}

function parseConfig(line){
  /* CFG:Tmax:35,Hmax:80,Cyc:0 */
  var body = line.slice(4);
  body.split(',').forEach(function(seg){
    var i = seg.indexOf(':');
    if (i < 0) return;
    var k = seg.slice(0, i).trim();
    var v = numOrNull(seg.slice(i + 1).trim());
    if (k === 'Tmax') applyReported('Tmax', v);
    else if (k === 'Hmax') applyReported('Hmax', v);
    else if (k === 'Cyc') applyReported('Cyc', v);
  });
}

/* ================================================================
 * 本地波形记录（APP 侧保存，下位机只负责上报）
 * ----------------------------------------------------------------
 * 只在数据发生变化时落点（温度 ≥0.2℃ / 湿度 ≥1% / 气压 ≥0.5hPa），
 * 数据存 localStorage，保留最近 7 天，按天画 00:00~24:00 的曲线。
 * ================================================================ */
var HIST_KEY = 'wx_station_hist_v1';
var HIST_DAYS = 7;

/* 指标：1=温度 2=湿度 3=气压（对应采样点数组下标） */
var METRICS = {
  1: { name: '温度', unit: '℃',   color: '#F44336' },
  2: { name: '湿度', unit: '%RH',  color: '#2196F3' },
  3: { name: '气压', unit: 'hPa',  color: '#4CAF50' }
};
var curMetric = 1;

var hist = loadHist();
var lastSample = null;      /* 上一次落点的 [温度, 湿度, 气压] */

function dayKey(d){
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function loadHist(){
  try {
    var raw = localStorage.getItem(HIST_KEY);
    var o = raw ? JSON.parse(raw) : null;
    if (o && typeof o === 'object' && !Array.isArray(o)) return o;
  } catch (e) {}
  return {};
}

function saveHist(){
  try {
    var keys = Object.keys(hist).sort();
    while (keys.length > HIST_DAYS) delete hist[keys.shift()];
    localStorage.setItem(HIST_KEY, JSON.stringify(hist));
  } catch (e) {
    /* 配额满：丢掉最旧一天再试一次 */
    try {
      var ks = Object.keys(hist).sort();
      if (ks.length) {
        delete hist[ks[0]];
        localStorage.setItem(HIST_KEY, JSON.stringify(hist));
      }
    } catch (e2) {}
  }
}

/* 数据发生变化才落点：温度 0.2℃ / 湿度 1% / 气压 0.5hPa 死区，避免平段堆点 */
function recordSample(){
  if (currentData.T === null || currentData.H === null) return;

  if (lastSample) {
    var dT = Math.abs(currentData.T - lastSample[0]);
    var dH = Math.abs(currentData.H - lastSample[1]);
    var dP = 0;
    if (currentData.P !== null && lastSample[2] !== null) {
      dP = Math.abs(currentData.P - lastSample[2]);
    }
    if (dT < 0.2 && dH < 1 && dP < 0.5) return;
  }

  lastSample = [currentData.T, currentData.H, currentData.P];

  var now = new Date();
  var key = dayKey(now);
  if (!hist[key]) hist[key] = [];

  var pts = hist[key];
  var sec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
  pts.push([sec, currentData.T, currentData.H, currentData.P]);

  /* 单日超过 5000 点就隔点抽稀，避免 localStorage 膨胀 */
  if (pts.length > 5000) {
    var thinned = [];
    for (var i = 0; i < pts.length; i += 2) thinned.push(pts[i]);
    hist[key] = thinned;
  }

  saveHist();
  if (document.getElementById('tab-log').classList.contains('active')) {
    renderCharts();
  }
}

function clearHistory(){
  if (!confirm('确定清空本地波形记录？')) return;
  hist = {};
  lastSample = null;
  saveHist();
  renderCharts();
}

function setMetric(m){
  curMetric = m;
  document.querySelectorAll('#metricSeg button').forEach(function(b){
    b.classList.toggle('active', Number(b.dataset.m) === m);
  });
  renderCharts();
}

function refreshDaySelect(){
  var sel = document.getElementById('daySelect');
  var today = dayKey(new Date());
  var keys = Object.keys(hist).sort().reverse();
  if (keys.indexOf(today) < 0) keys.unshift(today);

  var cur = sel.value;
  sel.innerHTML = '';
  keys.forEach(function(k){
    var o = document.createElement('option');
    o.value = k;
    o.textContent = (k === today) ? ('今天 · ' + k) : k;
    sel.appendChild(o);
  });
  sel.value = (cur && keys.indexOf(cur) >= 0) ? cur : today;
}

function renderCharts(){
  refreshDaySelect();

  var key = document.getElementById('daySelect').value;
  var pts = hist[key] || [];
  var meta = METRICS[curMetric];

  drawChart(pts, curMetric, meta);
  renderStats(pts, curMetric, meta);
}

function fmtTime(sec){
  var h = Math.floor(sec / 3600);
  var m = Math.floor((sec % 3600) / 60);
  return pad2(h) + ':' + pad2(m);
}

function statValues(pts, idx){
  var out = [];
  for (var i = 0; i < pts.length; i++) {
    var v = pts[i][idx];
    if (v !== null && v !== undefined && !isNaN(v)) {
      out.push({ v: Number(v), sec: pts[i][0] });
    }
  }
  return out;
}

/* 日均 / 日高 / 日低（高低温附发生时刻） */
function renderStats(pts, idx, meta){
  var arr = statValues(pts, idx);
  var avg = document.getElementById('stAvg');
  var hi  = document.getElementById('stMax');
  var lo  = document.getElementById('stMin');
  var hiT = document.getElementById('stMaxTime');
  var loT = document.getElementById('stMinTime');

  if (!arr.length) {
    avg.textContent = '--';
    hi.textContent = '--';
    lo.textContent = '--';
    hiT.textContent = '';
    loT.textContent = '';
    return;
  }

  var sum = 0;
  var max = arr[0];
  var min = arr[0];
  for (var i = 0; i < arr.length; i++) {
    sum += arr[i].v;
    if (arr[i].v > max.v) max = arr[i];
    if (arr[i].v < min.v) min = arr[i];
  }

  avg.textContent = (sum / arr.length).toFixed(1) + meta.unit;
  hi.textContent = max.v.toFixed(1) + meta.unit;
  lo.textContent = min.v.toFixed(1) + meta.unit;
  hiT.textContent = fmtTime(max.sec);
  loT.textContent = fmtTime(min.sec);
}

/* 窗口刻度步长：让窗口内大约 4~6 格 */
function niceStep(span){
  var steps = [300, 600, 900, 1800, 3600, 7200, 10800, 21600, 43200, 86400];
  for (var i = 0; i < steps.length; i++) {
    if (span / steps[i] <= 6) return steps[i];
  }
  return 86400;
}

function fmtHM(sec){
  sec = Math.round(sec);
  if (sec >= 86400) return '24:00';
  return pad2(Math.floor(sec / 3600)) + ':' + pad2(Math.floor((sec % 3600) / 60));
}

/* 按时间分桶取均值：点太密时每个桶只保留一个代表点，压掉来回抖动 */
function aggregate(arr, winStart, winEnd, maxPoints){
  if (arr.length <= maxPoints) return arr;

  var bucketSec = (winEnd - winStart) / maxPoints;
  if (bucketSec <= 0) return arr;

  var out = [];
  var i = 0;
  while (i < arr.length) {
    var b = Math.floor((arr[i].sec - winStart) / bucketSec);
    var sumV = 0, sumT = 0, n = 0;

    while (i < arr.length && Math.floor((arr[i].sec - winStart) / bucketSec) === b) {
      sumV += arr[i].v;
      sumT += arr[i].sec;
      n++;
      i++;
    }
    out.push({ v: sumV / n, sec: sumT / n });
  }
  return out;
}

/* 画当日曲线：窗口随数据量自适应，数据密时按时间取均值 */
function drawChart(pts, idx, meta){
  var c = document.getElementById('chart');
  if (!c) return;

  var w = c.clientWidth;
  var h = c.clientHeight || 200;
  if (!w) return;

  var dpr = window.devicePixelRatio || 1;
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) {
    c.width = Math.round(w * dpr);
    c.height = Math.round(h * dpr);
  }

  var ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  var left = 36;
  var right = 8;
  var top = 10;
  var bottom = h - 18;

  var arr = statValues(pts, idx);

  /* 窗口：从首个点所在格到末个点所在格，最少保留 10 分钟 */
  var step = 21600;
  var winStart = 0;
  var winEnd = 86400;

  if (arr.length) {
    var firstSec = arr[0].sec;
    var lastSec = arr[arr.length - 1].sec;
    step = niceStep(Math.max(lastSec - firstSec, 600));

    winStart = Math.floor(firstSec / step) * step;
    winEnd = Math.ceil(Math.max(lastSec, winStart + step) / step) * step;
    if (winStart < 0) winStart = 0;
    if (winEnd > 86400) winEnd = 86400;
    if (winEnd <= winStart) winEnd = Math.min(86400, winStart + step);
  }

  /* 竖向网格 + 时间刻度 */
  ctx.strokeStyle = '#ECEFF1';
  ctx.lineWidth = 1;
  ctx.font = '10px sans-serif';

  for (var t = winStart; t <= winEnd; t += step) {
    var gx = left + (w - left - right) * (t - winStart) / (winEnd - winStart);
    ctx.beginPath();
    ctx.moveTo(Math.round(gx) + 0.5, top);
    ctx.lineTo(Math.round(gx) + 0.5, bottom);
    ctx.stroke();

    ctx.fillStyle = '#B0BEC5';
    ctx.textAlign = (t === winStart) ? 'left' : (t === winEnd) ? 'right' : 'center';
    ctx.fillText(fmtHM(t), gx, h - 4);
  }

  if (!arr.length) return;

  /* 点太密就分桶取均值，目标 2 像素一个点 */
  var maxPoints = Math.round((w - left - right) / 2);
  if (maxPoints < 40) maxPoints = 40;
  if (maxPoints > 240) maxPoints = 240;
  var drawPts = aggregate(arr, winStart, winEnd, maxPoints);

  var rawMin = Infinity;
  var rawMax = -Infinity;
  for (var k = 0; k < drawPts.length; k++) {
    if (drawPts[k].v < rawMin) rawMin = drawPts[k].v;
    if (drawPts[k].v > rawMax) rawMax = drawPts[k].v;
  }

  var min = rawMin;
  var max = rawMax;
  if (max - min < 0.5) { max += 0.5; min -= 0.5; }
  var pad = (max - min) * 0.12;
  min -= pad;
  max += pad;

  var toY = function(val){ return bottom - (val - min) / (max - min) * (bottom - top); };
  var toX = function(sec){ return left + (w - left - right) * (sec - winStart) / (winEnd - winStart); };

  /* 横向参考线 + 左侧量程 */
  ctx.strokeStyle = '#EEF1F3';
  for (var g = 0; g <= 2; g++) {
    var gy = top + (bottom - top) * g / 2;
    ctx.beginPath();
    ctx.moveTo(left, Math.round(gy) + 0.5);
    ctx.lineTo(w - right, Math.round(gy) + 0.5);
    ctx.stroke();
  }

  ctx.fillStyle = '#90A4AE';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(rawMax.toFixed(1), left - 5, top + 4);
  ctx.fillText(((rawMax + rawMin) / 2).toFixed(1), left - 5, (top + bottom) / 2 + 3);
  ctx.fillText(rawMin.toFixed(1), left - 5, bottom + 3);

  /* 曲线 */
  ctx.strokeStyle = meta.color;
  ctx.lineWidth = 1.8;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  for (var j = 0; j < drawPts.length; j++) {
    var px = toX(drawPts[j].sec);
    var py = toY(drawPts[j].v);
    if (j === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.stroke();

  /* 末端点 */
  var last = drawPts[drawPts.length - 1];
  ctx.fillStyle = meta.color;
  ctx.beginPath();
  ctx.arc(toX(last.sec), toY(last.v), 3, 0, Math.PI * 2);
  ctx.fill();
}

window.addEventListener('resize', function(){
  if (document.getElementById('tab-log').classList.contains('active')) renderCharts();
});

/* ================================================================
 * WebView 壳：把回调挂到 window.top
 * ================================================================ */
if (window.top !== window.self) {
  window.top.onBtDeviceList   = window.onBtDeviceList;
  window.top.onBtConnected    = window.onBtConnected;
  window.top.onBtDisconnected = window.onBtDisconnected;
  window.top.onBtError        = window.onBtError;
  window.top.onBtData         = window.onBtData;
}

/* 非 WebView 环境提示 */
if (!window.BluetoothBridge) {
  document.getElementById('bridgeTip').classList.add('show');
}

updateThresholdView();
refreshDaySelect();
renderCharts();
</script>
