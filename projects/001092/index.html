<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>智能点滴输液监控系统</title>
<style>
:root{
  --bg:#F5F5F5; --card:#FFFFFF; --primary:#2196F3; --alarm:#F44336;
  --ok:#4CAF50; --text:#212121; --sub:#757575;
  --shadow:0 2px 8px rgba(0,0,0,0.08); --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  height:100%;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);
}
body{display:flex;flex-direction:column;max-width:420px;margin:0 auto;}

/* ---- 顶部标题 ---- */
.app-bar{
  flex-shrink:0;height:48px;display:flex;align-items:center;justify-content:center;
  background:var(--card);border-bottom:1px solid #E0E0E0;
  font-size:16px;font-weight:600;
}

/* ---- Tab 内容区 ---- */
.tab-content{display:none;flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch;}
.tab-content.active{display:block;}

/* ---- 卡片 ---- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:14px;margin-bottom:12px;}
.card-title{font-size:13px;color:var(--sub);font-weight:600;margin-bottom:10px;}

/* ---- 状态栏 ---- */
.status-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);}
.dot{width:8px;height:8px;border-radius:50%;background:#BDBDBD;}
.dot.on{background:var(--ok);} .dot.off{background:var(--alarm);}

/* ---- 实时数据 ---- */
.data-row{display:flex;align-items:baseline;justify-content:space-between;
  padding:10px 0;border-bottom:1px solid #F0F0F0;}
.data-row:last-child{border-bottom:none;}
.data-name{font-size:13px;color:var(--sub);}
.data-val{font-size:28px;font-weight:700;line-height:1;}
.data-val.alarm{color:var(--alarm);}
.unit{font-size:13px;font-weight:400;color:var(--sub);margin-left:4px;}

/* ---- 报警卡 ---- */
.alarm-ok{color:var(--ok);font-size:15px;font-weight:600;}
.alarm-item{background:rgba(244,67,54,0.10);color:var(--alarm);border-radius:8px;
  padding:10px 12px;font-size:14px;font-weight:600;margin-bottom:8px;}
.alarm-item:last-child{margin-bottom:0;}

/* ---- 按钮 ---- */
.btn{display:block;width:100%;min-height:48px;border:none;border-radius:8px;
  background:var(--primary);color:#fff;font-size:15px;font-weight:600;
  cursor:pointer;-webkit-tap-highlight-color:transparent;}
.btn:active{opacity:.85;}
.btn.alarm{background:var(--alarm);}

/* ---- 阈值行 ---- */
.thr-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #F0F0F0;}
.thr-row:last-child{border-bottom:none;}
.thr-info{flex:1;min-width:0;}
.thr-label{font-size:14px;font-weight:600;}
.thr-current{font-size:12px;color:var(--sub);margin-top:2px;}
.thr-row input{width:80px;height:44px;border:1px solid #E0E0E0;border-radius:8px;
  padding:0 8px;font-size:15px;text-align:center;background:#FAFAFA;}
.thr-row button{width:64px;min-height:44px;border:none;border-radius:8px;
  background:var(--primary);color:#fff;font-size:14px;font-weight:600;}
.thr-row button:active{opacity:.85;}

/* ---- 日志 ---- */
.log-item{font-size:12px;color:var(--sub);padding:6px 0;border-bottom:1px dashed #EEE;
  word-break:break-all;}
.log-item:last-child{border-bottom:none;}
.log-time{color:#9E9E9E;margin-right:6px;}

/* ---- Toast ---- */
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);
  background:rgba(33,33,33,.88);color:#fff;font-size:13px;padding:10px 16px;
  border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99;}
#toast.show{opacity:1;}

/* ---- 底部 Tab 栏 ---- */
.tab-bar{display:flex;height:56px;background:#FFFFFF;border-top:1px solid #E0E0E0;flex-shrink:0;}
.tab-item{flex:1;display:flex;align-items:center;justify-content:center;cursor:pointer;
  color:#666;font-size:14px;font-weight:500;user-select:none;
  -webkit-tap-highlight-color:transparent;position:relative;}
.tab-item.active{color:var(--primary);font-weight:600;}
.badge{position:absolute;top:8px;right:calc(50% - 30px);min-width:16px;height:16px;
  border-radius:8px;background:var(--alarm);color:#fff;font-size:11px;
  line-height:16px;text-align:center;padding:0 4px;display:none;}
.badge.show{display:block;}
</style>
</head>
<body>

<div class="app-bar">智能点滴输液监控</div>

<!-- ============ 数据 ============ -->
<div class="tab-content active" id="tab-data">
  <div class="card">
    <div class="status-row">
      <span class="dot" id="conn-dot"></span>
      <span id="conn-text">连接中…</span>
      <span style="margin-left:auto" id="upd-time"></span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">实时数据</div>
    <div class="data-row">
      <span class="data-name">滴速</span>
      <span><span class="data-val" id="v-Rate">--</span><span class="unit">滴/分</span></span>
    </div>
    <div class="data-row">
      <span class="data-name">液位</span>
      <span><span class="data-val" id="v-Level">--</span><span class="unit">%</span></span>
    </div>
    <div class="data-row">
      <span class="data-name">药液温度</span>
      <span><span class="data-val" id="v-Temperature">--</span><span class="unit">℃</span></span>
    </div>
    <div class="data-row">
      <span class="data-name">加热状态</span>
      <span class="data-val" id="v-HeatOn" style="font-size:22px">--</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">报警状态</div>
    <div id="alarm-box"><div class="alarm-ok">运行正常</div></div>
  </div>
</div>

<!-- ============ 控制 ============ -->
<div class="tab-content" id="tab-ctrl">
  <div class="card">
    <div class="card-title">报警控制</div>
    <button class="btn alarm" id="btn-clear">消 警</button>
  </div>

  <div class="card">
    <div class="card-title">阈值设置</div>

    <div class="thr-row">
      <div class="thr-info">
        <div class="thr-label">滴速上限</div>
        <div class="thr-current">当前：<span id="cur-ThrRateHigh">--</span> 滴/分</div>
      </div>
      <input id="in-ThrRateHigh" type="number" inputmode="decimal" placeholder="0~500">
      <button data-thr="ThrRateHigh">发送</button>
    </div>

    <div class="thr-row">
      <div class="thr-info">
        <div class="thr-label">加热下限</div>
        <div class="thr-current">当前：<span id="cur-ThrHeatLow">--</span> ℃</div>
      </div>
      <input id="in-ThrHeatLow" type="number" inputmode="decimal" placeholder="0~90">
      <button data-thr="ThrHeatLow">发送</button>
    </div>

    <div class="thr-row">
      <div class="thr-info">
        <div class="thr-label">水位下限</div>
        <div class="thr-current">当前：<span id="cur-ThrLevelLow">--</span> %</div>
      </div>
      <input id="in-ThrLevelLow" type="number" inputmode="decimal" placeholder="0~100">
      <button data-thr="ThrLevelLow">发送</button>
    </div>
  </div>
</div>

<!-- ============ 日志 ============ -->
<div class="tab-content" id="tab-log">
  <div class="card">
    <div class="card-title">最近 20 条</div>
    <div id="log-box"><div class="log-item">等待数据…</div></div>
  </div>
</div>

<div class="tab-bar">
  <div class="tab-item active" data-tab="data">数据<span class="badge" id="alarm-badge"></span></div>
  <div class="tab-item" data-tab="ctrl">控制</div>
  <div class="tab-item" data-tab="log">日志</div>
</div>

<div id="toast"></div>

<script>
/* ================= 配置（OneNET 物模型） ================= */
const PID   = "kSN20Ey6s2";
const DEV   = "stm32";
/* 产品级 Token（res=products/{PID}），与固件里的设备级 Token 不是同一个 */
const TOKEN = "version=2018-10-31&res=products%2FkSN20Ey6s2&et=1924833600&method=md5&sign=zflhqcyShvsq8%2FNTMMOlyA%3D%3D";
const BASE  = "https://iot-api.heclouds.com";
const POLL_MS = 1000;

/* 阈值量程（与物模型一致） */
const RANGE = {
  ThrRateHigh: [0, 500],
  ThrHeatLow:  [0, 90],
  ThrLevelLow: [0, 100]
};

/* ================= 状态 ================= */
const D = {
  Rate: null, Level: null, Temperature: null, HeatOn: null,
  ThrRateHigh: null, ThrHeatLow: null, ThrLevelLow: null
};

/* 每个阈值独立的编辑状态，互不影响 */
const thrEdit = {
  ThrRateHigh: {dirty:false, focused:false},
  ThrHeatLow:  {dirty:false, focused:false},
  ThrLevelLow: {dirty:false, focused:false}
};

/* 待确认（乐观更新）—内部使用，不在界面上体现 */
const pendingThr = {};

let logs = [];

/* ================= Tab 切换 ================= */
document.querySelectorAll('.tab-item').forEach(item => {
  item.addEventListener('click', () => {
    const tab = item.dataset.tab;
    document.querySelectorAll('.tab-item').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
  });
});

function updateAlarmBadge(count){
  const badge = document.getElementById('alarm-badge');
  if (count > 0){ badge.textContent = count; badge.classList.add('show'); }
  else { badge.classList.remove('show'); }
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1500);
}

/* ================= 数据轮询 ================= */
function setConn(ok){
  const dot = document.getElementById('conn-dot');
  const txt = document.getElementById('conn-text');
  dot.className = 'dot ' + (ok ? 'on' : 'off');
  txt.textContent = ok ? '已连接' : '未连接';
}

function toNum(v){
  if (v === null || v === undefined || v === '') return null;
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}

function toBool(v){
  if (v === true || v === 'true' || v === 1 || v === '1') return true;
  if (v === false || v === 'false' || v === 0 || v === '0') return false;
  return null;
}

async function poll(){
  try{
    const r = await fetch(
      `${BASE}/thingmodel/query-device-property?product_id=${PID}&device_name=${DEV}`,
      { headers: { "Authorization": TOKEN }, cache: "no-store" });
    const j = await r.json();
    if (j.code !== 0) throw new Error(j.msg || ('code ' + j.code));

    const map = {};
    (j.data || []).forEach(it => { map[it.identifier] = it.value; });
    applyUplink(map);
    setConn(true);
    document.getElementById('upd-time').textContent = new Date().toLocaleTimeString();
  }catch(e){
    setConn(false);
  }
}

function applyUplink(map){
  D.Rate        = toNum(map.Rate);
  D.Level       = toNum(map.Level);
  D.Temperature = toNum(map.Temperature);
  D.HeatOn      = toBool(map.HeatOn);

  onUplinkThreshold('ThrRateHigh', toNum(map.ThrRateHigh));
  onUplinkThreshold('ThrHeatLow',  toNum(map.ThrHeatLow));
  onUplinkThreshold('ThrLevelLow', toNum(map.ThrLevelLow));

  renderData();
  checkAlarms();
  pushLog(map);
}

/* ================= 渲染 ================= */
function renderData(){
  const rateEl = document.getElementById('v-Rate');
  rateEl.textContent = (D.Rate === null) ? '--' : D.Rate;
  rateEl.classList.toggle('alarm',
    D.Rate !== null && D.ThrRateHigh !== null && D.Rate > D.ThrRateHigh);

  const lvEl = document.getElementById('v-Level');
  lvEl.textContent = (D.Level === null) ? '--' : D.Level;
  lvEl.classList.toggle('alarm',
    D.Level !== null && D.ThrLevelLow !== null && D.Level > 0 && D.Level < D.ThrLevelLow);

  document.getElementById('v-Temperature').textContent =
    (D.Temperature === null) ? '--' : D.Temperature.toFixed(1);

  document.getElementById('v-HeatOn').textContent =
    (D.HeatOn === null) ? '--' : (D.HeatOn ? '加热中' : '未加热');
}

function renderThreshold(key, value){
  const cur = document.getElementById('cur-' + key);
  cur.textContent = (value === null) ? '--' : value;
  /* 输入框只在未聚焦且未编辑时同步，避免打断用户输入 */
  const input = document.getElementById('in-' + key);
  if (!thrEdit[key].focused && !thrEdit[key].dirty && value !== null){
    input.value = value;
  }
}

/* ================= 报警 ================= */
function checkAlarms(){
  const list = [];
  if (D.Rate !== null && D.ThrRateHigh !== null && D.Rate > D.ThrRateHigh)
    list.push('滴速过高：' + D.Rate + ' 滴/分');
  if (D.Level !== null && D.ThrLevelLow !== null &&
      D.Level > 0 && D.Level < D.ThrLevelLow)
    list.push('水位过低：剩余 ' + D.Level + '%');

  const box = document.getElementById('alarm-box');
  if (list.length === 0){
    box.innerHTML = '<div class="alarm-ok">运行正常</div>';
  }else{
    box.innerHTML = list.map(t => '<div class="alarm-item">' + t + '</div>').join('');
  }
  updateAlarmBadge(list.length);
}

/* ================= 阈值同步（预测-确认） ================= */
function onUplinkThreshold(key, deviceValue){
  if (deviceValue === null) return;

  if (pendingThr[key] && Math.abs(deviceValue - pendingThr[key].value) < 0.05){
    clearTimeout(pendingThr[key].timer);
    delete pendingThr[key];               /* 设备确认，静默接管 */
  }

  if (pendingThr[key]){
    D[key] = pendingThr[key].value;       /* 待确认期间以本地目标值为准 */
  }else{
    D[key] = deviceValue;
  }
  renderThreshold(key, D[key]);
}

/* ================= 发送 ================= */
async function sendProperty(params){
  const r = await fetch(`${BASE}/thingmodel/set-device-property`, {
    method: "POST",
    headers: { "Authorization": TOKEN, "Content-Type": "application/json" },
    body: JSON.stringify({ product_id: PID, device_name: DEV, params })
  });
  const j = await r.json();
  if (j.code !== 0) throw new Error(j.msg || ('code ' + j.code));
  return j;
}

async function sendThreshold(key){
  const input = document.getElementById('in-' + key);
  const val = parseFloat(input.value);
  const [min, max] = RANGE[key];

  if (!Number.isFinite(val) || val < min || val > max){
    toast('请输入 ' + min + ' ~ ' + max + ' 之间的数值');
    return;
  }

  try{
    await sendProperty({ [key]: val });
  }catch(e){
    toast('发送失败，请检查网络');
    return;
  }

  thrEdit[key].dirty = false;
  applyOptimistic(key, val);
  toast('已发送');
}

function applyOptimistic(key, value){
  D[key] = value;
  document.getElementById('cur-' + key).textContent = value;
  document.getElementById('in-' + key).value = value;

  if (pendingThr[key]) clearTimeout(pendingThr[key].timer);
  pendingThr[key] = {
    value: value,
    timer: setTimeout(() => { delete pendingThr[key]; }, 5000)  /* 5s 未确认静默回落 */
  };

  renderData();
  checkAlarms();
}

document.querySelectorAll('button[data-thr]').forEach(btn => {
  btn.addEventListener('click', () => sendThreshold(btn.dataset.thr));
});

document.getElementById('btn-clear').addEventListener('click', async () => {
  try{
    await sendProperty({ AlarmClear: true });
    toast('已发送');
  }catch(e){
    toast('发送失败，请检查网络');
  }
});

/* 输入框编辑状态 */
Object.keys(thrEdit).forEach(key => {
  const el = document.getElementById('in-' + key);
  el.addEventListener('focus', () => { thrEdit[key].focused = true; });
  el.addEventListener('blur',  () => { thrEdit[key].focused = false; });
  el.addEventListener('input', () => { thrEdit[key].dirty = true; });
});

/* ================= 日志 ================= */
function pushLog(map){
  const t = new Date().toLocaleTimeString();
  const parts = [];
  if (map.Rate !== undefined)        parts.push('滴速 ' + map.Rate);
  if (map.Level !== undefined)       parts.push('液位 ' + map.Level);
  if (map.Temperature !== undefined) parts.push('温度 ' + map.Temperature);
  if (map.HeatOn !== undefined)      parts.push('加热 ' + map.HeatOn);
  logs.unshift('<span class="log-time">' + t + '</span>' + parts.join(' | '));
  if (logs.length > 20) logs.pop();

  document.getElementById('log-box').innerHTML =
    logs.map(l => '<div class="log-item">' + l + '</div>').join('');
}

/* ================= 启动 ================= */
poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
