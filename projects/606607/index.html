<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>IELTS 词句循环学习器</title>
  <style>
    :root {
      --bg: #eef2f7;
      --phone: #f9fafb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #687386;
      --line: #dce3ec;
      --primary: #2864d9;
      --primary-dark: #1e4fab;
      --green: #198754;
      --red: #c2413b;
      --amber: #a56a00;
      --chip: #e8efff;
      --shadow: 0 18px 44px rgba(18, 33, 64, 0.18);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .stage {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .phone {
      width: min(100%, 430px);
      height: min(920px, calc(100vh - 48px));
      min-height: 720px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--phone);
      border: 1px solid rgba(23, 32, 51, 0.1);
      border-radius: 32px;
      box-shadow: var(--shadow);
    }

    .statusbar {
      height: 28px;
      flex: 0 0 auto;
      display: flex;
      align-items: end;
      justify-content: space-between;
      padding: 0 22px 4px;
      color: #2f3848;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .appbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(249, 250, 251, 0.92);
    }

    .title-block {
      min-width: 0;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .screen-title {
      margin-top: 2px;
      font-size: 18px;
      line-height: 1.2;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .icon-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .content {
      flex: 1 1 auto;
      overflow: auto;
      padding: 16px 16px 98px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .stack {
      display: grid;
      gap: 12px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: 15px;
      line-height: 1.25;
      font-weight: 800;
    }

    .muted {
      color: var(--muted);
    }

    .small {
      font-size: 12px;
      line-height: 1.35;
    }

    .progress-row {
      display: grid;
      gap: 8px;
    }

    .progress-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .bar {
      grid-column: 1 / -1;
      height: 8px;
      overflow: hidden;
      background: #edf1f5;
      border-radius: 999px;
    }

    .bar span {
      display: block;
      width: var(--value, 0%);
      height: 100%;
      background: var(--primary);
      border-radius: inherit;
    }

    .primary-btn,
    .secondary-btn,
    .ghost-btn,
    .danger-btn {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 13px;
      border-radius: 8px;
      font-weight: 750;
    }

    .primary-btn {
      color: #fff;
      background: var(--primary);
    }

    .primary-btn:active {
      background: var(--primary-dark);
    }

    .secondary-btn {
      color: var(--primary);
      background: var(--chip);
    }

    .ghost-btn {
      color: var(--text);
      background: #f3f6fa;
      border: 1px solid var(--line);
    }

    .danger-btn {
      color: var(--red);
      background: #fff0ef;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .button-row.three {
      grid-template-columns: repeat(3, 1fr);
    }

    .week-list {
      display: grid;
      gap: 10px;
    }

    .week-card {
      width: 100%;
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 13px;
    }

    .week-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .week-name {
      font-size: 16px;
      font-weight: 850;
      line-height: 1.25;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      color: var(--primary);
      background: var(--chip);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .metric {
      padding: 9px 8px;
      background: #f5f7fa;
      border-radius: 8px;
    }

    .metric strong {
      display: block;
      font-size: 16px;
      line-height: 1.1;
    }

    .metric span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .sentence-box {
      min-height: 240px;
      display: grid;
      gap: 13px;
      align-content: start;
    }

    .sentence-count {
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
    }

    .english {
      font-size: 24px;
      line-height: 1.28;
      font-weight: 850;
    }

    .sentence-word {
      display: inline;
      margin: 0;
      padding: 0;
      color: inherit;
      background: transparent;
      border-radius: 4px;
      font: inherit;
      text-align: left;
      vertical-align: baseline;
      touch-action: manipulation;
    }

    .sentence-word:active {
      color: var(--primary);
      background: var(--chip);
    }

    .word-gap {
      width: 0.55em;
      min-height: 1.25em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0 0.04em;
      padding: 0;
      color: transparent;
      background: transparent;
      border-radius: 5px;
      vertical-align: -0.14em;
      touch-action: manipulation;
    }

    .word-gap.active {
      width: 0.85em;
      color: var(--primary);
      background: var(--chip);
      font-weight: 900;
    }

    .word-gap:active {
      background: #dce7ff;
    }

    .english-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: start;
    }

    .speak-btn {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      color: var(--primary);
      background: var(--chip);
      border: 1px solid #ccd9ff;
      border-radius: 10px;
    }

    .speak-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .chinese {
      color: #334155;
      font-size: 16px;
      line-height: 1.55;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 9px;
      color: #173b80;
      background: var(--chip);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 750;
    }

    .chip-btn {
      cursor: pointer;
    }

    .chip-btn:active {
      transform: translateY(1px);
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 48px;
    }

    .toggle {
      position: relative;
      width: 52px;
      height: 30px;
      flex: 0 0 auto;
      padding: 3px;
      background: #cfd8e3;
      border-radius: 999px;
      transition: background 0.18s ease;
    }

    .toggle::after {
      content: "";
      display: block;
      width: 24px;
      height: 24px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 1px 4px rgba(23, 32, 51, 0.24);
      transition: transform 0.18s ease;
    }

    .toggle.active {
      background: var(--primary);
    }

    .toggle.active::after {
      transform: translateX(22px);
    }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: end center;
      padding: 18px;
      background: rgba(15, 23, 42, 0.32);
    }

    .sheet-backdrop.active {
      display: grid;
    }

    .sheet {
      width: min(100%, 398px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.24);
      padding: 14px;
    }

    .sheet-word {
      font-size: 22px;
      line-height: 1.25;
      font-weight: 850;
    }

    .sheet-meaning {
      margin-top: 8px;
      color: #334155;
      font-size: 15px;
      line-height: 1.55;
    }

    .passage {
      display: grid;
      gap: 14px;
      line-height: 1.68;
      font-size: 16px;
    }

    .passage p {
      margin: 0;
    }

    .highlight {
      color: var(--primary);
      font-weight: 800;
    }

    .blank-token {
      min-width: 64px;
      min-height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0 2px;
      padding: 1px 8px;
      color: var(--primary);
      background: var(--chip);
      border: 1px solid #ccd9ff;
      border-radius: 8px;
      font-weight: 800;
      vertical-align: baseline;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 4px;
      background: #edf1f5;
      border-radius: 10px;
    }

    .reading-segmented {
      grid-template-columns: repeat(4, 1fr);
    }

    .segmented button {
      min-height: 34px;
      color: var(--muted);
      background: transparent;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
    }

    .segmented button.active {
      color: var(--text);
      background: var(--panel);
      box-shadow: 0 1px 4px rgba(23, 32, 51, 0.12);
    }

    .quiz-question {
      font-size: 18px;
      line-height: 1.45;
      font-weight: 800;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      color: var(--text);
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px;
      outline: none;
      line-height: 1.5;
    }

    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(40, 100, 217, 0.12);
    }

    .text-input {
      width: 100%;
      color: var(--text);
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px;
      outline: none;
    }

    .text-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(40, 100, 217, 0.12);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    #submitQuizBtn:disabled {
      cursor: wait;
    }

    .empty {
      display: grid;
      gap: 10px;
      place-items: center;
      min-height: 180px;
      text-align: center;
      color: var(--muted);
    }

    .bottom-nav {
      position: relative;
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, 0.95);
      border-top: 1px solid var(--line);
    }

    .nav-btn {
      min-width: 0;
      height: 52px;
      display: grid;
      place-items: center;
      gap: 3px;
      color: var(--muted);
      background: transparent;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 750;
    }

    .nav-btn svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-btn.active {
      color: var(--primary);
      background: var(--chip);
    }

    @media (max-width: 520px) {
      .stage {
        display: block;
        padding: 0;
      }

      .phone {
        width: 100%;
        height: 100vh;
        min-height: 100vh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .content {
        padding-left: 14px;
        padding-right: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="phone">
      <div class="statusbar">
        <span>9:41</span>
        <span>LTE 100%</span>
      </div>

      <header class="appbar">
        <button class="icon-btn" type="button" data-action="back" aria-label="返回">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"></path></svg>
        </button>
        <div class="title-block">
          <div class="eyebrow" id="screenEyebrow">IELTS</div>
          <div class="screen-title" id="screenTitle">今日学习</div>
        </div>
        <button class="icon-btn" type="button" data-screen="settings" aria-label="设置">
          <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"></path><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.37a1.7 1.7 0 0 0-1 .58V20a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-.58 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.63 15a1.7 1.7 0 0 0-.58-1H4a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 .58-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.63a1.7 1.7 0 0 0 1-.58V4a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 .58 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.37 9c.19.32.39.65.58 1H20a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-.51 1z"></path></svg>
        </button>
      </header>

      <section class="content">
        <div class="screen active" id="screen-home">
          <div class="stack">
            <div class="panel">
              <div class="section-head">
                <div class="section-title">当前 Week</div>
                <button class="ghost-btn small" type="button" data-screen="weeks">切换</button>
              </div>
              <div id="currentWeekSummary"></div>
            </div>

            <div class="button-row">
              <button class="primary-btn" type="button" data-screen="learn">继续学习</button>
              <button class="secondary-btn" type="button" data-screen="mistakes">查看错题</button>
            </div>
            <button class="ghost-btn" type="button" data-screen="vocabulary">个人生词本</button>
          </div>
        </div>

        <div class="screen" id="screen-weeks">
          <div class="week-list" id="weekList"></div>
        </div>

        <div class="screen" id="screen-detail">
          <div class="stack">
            <div class="panel" id="weekDetail"></div>
            <div class="button-row">
              <button class="primary-btn" type="button" data-screen="learn">逐句学习</button>
              <button class="secondary-btn" type="button" data-screen="read">整篇阅读</button>
            </div>
            <div class="button-row">
              <button class="ghost-btn" type="button" data-screen="quiz">开始抽查</button>
              <button class="ghost-btn" type="button" data-screen="mistakes">错题本</button>
            </div>
          </div>
        </div>

        <div class="screen" id="screen-learn">
          <div class="stack">
            <div class="panel sentence-box">
              <div class="sentence-count" id="sentenceCount"></div>
              <div class="english-row">
                <div class="english" id="sentenceEnglish"></div>
                <button class="speak-btn" type="button" data-action="speakSentence" aria-label="朗读当前句">
                  <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"></path><path d="M15 9.5a4 4 0 0 1 0 5"></path><path d="M18 7a8 8 0 0 1 0 10"></path></svg>
                </button>
              </div>
              <div class="small muted">点击两个英文词之间，可添加或取消分隔杠。</div>
              <div class="chinese" id="sentenceChinese"></div>
              <div>
                <div class="small muted">目标词</div>
                <div class="chips" id="sentenceWords"></div>
              </div>
              <div>
                <div class="small muted">词组 / 表达</div>
                <div class="chips" id="sentencePhrases"></div>
              </div>
            </div>
            <div class="button-row three">
              <button class="ghost-btn" type="button" data-action="prevSentence">上一句</button>
              <button class="primary-btn" type="button" data-action="markKnown" id="markKnownBtn">掌握这句</button>
              <button class="ghost-btn" type="button" data-action="nextSentence">下一句</button>
            </div>
            <div class="button-row">
              <button class="secondary-btn" type="button" data-action="toggleChinese" id="toggleChineseBtn">隐藏中文</button>
              <button class="danger-btn" type="button" data-action="markMistake">不太懂</button>
            </div>
          </div>
        </div>

        <div class="screen" id="screen-read">
          <div class="stack">
            <div class="segmented reading-segmented" id="readingModes">
              <button type="button" class="active" data-mode="english">纯英文</button>
              <button type="button" data-mode="bilingual">对照</button>
              <button type="button" data-mode="highlight">高亮</button>
              <button type="button" data-mode="blank">挖空</button>
            </div>
            <div class="panel">
              <div class="section-head">
                <div>
                  <div class="section-title" id="passageTitle"></div>
                  <div class="small muted" id="passageTopic"></div>
                </div>
              </div>
              <div class="passage" id="passageContent"></div>
            </div>
          </div>
        </div>

        <div class="screen" id="screen-quiz">
          <div class="stack">
            <div class="panel">
              <div class="section-head">
                <div>
                  <div class="section-title">抽查测试</div>
                  <div class="small muted" id="quizTypeLabel">英译中</div>
                </div>
                <button class="ghost-btn small" type="button" data-action="switchQuiz">切换</button>
              </div>
              <div class="quiz-question" id="quizQuestion"></div>
              <div class="small muted" id="quizSentenceCount"></div>
            </div>
            <div class="button-row">
              <button class="ghost-btn" type="button" data-action="prevQuiz" id="prevQuizBtn">上一句</button>
              <button class="ghost-btn" type="button" data-action="nextQuiz" id="nextQuizBtn">下一句</button>
            </div>
            <textarea id="quizAnswer" placeholder="在这里输入答案"></textarea>
            <button class="primary-btn" type="button" data-action="submitQuiz" id="submitQuizBtn">提交答案</button>
            <div class="panel" id="quizFeedback" hidden></div>
          </div>
        </div>

        <div class="screen" id="screen-mistakes">
          <div class="stack" id="mistakeList"></div>
        </div>

        <div class="screen" id="screen-vocabulary">
          <div class="stack" id="vocabularyList"></div>
        </div>

        <div class="screen" id="screen-settings">
          <div class="stack">
            <div class="panel">
              <div class="settings-row">
                <div>
                  <div class="section-title">默认显示中文</div>
                  <div class="small muted">关闭后，进入逐句学习时默认隐藏中文。</div>
                </div>
                <button class="toggle active" type="button" data-action="toggleDefaultChinese" id="defaultChineseToggle" aria-label="默认显示中文"></button>
              </div>
            </div>
            <div class="panel stack">
              <div>
                <div class="section-title">DeepSeek AI 评分</div>
                <div class="small muted" id="deepseekStatus">使用 deepseek-v4-flash。Key 仅保存在当前浏览器。</div>
              </div>
              <input class="text-input" id="deepseekApiKey" type="password" autocomplete="off" placeholder="输入 DeepSeek API Key">
              <div class="button-row">
                <button class="primary-btn" type="button" data-action="saveDeepseekKey">保存 Key</button>
                <button class="ghost-btn" type="button" data-action="clearDeepseekKey">清除 Key</button>
              </div>
            </div>
            <div class="panel">
              <div class="section-title">数据接入</div>

    function readSavedProgress() {
      try {
        return JSON.parse(localStorage.getItem("ielts.progress.v1") || "{}");
      } catch (error) {
        return {};
      }
    }

    function applySavedProgress() {
      const saved = readSavedProgress();
      if (!saved || typeof saved !== "object") return;

      if (saved.currentWeekId && APP_DATA.weeks.some((week) => week.id === saved.currentWeekId)) {
        state.currentWeekId = saved.currentWeekId;
      }
      if (Number.isInteger(saved.sentenceIndex)) {
        state.sentenceIndex = saved.sentenceIndex;
      }
      if (typeof saved.showChineseByDefault === "boolean") {
        state.settings.showChineseByDefault = saved.showChineseByDefault;
        state.showChinese = saved.showChineseByDefault;
        localStorage.setItem("ielts.showChineseByDefault", String(saved.showChineseByDefault));
      }
      if (Array.isArray(saved.masteredSentences)) {
        state.masteredSentences = new Set(saved.masteredSentences);
      }
      if (Array.isArray(saved.masteredWords)) {
        state.masteredWords = new Set(saved.masteredWords);
      }
      if (Array.isArray(saved.masteredPhrases)) {
        state.masteredPhrases = new Set(saved.masteredPhrases);
      }
      if (saved.sentenceBreaks && typeof saved.sentenceBreaks === "object" && !Array.isArray(saved.sentenceBreaks)) {
        state.sentenceBreaks = saved.sentenceBreaks;
      }
      if (Array.isArray(saved.vocabulary)) {
        state.vocabulary = saved.vocabulary;
      }
      if (Array.isArray(saved.mistakes)) {
        APP_DATA.mistakes = saved.mistakes;
      }
      APP_DATA.weeks.forEach(syncWeekStats);

      const sentence = passage.sentences[state.sentenceIndex];
      state.masteredSentences.add(sentenceKey());
      (sentence.target_words || []).forEach((word) => {
        state.masteredWords.add(`${state.currentWeekId}:${word.toLowerCase()}`);
      });
      (sentence.target_phrases || []).forEach((phrase) => {
        state.masteredPhrases.add(`${state.currentWeekId}:${phrase.toLowerCase()}`);
      });
      syncWeekStats();
      saveProgress();
    }

    function resetSentenceVisibility() {
      state.showChinese = state.settings.showChineseByDefault;
    }

    function clampSentenceIndex() {
      const passage = currentPassage();
      state.sentenceIndex = Math.max(0, Math.min(state.sentenceIndex, passage.sentences.length - 1));
    }

    function go(screen, push = true) {
      state.screen = screen;
      if (push && state.history[state.history.length - 1] !== screen) {
        state.history.push(screen);
      }
      saveProgress();
      render();
    }

    function goBack() {
      if (state.history.length > 1) {
        state.history.pop();
        state.screen = state.history[state.history.length - 1];
      } else {
        state.screen = "home";
      }
      saveProgress();
      render();
    }

    function render() {
      APP_DATA.weeks.forEach(syncWeekStats);
      $$(".screen").forEach((screen) => screen.classList.remove("active"));
      $(`#screen-${state.screen}`).classList.add("active");

      const [eyebrow, title] = titles[state.screen] || titles.home;
      $("#screenEyebrow").textContent = eyebrow;
      $("#screenTitle").textContent = title;

      $$(".nav-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.screen === state.screen);
      });

      renderHome();
      renderWeeks();
      renderDetail();
      renderLearn();
      renderRead();
      renderQuiz();
      renderMistakes();
      renderVocabulary();
      renderSettings();
    }

    function renderSegmentedSentence(text) {
      const words = text.trim().split(/\s+/);
      const breaks = new Set(state.sentenceBreaks[sentenceKey()] || []);
      return words.map((token, index) => {
        const match = token.match(/^([^A-Za-z']*)([A-Za-z]+(?:'[A-Za-z]+)?)([^A-Za-z']*)$/);
        const wordHtml = match
          ? `${escapeHtml(match[1])}<button class="sentence-word" type="button" data-lookup-type="sentence-word" data-lookup-value="${escapeHtml(match[2])}">${escapeHtml(match[2])}</button>${escapeHtml(match[3])}`
          : escapeHtml(token);
        if (index === words.length - 1) return wordHtml;
        const active = breaks.has(index);
        return `${wordHtml}<button class="word-gap${active ? " active" : ""}" type="button" data-break-index="${index}" aria-label="${active ? "取消" : "添加"}词间分隔">${active ? "|" : "·"}</button>`;
      }).join("");
    }

    function renderLearn() {
      clampSentenceIndex();
      const passage = currentPassage();
      const sentence = passage.sentences[state.sentenceIndex];
      $("#sentenceCount").textContent = `Sentence ${state.sentenceIndex + 1} / ${passage.sentences.length}`;
      $("#sentenceEnglish").innerHTML = renderSegmentedSentence(sentence.english);
      $("#sentenceEnglish").classList.remove("muted");
      $("#sentenceChinese").textContent = state.showChinese ? sentence.chinese : "中文已隐藏";
      $("#sentenceWords").innerHTML = (sentence.target_words || []).map((word) => `<button class="chip chip-btn" type="button" data-lookup-type="word" data-lookup-value="${escapeHtml(word)}">${escapeHtml(word)}</button>`).join("");
      $("#sentencePhrases").innerHTML = (sentence.target_phrases || []).map((phrase) => `<button class="chip chip-btn" type="button" data-lookup-type="phrase" data-lookup-value="${escapeHtml(phrase)}">${escapeHtml(phrase)}</button>`).join("");
      $("#toggleChineseBtn").textContent = state.showChinese ? "隐藏中文" : "显示中文";
      const mastered = state.masteredSentences.has(sentenceKey());
      $("#markKnownBtn").textContent = mastered ? "已掌握" : "掌握这句";
      $("#markKnownBtn").className = mastered ? "secondary-btn" : "primary-btn";
    }

    function renderSettings() {
      const toggle = $("#defaultChineseToggle");
      if (toggle) {
        toggle.classList.toggle("active", state.settings.showChineseByDefault);
        toggle.setAttribute("aria-pressed", String(state.settings.showChineseByDefault));
      }
      const keyInput = $("#deepseekApiKey");
      const hasKey = Boolean(localStorage.getItem(DEEPSEEK_KEY_STORAGE));
      if (keyInput && document.activeElement !== keyInput) {
        keyInput.value = "";
        keyInput.placeholder = hasKey ? "Key 已保存，输入新 Key 可替换" : "输入 DeepSeek API Key";
      }
      const status = $("#deepseekStatus");
      if (status) {
        status.textContent = hasKey
          ? `已配置 ${DEEPSEEK_MODEL}，抽查提交后由 AI 评分。`
          : `未配置 Key。使用 ${DEEPSEEK_MODEL}，Key 仅保存在当前浏览器。`;
      }
    }

    function renderRead() {
      const passage = currentPassage();
      $("#passageTitle").textContent = passage.title;
      $("#passageTopic").textContent = `${passage.topic} · ${passage.difficulty || "IELTS 5.5-6.5"}`;
      $$("#readingModes button").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.mode === state.readingMode);
      });

      $("#passageContent").innerHTML = passage.sentences.map((sentence) => {

          return `<p>${escapeHtml(sentence.english)}</p>`;
        }

        if (state.readingMode === "highlight") {
          return `<p>${highlightWords(sentence.english, sentence.target_words || [])}</p>`;
        }

        if (state.readingMode === "blank") {
          return `<p>${blankWords(sentence.english, sentence.target_words || [])}<br><span class="muted">${escapeHtml(sentence.chinese)}</span></p>`;
        }

        return `<p>${escapeHtml(sentence.english)}<br><span class="muted">${escapeHtml(sentence.chinese)}</span></p>`;
      }).join("");
    }

    function renderQuiz() {
      clampSentenceIndex();
      const passage = currentPassage();
      const sentence = passage.sentences[state.sentenceIndex];
      const isEnToCn = state.quizType === "en_to_cn";
      $("#quizTypeLabel").textContent = isEnToCn ? "英译中" : "中译英";
      $("#quizQuestion").textContent = isEnToCn ? sentence.english : sentence.chinese;
      $("#quizSentenceCount").textContent = `第 ${state.sentenceIndex + 1} 句 / 共 ${passage.sentences.length} 句`;
      $("#prevQuizBtn").disabled = state.sentenceIndex === 0;
      $("#nextQuizBtn").disabled = state.sentenceIndex === passage.sentences.length - 1;
    }

    function resetQuizInput() {

      $("#quizFeedback").hidden = true;

            <button class="ghost-btn" type="button" data-remove-mistake="${index}">标记掌握</button>

    function renderVocabulary() {

          <div class="panel empty">
            <div class="section-title">暂无生词</div>

    function addMistake(type, question, answer) {
      APP_DATA.mistakes.unshift({
        type,
        question,
        answer,
        week: currentWeek().name,
        weekId: state.currentWeekId,
        sentenceIndex: state.sentenceIndex,
        createdAt: new Date().toISOString()
      });
      const week = currentWeek();
      week.mistakes += 1;
      saveProgress();
    }

    function getEnglishVoice() {
      if (!("speechSynthesis" in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      const englishVoices = voices.filter((voice) => voice.lang && voice.lang.toLowerCase().startsWith("en-"));
      return englishVoices.find((voice) => voice.lang === "en-GB" && /google|microsoft|natural|premium/i.test(voice.name))
        || englishVoices.find((voice) => voice.lang === "en-US" && /google|microsoft|natural|premium/i.test(voice.name))
        || englishVoices.find((voice) => voice.lang === "en-GB")
        || englishVoices.find((voice) => voice.lang === "en-US")
        || englishVoices[0]
        || null;
    }

    function speakEnglish(text) {
      if (!text || !("speechSynthesis" in window)) {
        return;
      }

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      const voice = getEnglishVoice();
      utterance.lang = voice?.lang || "en-US";
      utterance.rate = 0.82;
      utterance.pitch = 1;
      if (voice) utterance.voice = voice;
      window.speechSynthesis.speak(utterance);
    }

    function speakCurrentSentence() {
      const sentence = currentPassage().sentences[state.sentenceIndex];
      speakEnglish(sentence.english);
    }

    function showLookup(type, value) {
      const key = value.toLowerCase();
      const isWord = type === "word";
      const isSentenceWord = type === "sentence-word";
      const meaning = isSentenceWord
        ? APP_DATA.sentenceWordTranslations[key] || APP_DATA.wordTranslations[key]
        : isWord
          ? APP_DATA.wordTranslations[key]
          : APP_DATA.phraseTranslations[value] || APP_DATA.phraseTranslations[key];
      $("#lookupType").textContent = isSentenceWord ? "句中单词" : isWord ? "目标词" : "词组 / 表达";
      $("#lookupWord").textContent = value;
      $("#lookupMeaning").textContent = meaning || "暂时没有释义，后续接入词组库后会自动补全。";
      state.lookupText = value;
      state.lookupMeaning = meaning || "";
      const vocabularyBtn = $("#lookupVocabularyBtn");
      const saved = state.vocabulary.some((item) => item.word.toLowerCase() === key);
      vocabularyBtn.hidden = !isSentenceWord && !isWord;
      vocabularyBtn.textContent = saved ? "已加入生词本，点击移除" : "加入生词本";
      $("#lookupSheet").classList.add("active");
      $("#lookupSheet").setAttribute("aria-hidden", "false");
      speakEnglish(value);
    }

    function toggleVocabulary() {
      const key = state.lookupText.toLowerCase();
      const index = state.vocabulary.findIndex((item) => item.word.toLowerCase() === key);
      if (index >= 0) {
        state.vocabulary.splice(index, 1);
      } else {
        state.vocabulary.unshift({
          word: state.lookupText,
          meaning: state.lookupMeaning || "暂无释义",
          sentence: currentPassage().sentences[state.sentenceIndex]?.english || "",
          addedAt: new Date().toISOString()
        });
      }
      saveProgress();
      renderVocabulary();
      $("#lookupVocabularyBtn").textContent = index >= 0 ? "加入生词本" : "已加入生词本，点击移除";
    }

    function closeLookup() {
      $("#lookupSheet").classList.remove("active");
      $("#lookupSheet").setAttribute("aria-hidden", "true");
    }

    function setDefaultChinese(value) {
      state.settings.showChineseByDefault = value;
      state.showChinese = value;
      localStorage.setItem("ielts.showChineseByDefault", String(value));
      saveProgress();
      render();
    }

    function saveDeepseekKey() {
      const input = $("#deepseekApiKey");
      const key = input.value.trim();
      if (!key) {
        $("#deepseekStatus").textContent = "请输入有效的 DeepSeek API Key。";
        return;
      }
      localStorage.setItem(DEEPSEEK_KEY_STORAGE, key);
      input.value = "";
      renderSettings();
    }

    function clearDeepseekKey() {
      localStorage.removeItem(DEEPSEEK_KEY_STORAGE);
      renderSettings();
    }

    function normalizeQuizResult(result) {
      const score = Math.max(0, Math.min(100, Number(result.score) || 0));
      return {
        score,
        passed: score >= QUIZ_PASS_SCORE,
        feedback: String(result.feedback || "暂无具体反馈。"),
        improvedAnswer: String(result.improved_answer || "")
      };
    }

    async function scoreQuizWithDeepseek(question, userAnswer, reference, quizType) {
      const apiKey = localStorage.getItem(DEEPSEEK_KEY_STORAGE);
      if (!apiKey) {
        throw new Error("请先在设置页保存 DeepSeek API Key。");
      }

      const direction = quizType === "en_to_cn" ? "英译中" : "中译英";
      const response = await fetch(DEEPSEEK_API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: DEEPSEEK_MODEL,
          thinking: { type: "disabled" },
          response_format: { type: "json_object" },
          max_tokens: 400,
          messages: [
            {
              role: "system",
              content: "你是严格但合理的英语翻译老师。按语义准确性、关键信息完整性和语言自然度评分。不要因措辞与参考答案不同而扣分。输出且只输出 JSON，格式为：{\"score\":85,\"feedback\":\"简短中文反馈\",\"improved_answer\":\"更自然的参考表达\"}。score 为 0 到 100 的整数。"
            },
            {
              role: "user",
              content: `评分类型：${direction}\n题目：${question}\n学生答案：${userAnswer}\n参考答案：${reference}\n请输出 JSON 评分。`
            }
          ]
        })
      });

      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(payload.error?.message || `DeepSeek 请求失败（HTTP ${response.status}）`);
      }

      const content = payload.choices?.[0]?.message?.content;
      if (!content) {
        throw new Error("DeepSeek 没有返回评分内容，请重试。");
      }
      return normalizeQuizResult(JSON.parse(content));
    }

    async function submitQuiz() {
      const sentence = currentPassage().sentences[state.sentenceIndex];
      const userAnswer = $("#quizAnswer").value.trim();
      const reference = state.quizType === "en_to_cn" ? sentence.chinese : sentence.english;
      if (!userAnswer) {
        $("#quizFeedback").hidden = false;
        $("#quizFeedback").innerHTML = `<div class="section-title">先输入答案</div><p class="small muted">输入后将由 ${DEEPSEEK_MODEL} 评分。</p>`;
        return;
      }

      const submitBtn = $("#submitQuizBtn");
      submitBtn.disabled = true;
      submitBtn.textContent = "AI 评分中...";
      $("#quizFeedback").hidden = false;
      $("#quizFeedback").innerHTML = `<div class="section-title">正在评分</div><p class="small muted">${DEEPSEEK_MODEL} 正在比较你的答案与参考答案。</p>`;

      try {
        const result = await scoreQuizWithDeepseek(
          $("#quizQuestion").textContent,
          userAnswer,
          reference,
          state.quizType
        );
        if (!result.passed) {
          addMistake(state.quizType === "en_to_cn" ? "英译中" : "中译英", $("#quizQuestion").textContent, userAnswer);
        }
        $("#quizFeedback").innerHTML = `
          <div class="section-title">${result.passed ? "通过" : "需要复习"} · ${result.score} 分</div>
          <p>${escapeHtml(result.feedback)}</p>
          ${result.improvedAnswer ? `<p><strong>推荐表达：</strong>${escapeHtml(result.improvedAnswer)}</p>` : ""}
          <p class="small muted">${result.passed ? "本题未加入错题本。" : "低于 70 分，已加入错题本。"}</p>
          <p><strong>参考答案：</strong>${escapeHtml(reference)}</p>
        `;
        $("#quizAnswer").value = "";
        renderHome();
        renderMistakes();
      } catch (error) {
        $("#quizFeedback").innerHTML = `
          <div class="section-title">评分失败</div>
          <p class="small muted">${escapeHtml(error.message || "无法连接 DeepSeek。")}</p>
          <p><strong>参考答案：</strong>${escapeHtml(reference)}</p>
        `;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "提交答案";
      }
    }

    function highlightWords(text, words) {
      let escaped = escapeHtml(text);
      words.forEach((word) => {
        const safeWord = escapeRegExp(word);
        escaped = escaped.replace(new RegExp(`\\b(${safeWord})\\b`, "gi"), '<span class="highlight">$1</span>');
      });
      return escaped;
    }

    function blankWords(text, words) {
      let escaped = escapeHtml(text);
      words.forEach((word) => {
        const safeWord = escapeRegExp(word);
        escaped = escaped.replace(new RegExp(`\\b(${safeWord})\\b`, "gi"), (match) => {
          return `<button class="blank-token" type="button" data-blank-answer="${escapeHtml(match)}">_____</button>`;
        });
      });
      return escaped;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeRegExp(value) {
      return String(value).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    document.addEventListener("click", (event) => {
      const screenBtn = event.target.closest("[data-screen]");
      if (screenBtn) {
        go(screenBtn.dataset.screen);
        return;
      }

      const weekBtn = event.target.closest("[data-week-id]");
      if (weekBtn) {
        state.currentWeekId = weekBtn.dataset.weekId;
        state.sentenceIndex = 0;
        resetSentenceVisibility();
        saveProgress();
        go("detail");
        return;
      }

      const lookupBtn = event.target.closest("[data-lookup-type]");
      if (lookupBtn) {
        showLookup(lookupBtn.dataset.lookupType, lookupBtn.dataset.lookupValue);
        return;
      }

      const breakBtn = event.target.closest("[data-break-index]");
      if (breakBtn) {
        const key = sentenceKey();
        const index = Number(breakBtn.dataset.breakIndex);
        const breaks = new Set(state.sentenceBreaks[key] || []);
        if (breaks.has(index)) {
          breaks.delete(index);
        } else {
          breaks.add(index);
        }
        state.sentenceBreaks[key] = Array.from(breaks).sort((a, b) => a - b);
        saveProgress();
        renderLearn();
        return;
      }

      const actionBtn = event.target.closest("[data-action]");
      if (actionBtn) {
        const action = actionBtn.dataset.action;
        if (action === "back") goBack();
        if (action === "prevSentence") {
          state.sentenceIndex -= 1;
          resetSentenceVisibility();
          saveProgress();
        }
        if (action === "nextSentence") {
          state.sentenceIndex += 1;
          resetSentenceVisibility();
          saveProgress();
        }
        if (action === "toggleChinese") {
          state.showChinese = !state.showChinese;
          saveProgress();
        }
        if (action === "markKnown") {
          markCurrentSentenceMastered();
          const passage = currentPassage();
          if (state.sentenceIndex < passage.sentences.length - 1) {
            state.sentenceIndex += 1;
            resetSentenceVisibility();
          }
          saveProgress();
        }
        if (action === "markMistake") {
          const sentence = currentPassage().sentences[state.sentenceIndex];
          addMistake("句子", sentence.english, sentence.chinese);
          go("mistakes");
          return;
        }
        if (action === "switchQuiz") {
          state.quizType = state.quizType === "en_to_cn" ? "cn_to_en" : "en_to_cn";
          resetQuizInput();
        }
        if (action === "prevQuiz") {
          state.sentenceIndex -= 1;
          clampSentenceIndex();
          resetQuizInput();
          saveProgress();
        }
        if (action === "nextQuiz") {
          state.sentenceIndex += 1;
          clampSentenceIndex();
          resetQuizInput();
          saveProgress();
        }
        if (action === "submitQuiz") {
          submitQuiz();
          return;
        }
        if (action === "saveDeepseekKey") {
          saveDeepseekKey();
          return;
        }
        if (action === "clearDeepseekKey") {
          clearDeepseekKey();
          return;
        }
        if (action === "speakSentence") {
          speakCurrentSentence();
          return;
        }
        if (action === "speakLookup") {
          speakEnglish(state.lookupText);
          return;
        }
        if (action === "toggleVocabulary") {
          toggleVocabulary();
          return;
        }
        if (action === "toggleDefaultChinese") {
          setDefaultChinese(!state.settings.showChineseByDefault);
          return;
        }
        if (action === "closeLookup") {
          closeLookup();
          return;
        }
        render();
        return;
      }

      const modeBtn = event.target.closest("[data-mode]");
      if (modeBtn) {
        state.readingMode = modeBtn.dataset.mode;
        saveProgress();
        renderRead();
        return;
      }

      const blankBtn = event.target.closest("[data-blank-answer]");
      if (blankBtn) {
        blankBtn.textContent = blankBtn.dataset.blankAnswer;
        return;
      }

      const removeBtn = event.target.closest("[data-remove-mistake]");
      if (removeBtn) {
        APP_DATA.mistakes.splice(Number(removeBtn.dataset.removeMistake), 1);
        saveProgress();
        renderMistakes();
      }

      const removeVocabularyBtn = event.target.closest("[data-remove-vocabulary]");
      if (removeVocabularyBtn) {
        state.vocabulary.splice(Number(removeVocabularyBtn.dataset.removeVocabulary), 1);
        saveProgress();
        renderVocabulary();
        return;
      }

      const reviewBtn = event.target.closest("[data-review-mistake]");
      if (reviewBtn) {
        const item = APP_DATA.mistakes[Number(reviewBtn.dataset.reviewMistake)];
        if (item?.weekId && Number.isInteger(item.sentenceIndex)) {
          state.currentWeekId = item.weekId;
          state.sentenceIndex = item.sentenceIndex;
          resetSentenceVisibility();
          saveProgress();
          go("learn");
        }
        return;
      }

      if (event.target.id === "lookupSheet") {
        closeLookup();
      }
    });

    if ("speechSynthesis" in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    applySavedProgress();
    render();
  </script>
</body>
</html>
