<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>万年历环境监测系统</title>
<style>
:root{
  --bg:#F5F5F5;
  --card:#FFFFFF;
  --primary:#2196F3;
  --alarm:#F44336;
  --ok:#4CAF50;
  --text:#212121;
  --sub:#757575;
  --line:#E0E0E0;
  --shadow:0 2px 8px rgba(0,0,0,0.08);
  --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
}
body{
  display:flex;
  flex-direction:column;
  max-width:420px;
  margin:0 auto;
}

/* ---------- Tab 内容区 ---------- */
.tab-content{
  display:none;
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:12px;
}
.tab-content.active{display:block;}

/* ---------- 卡片 ---------- */
.card{
  background:var(--card);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
  box-shadow:var(--shadow);
}
.card h3{
  font-size:15px;
  font-weight:600;
  margin-bottom:12px;
  color:var(--text);
}
.sub{font-size:13px;color:var(--sub);}
.hint{display:none;font-size:13px;color:var(--alarm);margin-top:8px;}

/* 未连接时卡片置灰 */
body.bt-off .needs-bt{opacity:.55;}
body.bt-off .needs-bt button,
body.bt-off .needs-bt input{pointer-events:none;}
body.bt-off .needs-bt .hint{display:block;}

/* ---------- 蓝牙连接卡 ---------- */
.connect-card{border-left:4px solid #FF9800;}
.bt-status-row{display:flex;align-items:center;font-size:14px;margin-bottom:12px;}
.dot{width:10px;height:10px;border-radius:50%;background:#BDBDBD;margin-right:8px;}
.dot.on{background:var(--ok);}
.dot.off{background:var(--alarm);}
.device-select{
  width:100%;
  padding:10px;
  border-radius:6px;
  border:1px solid var(--line);
  font-size:14px;
  background:#fff;
  margin-bottom:8px;
}
.btn{
  width:100%;
  min-height:48px;
  border:none;
  border-radius:8px;
  background:var(--primary);
  color:#fff;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}
.btn:active{filter:brightness(.92);}
.btn.danger{background:#FF5722;}
.btn.ghost{background:#EEEEEE;color:var(--text);}
.btn + .btn{margin-top:8px;}

/* ---------- 时间卡 ---------- */
.time-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.time-date{font-size:20px;font-weight:700;letter-spacing:.5px;}
.time-clock{font-size:30px;font-weight:700;color:var(--primary);margin:6px 0 2px;}
.time-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.chip{
  display:inline-block;
  padding:3px 10px;
  border-radius:12px;
  font-size:13px;
  font-weight:600;
  line-height:1.5;
  background:#F0F0F0;
  color:var(--sub);
  white-space:nowrap;
}
.chip-week{flex-shrink:0;}
.chip-blue{background:#E8F0FE;color:#1565C0;}
.chip-orange{background:#FFF3E0;color:#B26A00;}
.chip-green{background:#E8F5E9;color:#2E7D32;}

/* ---------- 数据行 ---------- */
.row{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  padding:8px 0;
  border-bottom:1px solid #F0F0F0;
}
.row:last-child{border-bottom:none;}
.row .label{font-size:14px;color:var(--sub);}
.row .value{font-size:28px;font-weight:700;line-height:1.1;}
.row .value small{font-size:13px;font-weight:400;color:var(--sub);margin-left:4px;}
.row .value.red{color:var(--alarm);}
.row-sm{padding:10px 0;}
.row-sm .label{font-size:14px;color:var(--sub);}
.rt-value{font-size:18px;font-weight:700;}
.rt-unit{font-size:12px;font-weight:400;color:var(--sub);margin-left:3px;}

/* ---------- 报警卡 ---------- */
.alarm-ok{color:var(--ok);font-size:16px;font-weight:600;}
.alarm-off{color:var(--sub);font-size:15px;}
.alarm-item{
  background:#FFEBEE;
  color:var(--alarm);
  border-left:4px solid var(--alarm);
  border-radius:6px;
  padding:10px 12px;
  font-size:14px;
  font-weight:600;
  margin-bottom:8px;
}
.alarm-item:last-child{margin-bottom:0;}

/* ---------- 阈值行 ---------- */
.thr-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
}
.thr-row:last-child{margin-bottom:0;}
.thr-row label{flex:1;font-size:14px;}
.thr-row input{
  width:80px;
  height:40px;
  border:1px solid var(--line);
  border-radius:6px;
  text-align:center;
  font-size:15px;
  color:var(--text);
  background:#fff;
}
.thr-row button{
  width:64px;
  height:48px;
  border:none;
  border-radius:8px;
  background:var(--primary);
  color:#fff;
  font-size:14px;
  font-weight:600;
}

/* ---------- 时间设置 ---------- */
.set-row{display:flex;align-items:center;gap:6px;margin-bottom:10px;}
.set-row label{font-size:13px;color:var(--sub);flex-shrink:0;}
.set-row input{
  flex:1;
  min-width:0;
  height:40px;
  border:1px solid var(--line);
  border-radius:6px;
  text-align:center;
  font-size:15px;
  color:var(--text);
  background:#fff;
}

/* ---------- 日志 ---------- */
.log-list{font-size:12px;font-family:Consolas,Menlo,monospace;color:var(--sub);min-height:55vh;}
.log-item{
  padding:6px 0;
  border-bottom:1px dashed #EEE;
  word-break:break-all;
  line-height:1.5;
}
.log-item:last-child{border-bottom:none;}
.log-time{color:#9E9E9E;margin-right:6px;}

/* ---------- 底部 Tab 栏 ---------- */
.tab-bar{
  display:flex;
  height:56px;
  background:#FFFFFF;
  border-top:1px solid var(--line);
  flex-shrink:0;
}
.tab-item{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  cursor:pointer;
  color:#666;
  font-size:15px;
  font-weight:500;
  user-select:none;
}
.tab-item.active{color:var(--primary);font-weight:600;}
.badge{
  display:none;
  position:absolute;
  top:10px;
  right:30%;
  min-width:16px;
  height:16px;
  padding:0 4px;
  border-radius:8px;
  background:var(--alarm);
  color:#fff;
  font-size:11px;
  line-height:16px;
  text-align:center;
}
.badge.show{display:block;}
</style>
</head>
<body>

<!-- ==================== 数据 Tab ==================== -->
<div class="tab-content active" id="tab-data">

  <div class="card connect-card">
    <h3>蓝牙连接</h3>
    <div class="bt-status-row">
      <span class="dot" id="btDot"></span>
      <span id="btStatus">未连接</span>
    </div>
    <select class="device-select" id="deviceList">
      <option value="">请先扫描设备</option>
    </select>
    <button class="btn" id="btnScan" onclick="scanDevices()">扫描设备</button>
    <button class="btn" id="btnConnect" onclick="connectSelected()">连接</button>
    <button class="btn danger" id="btnDisconnect" onclick="disconnectBt()" style="display:none">断开</button>
  </div>

  <div class="card needs-bt" id="cardTime">
    <h3>时间</h3>
    <div class="time-head">
      <div class="time-date" id="dateText">--</div>
      <span class="chip chip-week" id="weekText">--</span>
    </div>
    <div class="time-clock" id="timeText">--:--:--</div>
    <div class="time-chips">
      <span class="chip chip-blue" id="lunarText">--</span>
      <span class="chip chip-orange" id="zodiacText">--</span>
      <span class="chip chip-green" id="leapText">--</span>
    </div>
    <div class="hint">未连接设备</div>
  </div>

  <div class="card needs-bt" id="cardData">
    <h3>实时数据</h3>
    <div class="row">
      <span class="label">温度</span>
      <span class="value" id="vTemp">--<small>℃</small></span>
    </div>
    <div class="row">
      <span class="label">湿度</span>
      <span class="value" id="vHumi">--<small>%RH</small></span>
    </div>
    <div class="row">
      <span class="label">光照</span>
      <span class="value" id="vLux">--<small>lx</small></span>
    </div>
    <div class="hint">未连接设备</div>
  </div>

  <div class="card needs-bt" id="cardAlarm">
    <h3>报警状态</h3>
    <div id="alarmBox"><span class="alarm-off">—</span></div>
    <div class="hint">未连接设备</div>
  </div>

</div>

<!-- ==================== 控制 Tab ==================== -->
<div class="tab-content" id="tab-control">

  <div class="card needs-bt">
    <h3>报警开关</h3>
    <button class="btn" id="btnAlarm" onclick="toggleAlarm()">报警已开启</button>
    <div class="hint">未连接设备</div>
  </div>

  <div class="card needs-bt">
    <h3>当前阈值（设备回读）</h3>
    <div class="row row-sm">
      <span class="label">温度上限</span>
      <span class="rt-value" id="rtTemp">--</span>
    </div>
    <div class="row row-sm">
      <span class="label">湿度上限</span>
      <span class="rt-value" id="rtHumi">--</span>
    </div>
    <div class="row row-sm">
      <span class="label">光照下限</span>
      <span class="rt-value" id="rtLux">--</span>
    </div>
    <div class="sub" id="rtHint" style="margin-top:10px">等待设备数据…</div>
    <div class="hint">未连接设备</div>
  </div>

  <div class="card needs-bt">
    <h3>阈值设置</h3>
    <div class="thr-row">
      <label>温度上限 (℃)</label>
      <input type="number" id="inTemp" value="30" min="0" max="99">
      <button onclick="sendThreshold(1,'inTemp')">发送</button>
    </div>
    <div class="thr-row">
      <label>湿度上限 (%RH)</label>
      <input type="number" id="inHumi" value="70" min="0" max="99">
      <button onclick="sendThreshold(2,'inHumi')">发送</button>
    </div>
    <div class="thr-row">
      <label>光照下限 (lx)</label>
      <input type="number" id="inLux" value="300" min="0" max="10000">
      <button onclick="sendThreshold(3,'inLux')">发送</button>
    </div>
    <div class="sub" style="margin-top:8px">输入过程不会被回读数据覆盖</div>
    <div class="hint">未连接设备</div>
  </div>

  <div class="card needs-bt">
    <h3>时间设置</h3>
    <div class="set-row">
      <label>年</label><input type="number" id="inYear" min="2000" max="2099" value="2026">
      <label>月</label><input type="number" id="inMonth" min="1" max="12" value="10">
      <label>日</label><input type="number" id="inDay" min="1" max="31" value="20">
    </div>
    <div class="set-row">
      <label>时</label><input type="number" id="inHour" min="0" max="23" value="14">
      <label>分</label><input type="number" id="inMinute" min="0" max="59" value="30">
      <label>秒</label><input type="number" id="inSecond" min="0" max="59" value="25">
    </div>
    <button class="btn" onclick="sendSetTime()">下发设置时间</button>
    <button class="btn ghost" onclick="syncTime()">同步手机时间</button>
    <div class="sub" style="margin-top:8px">日期范围 2000~2099；下发后本页时间卡与设备 OLED 使用同一张农历表显示农历、生肖、闰年，可交叉校验</div>
    <div class="hint">未连接设备</div>
  </div>

</div>

<!-- ==================== 日志 Tab ==================== -->
<div class="tab-content" id="tab-log">
  <div class="card">
    <h3>通信日志</h3>
    <div class="log-list" id="logList">
      <div class="log-item"><span class="log-time">--:--:--</span>等待连接…</div>
    </div>
  </div>
</div>

<!-- ==================== 底部 Tab 栏 ==================== -->
<div class="tab-bar">
  <div class="tab-item active" data-tab="data">数据<span class="badge" id="alarmBadge"></span></div>
  <div class="tab-item" data-tab="control">控制</div>
  <div class="tab-item" data-tab="log">日志</div>
</div>

<script>
/* ================================================================
 * 全局状态
 * ================================================================ */
var isBtConnected = false;

var state = {
  year:0, month:0, day:0, hour:0, minute:0, second:0,
  temp:0, humi:0, lux:0,
  alarmEnable:1, tempThr:30, humiThr:70, luxThr:300,
  hasData:false
};

/* 阈值/开关"预测-同步-接管"状态：等待下位机上报确认期间冻结本地值 */
var waiting = { temp:false, humi:false, lux:false, alarm:false };
var waitTimers = { temp:null, humi:null, lux:null, alarm:null };

/* 设备最近一次上报的真实值：等待超时后回退到这里 */
var reported = { tempThr:30, humiThr:70, luxThr:300, alarmEnable:1 };

/* ================================================================
 * Tab 切换
 * ================================================================ */
document.querySelectorAll('.tab-item').forEach(function(item){
  item.addEventListener('click', function(){
    var tab = item.dataset.tab;
    document.querySelectorAll('.tab-item').forEach(function(i){ i.classList.remove('active'); });
    item.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(function(c){ c.classList.remove('active'); });
    document.getElementById('tab-' + tab).classList.add('active');
  });
});

/* ================================================================
 * 日志
 * ================================================================ */
function addLog(text){
  var list = document.getElementById('logList');
  var d = new Date();
  var hh = String(d.getHours()).padStart(2,'0');
  var mm = String(d.getMinutes()).padStart(2,'0');
  var ss = String(d.getSeconds()).padStart(2,'0');
  var el = document.createElement('div');
  el.className = 'log-item';
  el.innerHTML = '<span class="log-time">' + hh + ':' + mm + ':' + ss + '</span>' +
                 text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  list.insertBefore(el, list.firstChild);
  while (list.children.length > 20) {
    list.removeChild(list.lastChild);
  }
}

/* ================================================================
 * 蓝牙控制
 * ================================================================ */
function scanDevices(){
  if (window.BluetoothBridge) {
    window.BluetoothBridge.getPairedDevices();
  } else {
    alert('请在 Android WebView 环境中运行');
  }
}

function connectSelected(){
  var addr = document.getElementById('deviceList').value;
  if (!addr) {
    alert('请先选择设备');
    return;
  }
  window.BluetoothBridge.connect(addr);
}

function disconnectBt(){
  if (window.BluetoothBridge) window.BluetoothBridge.disconnect();
}

function sendViaBt(cmd){
  if (!isBtConnected) {
    alert('蓝牙未连接，请先连接设备');
    return false;
  }
  window.BluetoothBridge.send(cmd + '\n');
  addLog('→ ' + cmd);
  return true;
}

/* ================================================================
 * 蓝牙回调（Android 调用）
 * ================================================================ */
window.onBtDeviceList = function(deviceArray){
  var select = document.getElementById('deviceList');
  select.innerHTML = '';

  if (!deviceArray || !deviceArray.length) {
    var opt = document.createElement('option');
    opt.value = '';
    opt.textContent = '未找到已配对设备，请先在系统蓝牙设置里配对 JDY-31';
    select.appendChild(opt);
    addLog('扫描完成：没有已配对设备');
    return;
  }

  deviceArray.forEach(function(d){
    var o = document.createElement('option');
    o.value = d.address;
    o.textContent = d.name + ' (' + d.address + ')';
    select.appendChild(o);
  });
  addLog('扫描到 ' + deviceArray.length + ' 个设备');
};

window.onBtConnected = function(address){
  isBtConnected = true;
  document.body.classList.remove('bt-off');
  document.getElementById('btDot').className = 'dot on';
  document.getElementById('btStatus').textContent = '已连接：' + address;
  document.getElementById('btnScan').style.display = 'none';
  document.getElementById('deviceList').disabled = true;
  document.getElementById('btnConnect').style.display = 'none';
  document.getElementById('btnDisconnect').style.display = 'block';
  addLog('已连接：' + address);
};

window.onBtDisconnected = function(){
  isBtConnected = false;
  state.hasData = false;
  waiting = { temp:false, humi:false, lux:false, alarm:false };
  document.body.classList.add('bt-off');
  document.getElementById('btDot').className = 'dot off';
  document.getElementById('btStatus').textContent = '未连接';
  document.getElementById('btnScan').style.display = 'block';
  document.getElementById('deviceList').disabled = false;
  document.getElementById('btnConnect').style.display = 'block';
  document.getElementById('btnDisconnect').style.display = 'none';
  document.getElementById('dateText').textContent = '--';
  document.getElementById('timeText').textContent = '--:--:--';
  document.getElementById('weekText').textContent = '--';
  document.getElementById('lunarText').textContent = '--';
  document.getElementById('zodiacText').textContent = '--';
  document.getElementById('leapText').textContent = '--';
  document.getElementById('vTemp').innerHTML = '--<small>℃</small>';
  document.getElementById('vHumi').innerHTML = '--<small>%RH</small>';
  document.getElementById('vLux').innerHTML = '--<small>lx</small>';
  document.getElementById('alarmBox').innerHTML = '<span class="alarm-off">—</span>';
  document.getElementById('rtTemp').textContent = '--';
  document.getElementById('rtHumi').textContent = '--';
  document.getElementById('rtLux').textContent = '--';
  document.getElementById('rtHint').textContent = '等待设备数据…';
  document.getElementById('rtHint').style.color = '';
  updateAlarmBadge(0);
  addLog('连接已断开');
};

window.onBtError = function(errMsg){
  addLog('蓝牙错误：' + errMsg);
  alert('蓝牙错误：' + errMsg);
  window.onBtDisconnected();
};

window.onBtData = function(line){
  line = (line || '').trim();
  if (!line) return;
  addLog('← ' + line);
  parseAndUpdate(line);
};

/* ================================================================
 * 数据解析：年,月,日,时,分,秒,温度,湿度,光照,报警开关,温度阈值,湿度阈值,光照阈值
 * ================================================================ */
function parseAndUpdate(message){
  var p = message.split(',');
  if (p.length < 13) return;

  var d = {
    year:+p[0], month:+p[1], day:+p[2],
    hour:+p[3], minute:+p[4], second:+p[5],
    temp:parseFloat(p[6]) || 0,
    humi:parseInt(p[7], 10) || 0,
    lux:parseInt(p[8], 10) || 0,
    alarmEnable:parseInt(p[9], 10) ? 1 : 0,
    tempThr:parseInt(p[10], 10) || 0,
    humiThr:parseInt(p[11], 10) || 0,
    luxThr:parseInt(p[12], 10) || 0
  };

  /* 传感器与时间始终实时更新 */
  state.year = d.year; state.month = d.month; state.day = d.day;
  state.hour = d.hour; state.minute = d.minute; state.second = d.second;
  state.temp = d.temp; state.humi = d.humi; state.lux = d.lux;
  state.hasData = true;

  /* 设备真实值始终记录，供超时回退 */
  reported.tempThr = d.tempThr;
  reported.humiThr = d.humiThr;
  reported.luxThr  = d.luxThr;
  reported.alarmEnable = d.alarmEnable;

  /* 阈值/开关：等待确认期间保持本地预测值，确认后由设备接管 */
  if (waiting.temp && d.tempThr === state.tempThr) { waiting.temp = false; clearWait('temp'); }
  if (waiting.humi && d.humiThr === state.humiThr) { waiting.humi = false; clearWait('humi'); }
  if (waiting.lux  && d.luxThr  === state.luxThr ) { waiting.lux  = false; clearWait('lux');  }
  if (waiting.alarm && d.alarmEnable === state.alarmEnable) { waiting.alarm = false; clearWait('alarm'); }

  if (!waiting.temp) state.tempThr = d.tempThr;
  if (!waiting.humi) state.humiThr = d.humiThr;
  if (!waiting.lux)  state.luxThr  = d.luxThr;
  if (!waiting.alarm) state.alarmEnable = d.alarmEnable;

  updateUI();

  if (!waiting.temp && !waiting.humi && !waiting.lux && !waiting.alarm) {
    checkAlarms();
  }
}

function clearWait(key){
  if (waitTimers[key]) {
    clearTimeout(waitTimers[key]);
    waitTimers[key] = null;
  }
}

/* ================================================================
 * UI 刷新
 * ================================================================ */
function pad2(n){ return String(n).padStart(2, '0'); }

function updateUI(){
  /* 时间 */
  if (state.month >= 1 && state.month <= 12) {
    var lun = solarToLunar(state.year, state.month, state.day);
    document.getElementById('dateText').textContent =
      state.year + '-' + pad2(state.month) + '-' + pad2(state.day);
    document.getElementById('timeText').textContent =
      pad2(state.hour) + ':' + pad2(state.minute) + ':' + pad2(state.second);
    document.getElementById('weekText').textContent = '星期' + weekName(state.year, state.month, state.day);
    document.getElementById('lunarText').textContent = lun ? lunarDateText(lun) : '农历 --';
    document.getElementById('zodiacText').textContent = lun ? zodiacOf(lun.year) + '年' : '生肖 --';
    document.getElementById('leapText').textContent = isLeapSolarYear(state.year) ? '闰年' : '平年';
  } else {
    document.getElementById('dateText').textContent = '时间未同步';
    document.getElementById('timeText').textContent = '--:--:--';
    document.getElementById('weekText').textContent = '--';
    document.getElementById('lunarText').textContent = '农历 --';
    document.getElementById('zodiacText').textContent = '生肖 --';
    document.getElementById('leapText').textContent = '--';
  }

  /* 传感器 */
  var vTemp = document.getElementById('vTemp');
  var vHumi = document.getElementById('vHumi');
  var vLux  = document.getElementById('vLux');

  vTemp.innerHTML = state.temp.toFixed(1) + '<small>℃</small>';
  vHumi.innerHTML = Math.round(state.humi) + '<small>%RH</small>';
  vLux.innerHTML  = Math.round(state.lux) + '<small>lx</small>';

  vTemp.classList.toggle('red', state.alarmEnable === 1 && state.temp > state.tempThr);
  vHumi.classList.toggle('red', state.alarmEnable === 1 && state.humi > state.humiThr);
  vLux.classList.toggle('red',  state.alarmEnable === 1 && state.lux  < state.luxThr);

  /* 报警开关按钮 */
  var btn = document.getElementById('btnAlarm');
  btn.textContent = state.alarmEnable ? '报警已开启（点击关闭）' : '报警已关闭（点击开启）';
  btn.className = state.alarmEnable ? 'btn' : 'btn ghost';

  /* 阈值回读区（只显示，不回填输入框） */
  document.getElementById('rtTemp').innerHTML = state.tempThr + '<span class="rt-unit">℃</span>';
  document.getElementById('rtHumi').innerHTML = state.humiThr + '<span class="rt-unit">%RH</span>';
  document.getElementById('rtLux').innerHTML  = state.luxThr  + '<span class="rt-unit">lx</span>';

  var hint = document.getElementById('rtHint');
  if (waiting.temp || waiting.humi || waiting.lux) {
    hint.textContent = '已下发，等待设备确认…';
    hint.style.color = '#FF9800';
  } else {
    hint.textContent = state.hasData ? '设备回读 · 每 500ms 刷新' : '等待设备数据…';
    hint.style.color = '';
  }
}

function weekName(y, m, d){
  if (m < 1 || m > 12) return '—';
  var t = [0,3,2,5,0,3,5,1,4,6,2,4];
  var yy = y;
  if (m < 3) yy -= 1;
  var w = (yy + Math.floor(yy/4) - Math.floor(yy/100) + Math.floor(yy/400) + t[m-1] + d) % 7;
  /* 0=周日 */
  return ['日','一','二','三','四','五','六'][w];
}

/* ================================================================
 * 公历转农历 + 生肖 + 闰年（前端本地计算，无新增通信字段）
 * 与固件 app_lunar.c 使用同一张 1900~2099 农历数据表，算法一致：
 *   LUNAR_INFO[y-1900] bit0~3  : 闰月月份，0 = 当年无闰月
 *                      bit4~15 : 12 个月大小月（bit15=正月，1=30 天）
 *                      bit16   : 闰月天数，1=30 天 0=29 天
 *   基准点：公历 1900-01-31 = 农历 1900 年正月初一
 * ================================================================ */
var LUNAR_INFO = [
    0x04BD8, 0x04AE0, 0x0A570, 0x054D5, 0x0D260, 0x0D950, 0x16554, 0x056A0, 0x09AD0, 0x055D2, /* 1900-1909 */
    0x04AE0, 0x0A5B6, 0x0A4D0, 0x0D250, 0x1D255, 0x0B540, 0x0D6A0, 0x0ADA2, 0x095B0, 0x14977, /* 1910-1919 */
    0x04970, 0x0A4B0, 0x0B4B5, 0x06A50, 0x06D40, 0x1AB54, 0x02B60, 0x09570, 0x052F2, 0x04970, /* 1920-1929 */
    0x06566, 0x0D4A0, 0x0EA50, 0x06E95, 0x05AD0, 0x02B60, 0x186E3, 0x092E0, 0x1C8D7, 0x0C950, /* 1930-1939 */
    0x0D4A0, 0x1D8A6, 0x0B550, 0x056A0, 0x1A5B4, 0x025D0, 0x092D0, 0x0D2B2, 0x0A950, 0x0B557, /* 1940-1949 */
    0x06CA0, 0x0B550, 0x15355, 0x04DA0, 0x0A5B0, 0x14573, 0x052B0, 0x0A9A8, 0x0E950, 0x06AA0, /* 1950-1959 */
    0x0AEA6, 0x0AB50, 0x04B60, 0x0AAE4, 0x0A570, 0x05260, 0x0F263, 0x0D950, 0x05B57, 0x056A0, /* 1960-1969 */
    0x096D0, 0x04DD5, 0x04AD0, 0x0A4D0, 0x0D4D4, 0x0D250, 0x0D558, 0x0B540, 0x0B6A0, 0x195A6, /* 1970-1979 */
    0x095B0, 0x049B0, 0x0A974, 0x0A4B0, 0x0B27A, 0x06A50, 0x06D40, 0x0AF46, 0x0AB60, 0x09570, /* 1980-1989 */
    0x04AF5, 0x04970, 0x064B0, 0x074A3, 0x0EA50, 0x06B58, 0x055C0, 0x0AB60, 0x096D5, 0x092E0, /* 1990-1999 */
    0x0C960, 0x0D954, 0x0D4A0, 0x0DA50, 0x07552, 0x056A0, 0x0ABB7, 0x025D0, 0x092D0, 0x0CAB5, /* 2000-2009 */
    0x0A950, 0x0B4A0, 0x0BAA4, 0x0AD50, 0x055D9, 0x04BA0, 0x0A5B0, 0x15176, 0x052B0, 0x0A930, /* 2010-2019 */
    0x07954, 0x06AA0, 0x0AD50, 0x05B52, 0x04B60, 0x0A6E6, 0x0A4E0, 0x0D260, 0x0EA65, 0x0D530, /* 2020-2029 */
    0x05AA0, 0x076A3, 0x096D0, 0x04AFB, 0x04AD0, 0x0A4D0, 0x1D0B6, 0x0D250, 0x0D520, 0x0DD45, /* 2030-2039 */
    0x0B5A0, 0x056D0, 0x055B2, 0x049B0, 0x0A577, 0x0A4B0, 0x0AA50, 0x1B255, 0x06D20, 0x0ADA0, /* 2040-2049 */
    0x14B63, 0x09370, 0x049F8, 0x04970, 0x064B0, 0x168A6, 0x0EA50, 0x06B20, 0x1A6C4, 0x0AAE0, /* 2050-2059 */
    0x0A2E0, 0x0D2E3, 0x0C960, 0x0D557, 0x0D4A0, 0x0DA50, 0x05D55, 0x056A0, 0x0A6D0, 0x055D4, /* 2060-2069 */
    0x052D0, 0x0A9B8, 0x0A950, 0x0B4A0, 0x0B6A6, 0x0AD50, 0x055A0, 0x0ABA4, 0x0A5B0, 0x052B0, /* 2070-2079 */
    0x0B273, 0x06930, 0x07337, 0x06AA0, 0x0AD50, 0x14B55, 0x04B60, 0x0A570, 0x054E4, 0x0D160, /* 2080-2089 */
    0x0E968, 0x0D520, 0x0DAA0, 0x16AA6, 0x056D0, 0x04AE0, 0x0A9D4, 0x0A2D0, 0x0D150, 0x0F252 /* 2090-2099 */
];
var ZODIAC_CN = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
var LUNAR_MONTH_CN = ['正','二','三','四','五','六','七','八','九','十','冬','腊'];
var LUNAR_DAY_CN = [
  '初一','初二','初三','初四','初五','初六','初七','初八','初九','初十',
  '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
  '廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'
];

function isLeapSolarYear(y){
  return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
}

function lunarLeapMonth(y){ return LUNAR_INFO[y - 1900] & 0xF; }

function lunarLeapDays(y){
  return lunarLeapMonth(y) === 0 ? 0 : ((LUNAR_INFO[y - 1900] & 0x10000) ? 30 : 29);
}

function lunarMonthDays(y, m){
  return (LUNAR_INFO[y - 1900] & (0x10000 >>> m)) ? 30 : 29;
}

function lunarYearDays(y){
  var sum = 348;
  for (var m = 1; m <= 12; m++) {
    if (LUNAR_INFO[y - 1900] & (0x10000 >>> m)) sum++;
  }
  return sum + lunarLeapDays(y);
}

function solarDayIndex(y, m, d){
  var md = [31,28,31,30,31,30,31,31,30,31,30,31];
  var s = 0, i;
  for (i = 1900; i < y; i++) s += isLeapSolarYear(i) ? 366 : 365;
  for (i = 1; i < m; i++) {
    s += md[i - 1];
    if (i === 2 && isLeapSolarYear(y)) s++;
  }
  return s + d - 1;
}

/* 公历转农历，越界返回 null，否则 { year, month, day, isLeap } */
function solarToLunar(sy, sm, sd){
  if (sy < 1900 || sy > 2099 || sm < 1 || sm > 12 || sd < 1 || sd > 31) return null;
  var offset = solarDayIndex(sy, sm, sd) - solarDayIndex(1900, 1, 31);
  var ly = 1900, lm, m, d;
  while (ly < 2099) {
    var yd = lunarYearDays(ly);
    if (offset < yd) break;
    offset -= yd;
    ly++;
  }
  lm = lunarLeapMonth(ly);
  for (m = 1; m <= 12; m++) {
    d = lunarMonthDays(ly, m);
    if (offset >= d) {
      offset -= d;
      if (lm === m) {
        var ld = lunarLeapDays(ly);
        if (offset < ld) return { year: ly, month: m, day: offset + 1, isLeap: 1 };
        offset -= ld;
      }
      continue;
    }
    break;
  }
  return { year: ly, month: m, day: offset + 1, isLeap: 0 };
}

/* 农历年对应生肖，如 2026 -> '马'（1900=鼠年） */
function zodiacOf(lunarYear){
  if (lunarYear < 1900 || lunarYear > 2099) return '--';
  return ZODIAC_CN[(lunarYear - 4) % 12];
}

/* 农历日期文本，如 '农历 闰二月初一'（生肖/闰年由时间卡单独成标签显示） */
function lunarDateText(lun){
  var dayCN = LUNAR_DAY_CN[lun.day - 1] || '--';
  return '农历 ' + (lun.isLeap ? '闰' : '') + LUNAR_MONTH_CN[lun.month - 1] + '月' + dayCN;
}

/* ================================================================
 * 报警判断（全在 APP 端，对照字段 7-9 与 11-13，受字段 10 控制）
 * ================================================================ */
function checkAlarms(){
  var box = document.getElementById('alarmBox');
  var items = [];

  if (!state.hasData) {
    box.innerHTML = '<span class="alarm-off">等待数据…</span>';
    updateAlarmBadge(0);
    return;
  }

  if (state.alarmEnable) {
    if (state.temp > state.tempThr) {
      items.push('温度超限：' + state.temp.toFixed(1) + '℃ > ' + state.tempThr + '℃');
    }
    if (state.humi > state.humiThr) {
      items.push('湿度超限：' + Math.round(state.humi) + '%RH > ' + state.humiThr + '%RH');
    }
    if (state.lux < state.luxThr) {
      items.push('光照不足：' + Math.round(state.lux) + 'lx < ' + state.luxThr + 'lx');
    }
  }

  if (!state.alarmEnable) {
    box.innerHTML = '<span class="alarm-off">报警已关闭</span>';
    updateAlarmBadge(0);
  } else if (!items.length) {
    box.innerHTML = '<span class="alarm-ok">运行正常</span>';
    updateAlarmBadge(0);
  } else {
    box.innerHTML = items.map(function(t){
      return '<div class="alarm-item">' + t + '</div>';
    }).join('');
    updateAlarmBadge(items.length);
  }
}

function updateAlarmBadge(count){
  var badge = document.getElementById('alarmBadge');
  if (count > 0) {
    badge.textContent = count;
    badge.classList.add('show');
  } else {
    badge.classList.remove('show');
  }
}

/* ================================================================
 * 下行指令
 * ================================================================ */
function sendThreshold(code, inputId){
  var el = document.getElementById(inputId);
  var v = parseInt(el.value, 10);

  if (isNaN(v)) { alert('请输入有效数值'); return; }

  var max = (code === 3) ? 10000 : 99;
  if (v < 0 || v > max) {
    alert('取值范围 0 ~ ' + max);
    return;
  }

  if (!sendViaBt(code + ',' + v)) return;

  /* 预测：立即生效并冻结，等设备上报确认后接管 */
  if (code === 1) { state.tempThr = v; startWait('temp'); }
  if (code === 2) { state.humiThr = v; startWait('humi'); }
  if (code === 3) { state.luxThr  = v; startWait('lux');  }

  updateUI();
  checkAlarms();
}

function toggleAlarm(){
  var next = state.alarmEnable ? 0 : 1;
  if (!sendViaBt('04,' + next)) return;

  state.alarmEnable = next;
  startWait('alarm');

  updateUI();
  checkAlarms();
}

/* ================================================================
 * 时间下发（05）：手动设置 / 同步手机时间
 * ================================================================ */
function daysInMonth(y, m){
  if (m === 2) {
    return ((y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0)) ? 29 : 28;
  }
  var md = [0,31,28,31,30,31,30,31,31,30,31,30,31];
  return md[m] || 31;
}

function inputVal(id){
  return parseInt(document.getElementById(id).value, 10);
}

/* 校验后发送 05,年,月,日,时,分,秒，并乐观刷新界面时间 */
function sendTime6(y, mo, d, h, mi, s){
  if (y < 2000 || y > 2099) { alert('年份范围 2000~2099'); return; }
  if (mo < 1 || mo > 12)    { alert('月份范围 1~12'); return; }
  if (d < 1 || d > daysInMonth(y, mo)) {
    alert('该月日期范围 1~' + daysInMonth(y, mo));
    return;
  }
  if (h < 0 || h > 23 || mi < 0 || mi > 59 || s < 0 || s > 59) {
    alert('时分秒超出范围');
    return;
  }

  if (!sendViaBt('05,' + y + ',' + mo + ',' + d + ',' + h + ',' + mi + ',' + s)) return;

  /* 乐观刷新：界面立即显示下发的时间，设备回读后接管 */
  state.year = y; state.month = mo; state.day = d;
  state.hour = h; state.minute = mi; state.second = s;
  updateUI();
}

/* 手动填写的时间 */
function sendSetTime(){
  var y  = inputVal('inYear');
  var mo = inputVal('inMonth');
  var d  = inputVal('inDay');
  var h  = inputVal('inHour');
  var mi = inputVal('inMinute');
  var s  = inputVal('inSecond');

  if (isNaN(y) || isNaN(mo) || isNaN(d) || isNaN(h) || isNaN(mi) || isNaN(s)) {
    alert('请填写完整的时间');
    return;
  }
  sendTime6(y, mo, d, h, mi, s);
}

/* 手机当前真实时间 */
function syncTime(){
  var d = new Date();
  sendTime6(d.getFullYear(), d.getMonth() + 1, d.getDate(),
            d.getHours(), d.getMinutes(), d.getSeconds());
}

/* 等待设备确认，最多 4 秒；超时回退到设备最近一次上报值 */
function startWait(key){
  clearWait(key);
  waiting[key] = true;
  waitTimers[key] = setTimeout(function(){
    waiting[key] = false;
    waitTimers[key] = null;

    /* 回退：设备没确认就以下位机真实值为准 */
    if (key === 'temp')  state.tempThr = reported.tempThr;
    if (key === 'humi')  state.humiThr = reported.humiThr;
    if (key === 'lux')   state.luxThr  = reported.luxThr;
    if (key === 'alarm') state.alarmEnable = reported.alarmEnable;

    updateUI();
    checkAlarms();
  }, 4000);
}

/* ================================================================
 * 初始化
 * ================================================================ */
document.body.classList.add('bt-off');

/* 时间输入框默认填手机当前时间；之后不再被设备回读覆盖 */
(function initTimeInputs(){
