<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>坐姿台灯-MQTT联调测试</title>
<script src="mqtt.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #F5F5F5; --card: #FFFFFF; --primary: #2196F3; --alarm: #F44336;
  --ok: #4CAF50; --text: #212121; --sub: #757575;
  --shadow: 0 2px 8px rgba(0,0,0,0.08); --radius: 12px;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg); color: var(--text);
  padding: 12px; padding-top: 56px; max-width: 420px; margin: 0 auto;
}
.topbar {
  position: fixed; top: 0; left: 0; right: 0; background: var(--primary);
  color: white; padding: 14px 16px; font-size: 18px; font-weight: bold;
  text-align: center; z-index: 100;
}
.card {
  background: var(--card); border-radius: var(--radius); padding: 16px;
  margin-bottom: 12px; box-shadow: var(--shadow);
}
.card h3 {
  font-size: 15px; color: var(--sub); margin-bottom: 12px;
  border-bottom: 1px solid #eee; padding-bottom: 8px;
}
.connect-card { border-left: 4px solid #9C27B0; }
.bt-status-row { margin: 10px 0; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.status-label { color: var(--sub); }
.status-text { font-weight: bold; }
.status-connected { color: var(--ok); }
.status-disconnected { color: var(--alarm); }
.status-bar { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--alarm); }
.status-dot.connected { background: var(--ok); }
.data-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 0; border-bottom: 1px solid #f0f0f0;
}
.data-row:last-child { border-bottom: none; }
.data-label { font-size: 14px; color: var(--sub); }
.data-value { font-size: 28px; font-weight: bold; }
.data-unit { font-size: 13px; color: var(--sub); margin-left: 4px; }
.data-value.alarm { color: var(--alarm); }
.alarm-ok { color: var(--ok); font-size: 15px; font-weight: bold; }
.alarm-item {
  background: #FFEBEE; color: var(--alarm); padding: 10px 12px;
  border-radius: 8px; margin-bottom: 6px; font-size: 14px; font-weight: bold;
}
.alarm-item:last-child { margin-bottom: 0; }
.ctrl-btn {
  width: 100%; height: 48px; margin-bottom: 8px; border-radius: 8px;
  border: none; background: var(--primary); color: white;
  font-size: 15px; font-weight: bold; cursor: pointer;
}
.ctrl-btn:active { opacity: 0.7; }
.ctrl-btn:last-child { margin-bottom: 0; }
.ctrl-btn.muted { background: var(--ok); }
.thr-display-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0; border-bottom: 1px solid #f0f0f0;
}
.thr-display-row:last-child { border-bottom: none; }
.thr-label { font-size: 14px; color: var(--sub); }
.thr-value { font-size: 18px; font-weight: bold; }
.thr-set-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; }
.thr-set-row label { font-size: 14px; flex: 1; }
.thr-input {
  width: 80px; padding: 8px; border-radius: 6px; border: 1px solid #ddd;
  font-size: 14px; text-align: center;
}
.thr-send-btn {
  padding: 8px 16px; border-radius: 6px; border: none;
  background: var(--primary); color: white; font-size: 14px;
  cursor: pointer; height: 40px;
}
.thr-send-btn:active { opacity: 0.7; }
.log-entry {
  font-size: 12px; font-family: monospace; padding: 4px 0;
  border-bottom: 1px solid #f5f5f5; color: var(--sub);
  word-break: break-all;
}
.mode-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 13px; font-weight: bold; }
.mode-auto { background: #E3F2FD; color: #1565C0; }
.mode-manual { background: #FFF3E0; color: #E65100; }
</style>
</head>
<body>

<div class="topbar">坐姿台灯 · MQTT联调测试</div>

<!-- MQTT 连接卡 -->
<div class="card connect-card" id="connectCard">
  <h3>MQTT 连接</h3>
  <div class="bt-status-row">
    <span class="status-label">状态：</span>
    <span id="mqttStatus" class="status-text status-disconnected">未连接</span>
  </div>
  <div class="bt-status-row">
    <span class="status-label">最近上行：</span>
    <span id="lastUpTime" class="status-text">--</span>
  </div>
</div>

<!-- 状态栏 -->
<div class="card">
  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">未连接</span>
    <span id="modeBadge" class="mode-badge mode-auto" style="display:none">AUTO</span>
  </div>
</div>

<!-- 实时数据卡 -->
<div class="card">
  <h3>实时数据</h3>
  <div class="data-row">
    <span class="data-label">光照</span>
    <div><span class="data-value" id="light">--</span><span class="data-unit">%</span></div>
  </div>
  <div class="data-row">
    <span class="data-label">距离</span>
    <div><span class="data-value" id="dist">--</span><span class="data-unit">cm</span></div>
  </div>
  <div class="data-row">
    <span class="data-label">亮度</span>
    <div><span class="data-value" id="brightness">--</span><span class="data-unit">%</span></div>
  </div>
</div>

<!-- 报警状态卡 -->
<div class="card" id="alarmCard">
  <h3>报警状态</h3>
  <div id="alarmContent"><span class="alarm-ok">运行正常 &#x2713;</span></div>
</div>

<!-- 控制卡 -->
<div class="card">
  <h3>控制</h3>
  <button class="ctrl-btn" onclick="sendCmd('06')">切换 AUTO 模式</button>
  <button class="ctrl-btn" onclick="sendCmd('07')">切换 MANUAL 模式</button>
  <button class="ctrl-btn muted" onclick="sendCmd('01')">消警</button>
</div>

<!-- 阈值显示卡 -->
<div class="card" id="thrDisplayCard">
  <h3>当前阈值</h3>
  <div class="thr-display-row">
    <span class="thr-label">目标光照</span>
    <span class="thr-value" id="target_display">-- %</span>
  </div>
  <div class="thr-display-row">
    <span class="thr-label">距离阈值</span>
    <span class="thr-value" id="dist_threshold_display">-- cm</span>
  </div>
  <div class="thr-display-row">
    <span class="thr-label">亮度上限</span>
    <span class="thr-value" id="brightness_limit_display">-- %</span>
  </div>
</div>

<!-- 阈值设置卡 -->
<div class="card" id="thrSetCard">
  <h3>阈值设置</h3>
  <div class="thr-set-row">
    <label>目标光照 (%)</label>
    <input type="number" id="target_input" class="thr-input" min="0" max="100">
    <button class="thr-send-btn" onclick="setThreshold('target','02')">发送</button>
  </div>
  <div class="thr-set-row">
    <label>距离阈值 (cm)</label>
    <input type="number" id="dist_threshold_input" class="thr-input" min="0" max="200">
    <button class="thr-send-btn" onclick="setThreshold('dist_threshold','03')">发送</button>
  </div>
  <div class="thr-set-row">
    <label>亮度上限 (%)</label>
    <input type="number" id="brightness_limit_input" class="thr-input" min="0" max="100">
    <button class="thr-send-btn" onclick="setThreshold('brightness_limit','04')">发送</button>
  </div>
</div>

<!-- 日志卡（默认展开） -->
<div class="card">
  <h3>日志（最近 30 条）</h3>
  <div id="logContent" style="max-height:300px;overflow-y:auto;"></div>
</div>

<script>
// ==================== MQTT 配置（测试固定值） ====================
const MQTT_URL  = 'wss://broker.emqx.io:8084/mqtt';
const UPLOAD_TOPIC = '001/025/posturelamp/upload';
const CMD_TOPIC    = '001/025/posturelamp/cmd';

let isBtConnected = false;   // 语义沿用：收到上行数据即视为"已连接"
let currentData = {
  light: null, dist: null, brightness: null, mode: null,
  target: null, dist_threshold: null, brightness_limit: null
};
let logEntries = [];

// ==================== 同步保护状态 ====================
let waitingSync = { target: false, dist_threshold: false, brightness_limit: false };
let pendingValue = { target: null, dist_threshold: null, brightness_limit: null };
let syncTimeoutTimer = { target: null, dist_threshold: null, brightness_limit: null };
let lastUserSetTime = { target: 0, dist_threshold: 0, brightness_limit: 0 };
const DEBOUNCE_MS = 500;
const SYNC_TIMEOUT_MS = 5000;

// ==================== MQTT 连接 ====================
const client = mqtt.connect(MQTT_URL, {
  clientId: 'webview_test_' + Math.random().toString(36).substr(2, 6),
  reconnectPeriod: 3000
});

client.on('connect', function () {
  client.subscribe(UPLOAD_TOPIC);
  addLog('MQTT 已连接，已订阅 ' + UPLOAD_TOPIC);
  document.getElementById('mqttStatus').textContent = '已连接（WSS 8084）';
  document.getElementById('mqttStatus').className = 'status-text status-connected';
});

client.on('reconnect', function () { addLog('MQTT 重连中...'); });

client.on('close', function () {
  document.getElementById('mqttStatus').textContent = '连接断开，重连中';
  document.getElementById('mqttStatus').className = 'status-text status-disconnected';
});

client.on('error', function (err) { addLog('MQTT 错误: ' + err.message); });

client.on('message', function (topic, payload) {
  const line = payload.toString().trim();
  document.getElementById('lastUpTime').textContent = new Date().toLocaleTimeString();
  parseAndUpdate(line);
});

// ==================== 下行指令 ====================
function sendCmd(cmd) {
  client.publish(CMD_TOPIC, cmd);
  addLog('发送: ' + cmd + ' → ' + CMD_TOPIC);
}

// ==================== 数据解析 ====================
function parseAndUpdate(message) {
  const parts = message.split(',');
  if (parts.length < 7) { addLog('数据格式异常(' + parts.length + '字段): ' + message); return; }

  const newData = {
    light: parseFloat(parts[0]) || 0,
    dist: parseFloat(parts[1]) || 0,
    brightness: parseFloat(parts[2]) || 0,
    mode: parts[3],
    target: parseFloat(parts[4]) || 0,
    dist_threshold: parseFloat(parts[5]) || 0,
    brightness_limit: parseFloat(parts[6]) || 0
  };

  currentData.light = newData.light;
  currentData.dist = newData.dist;
  currentData.brightness = newData.brightness;
  currentData.mode = newData.mode;

  let hasPendingSync = false;
  const syncKeys = ['target', 'dist_threshold', 'brightness_limit'];
  for (const key of syncKeys) {
    if (waitingSync[key]) {
      hasPendingSync = true;
      const expected = pendingValue[key];
      const received = newData[key];
      if (expected !== null && Math.abs(received - expected) < 0.5) {
        if (syncTimeoutTimer[key]) { clearTimeout(syncTimeoutTimer[key]); syncTimeoutTimer[key] = null; }
        waitingSync[key] = false;
        pendingValue[key] = null;
        lastUserSetTime[key] = 0;
        addLog('同步确认: ' + key + ' = ' + received);
      }
    }
  }

  const now = Date.now();
  for (const key of syncKeys) {
    if (!lastUserSetTime[key] || (now - lastUserSetTime[key]) >= DEBOUNCE_MS) {
      if (!waitingSync[key]) currentData[key] = newData[key];
    }
  }

  updateUI();

  if (hasPendingSync) checkAlarmsWithPending();
  else checkAlarms();

  isBtConnected = true;
  document.getElementById('statusDot').classList.add('connected');
  document.getElementById('statusText').textContent = '数据流正常';
  addLog('收到: ' + message);
}

// ==================== UI 更新 ====================
function updateUI() {
  if (currentData.light !== null) document.getElementById('light').textContent = currentData.light;
  if (currentData.dist !== null) {
    const distEl = document.getElementById('dist');
    distEl.textContent = currentData.dist;
    if (currentData.dist_threshold !== null && currentData.dist < currentData.dist_threshold) distEl.classList.add('alarm');
    else distEl.classList.remove('alarm');
  }
  if (currentData.brightness !== null) document.getElementById('brightness').textContent = currentData.brightness;

  const badge = document.getElementById('modeBadge');
  if (currentData.mode) {
    badge.style.display = 'inline-block';
    badge.textContent = currentData.mode;
    badge.className = 'mode-badge ' + (currentData.mode === 'AUTO' ? 'mode-auto' : 'mode-manual');
  }

  const targetVal = waitingSync.target ? pendingValue.target : currentData.target;
  const distThrVal = waitingSync.dist_threshold ? pendingValue.dist_threshold : currentData.dist_threshold;
  const brightLimVal = waitingSync.brightness_limit ? pendingValue.brightness_limit : currentData.brightness_limit;

  if (targetVal !== null) document.getElementById('target_display').textContent = targetVal + ' %';
  if (distThrVal !== null) document.getElementById('dist_threshold_display').textContent = distThrVal + ' cm';
  if (brightLimVal !== null) document.getElementById('brightness_limit_display').textContent = brightLimVal + ' %';
}

// ==================== 阈值设置（带同步保护） ====================
function setThreshold(type, cmdCode) {
  const inputId = type + '_input';
  const value = document.getElementById(inputId).value;
  if (!value || value === '') { alert('请输入阈值'); return; }
  const numValue = parseFloat(value);
  if (isNaN(numValue)) { alert('请输入有效数字'); return; }
  if (waitingSync[type]) { addLog('[' + type + '] 上一次设置还在等确认，忽略本次'); return; }

  waitingSync[type] = true;
  pendingValue[type] = numValue;
  sendCmd(cmdCode + ',' + numValue);
  lastUserSetTime[type] = Date.now();
  currentData[type] = numValue;
  updateUI();
  checkAlarmsWithPending();

  syncTimeoutTimer[type] = setTimeout(() => {
    if (waitingSync[type]) {
      waitingSync[type] = false;
      pendingValue[type] = null;
      syncTimeoutTimer[type] = null;
      addLog('[' + type + '] 同步超时(5s)，恢复设备上报值');
    }
  }, SYNC_TIMEOUT_MS);

  document.getElementById(inputId).blur();
}

// ==================== 报警判断 ====================
function checkAlarms() {
  const alarms = [];
  if (currentData.dist !== null && currentData.dist_threshold !== null &&
      currentData.dist < currentData.dist_threshold) alarms.push('坐姿异常！');
  renderAlarms(alarms);
}

function checkAlarmsWithPending() {
  const alarms = [];
  const distThr = waitingSync.dist_threshold ? pendingValue.dist_threshold : currentData.dist_threshold;
  if (currentData.dist !== null && distThr !== null && currentData.dist < distThr) alarms.push('坐姿异常！');
  renderAlarms(alarms);
}

function renderAlarms(alarms) {
  const container = document.getElementById('alarmContent');
  if (alarms.length === 0) container.innerHTML = '<span class="alarm-ok">运行正常 &#x2713;</span>';
  else container.innerHTML = alarms.map(a => '<div class="alarm-item">' + a + '</div>').join('');
}

// ==================== 日志 ====================
function addLog(msg) {
  const now = new Date();
  logEntries.unshift('[' + now.toLocaleTimeString() + '] ' + msg);
  if (logEntries.length > 30) logEntries.pop();
  renderLog();
}

function renderLog() {
  document.getElementById('logContent').innerHTML =
    logEntries.map(e => '<div class="log-entry">' + e + '</div>').join('');
}

addLog('页面加载完成，正在连接 MQTT...');
</script>
</body>
</html>
