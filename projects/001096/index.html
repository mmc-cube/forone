<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>稻田水体环境监测与智能调控系统</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #F5F5F5;
    color: #1F2937;
    font-size: 14px;
    line-height: 1.5;
    padding: 12px;
  }
  .container { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: #FFFFFF;
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
  }
  .card-title {
    font-size: 15px;
    font-weight: 700;
    color: #111827;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .badge {
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    background: #E5E7EB;
    color: #374151;
  }
  .badge.ok { background: #DCFCE7; color: #166534; }
  .badge.warn { background: #FEE2E2; color: #991B1B; }
  .badge.info { background: #DBEAFE; color: #1E40AF; }
  .btn {
    width: 100%;
    min-height: 48px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary { background: #2563EB; color: #FFFFFF; }
  .btn-success { background: #16A34A; color: #FFFFFF; }
  .btn-danger { background: #DC2626; color: #FFFFFF; }
  .btn-secondary { background: #E5E7EB; color: #1F2937; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .metric-box {
    background: #F9FAFB;
    border: 1px solid #E5E7EB;
    border-radius: 10px;
    padding: 10px 12px;
  }
  .metric-label { font-size: 12px; color: #6B7280; }
  .metric-value { font-size: 20px; font-weight: 700; color: #111827; margin-top: 2px; }
  .alarm-box {
    padding: 12px;
    border-radius: 10px;
    background: #F0FDF4;
    color: #166534;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .alarm-box.active {
    background: #FEF2F2;
    color: #991B1B;
    border: 1px solid #FECACA;
  }
  .thr-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid #F3F4F6;
  }
  .thr-item:last-child { border-bottom: none; }
  .thr-label { font-weight: 600; min-width: 96px; }
  .thr-input {
    width: 84px;
    height: 40px;
    border: 1px solid #D1D5DB;
    border-radius: 8px;
    padding: 0 8px;
    font-size: 15px;
    text-align: center;
  }
  .thr-btn {
    min-width: 72px;
    min-height: 40px;
    border: none;
    border-radius: 8px;
    background: #2563EB;
    color: #FFFFFF;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .log-box {
    background: #F9FAFB;
    border: 1px solid #E5E7EB;
    border-radius: 8px;
    padding: 8px;
    max-height: 180px;
    overflow-y: auto;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 12px;
    color: #374151;
    white-space: pre-wrap;
    margin-top: 8px;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <!-- 连接状态卡 -->
  <div class="card">
    <div class="card-title">
      <span>蓝牙连接（JDY-31 · 9600bps）</span>
      <span id="connBadge" class="badge">未连接</span>
    </div>
    <div class="row">
      <button id="btnConnect" class="btn btn-primary" onclick="toggleConnect()">连接蓝牙串口</button>
    </div>
  </div>

  <!-- 实时数据卡 -->
  <div class="card">
    <div class="card-title">
      <span>实时监测数据</span>
      <span id="waterModeBadge" class="badge info">灌溉模式</span>
    </div>
    <div class="metrics">
      <div class="metric-box">
        <div class="metric-label">pH 值</div>
        <div id="valPh" class="metric-value">--</div>
      </div>
      <div class="metric-box">
        <div class="metric-label">水体浊度</div>
        <div id="valTurb" class="metric-value">--</div>
      </div>
      <div class="metric-box">
        <div class="metric-label">水温</div>
        <div id="valTemp" class="metric-value">--</div>
      </div>
      <div class="metric-box">
        <div class="metric-label">水泵 / 模式</div>
        <div id="valPumpMode" class="metric-value" style="font-size:16px;">--</div>
      </div>
    </div>
  </div>

  <!-- 报警状态卡 -->
  <div class="card">
    <div class="card-title">
      <span>报警状态</span>
      <span id="alarmBadge" class="badge ok">正常</span>
    </div>
    <div id="alarmDetail" class="alarm-box">当前各项参数均在阈值范围内</div>
    <button id="btnMute" class="btn btn-danger" onclick="sendCmd('01')">远程消警（01）</button>
  </div>

  <!-- 控制卡 -->
  <div class="card">
    <div class="card-title">
      <span>水泵与模式控制</span>
      <span id="modeBadge" class="badge info">AUTO</span>
    </div>
    <div class="row" style="margin-bottom:10px;">
      <button class="btn btn-secondary" onclick="sendCmd('09,1')">切换 AUTO</button>
      <button class="btn btn-secondary" onclick="sendCmd('09,0')">切换 MANUAL</button>
    </div>
    <div class="row">
      <button id="btnPumpOn" class="btn btn-success" onclick="sendCmd('07')" disabled>开启水泵（07）</button>
      <button id="btnPumpOff" class="btn btn-danger" onclick="sendCmd('08')" disabled>关闭水泵（08）</button>
    </div>
  </div>

  <!-- 阈值设置卡 -->
  <div class="card">
    <div class="card-title"><span>阈值设置（02~06）</span></div>
    <div class="thr-item">
      <span class="thr-label">pH 下限</span>
      <input id="inPhLow" class="thr-input" type="number" step="0.1" value="5.5">
      <button class="thr-btn" onclick="sendThreshold('02', 'inPhLow')">下发</button>
    </div>
    <div class="thr-item">
      <span class="thr-label">pH 上限</span>
      <input id="inPhHigh" class="thr-input" type="number" step="0.1" value="8.5">
      <button class="thr-btn" onclick="sendThreshold('03', 'inPhHigh')">下发</button>
    </div>
    <div class="thr-item">
      <span class="thr-label">浊度上限(%)</span>
      <input id="inTurbMax" class="thr-input" type="number" step="1" value="50">
      <button class="thr-btn" onclick="sendThreshold('04', 'inTurbMax')">下发</button>
    </div>
    <div class="thr-item">
      <span class="thr-label">水温下限(℃)</span>
      <input id="inTempLow" class="thr-input" type="number" step="0.5" value="15.0">
      <button class="thr-btn" onclick="sendThreshold('05', 'inTempLow')">下发</button>
    </div>
    <div class="thr-item">
      <span class="thr-label">水温上限(℃)</span>
      <input id="inTempHigh" class="thr-input" type="number" step="0.5" value="35.0">
      <button class="thr-btn" onclick="sendThreshold('06', 'inTempHigh')">下发</button>
    </div>
  </div>

  <!-- 可折叠日志卡 -->
  <div class="card">
    <div class="card-title" style="margin-bottom:0; cursor:pointer;" onclick="toggleLog()">
      <span>通信日志</span>
      <span id="logToggleText" class="badge">展开</span>
    </div>
    <div id="logBox" class="log-box hidden"></div>
  </div>
</div>

<script>
  let port = null;
  let reader = null;
  let writer = null;
  let rxBuffer = '';
  let connected = false;

  const state = {
    ph: 7.0, turbidity: 0, water_temp: 20.0,
    pump_state: 0, control_mode: 1, water_mode: 0,
    ph_low: 5.5, ph_high: 8.5, turbidity_max: 50,
    temp_low: 15.0, temp_high: 35.0
  };

  function appendLog(msg) {
    const box = document.getElementById('logBox');
    const ts = new Date().toLocaleTimeString();
    box.textContent = `[${ts}] ${msg}\n` + box.textContent.slice(0, 3000);
  }

  function toggleLog() {
    const box = document.getElementById('logBox');
    const txt = document.getElementById('logToggleText');
    box.classList.toggle('hidden');
    txt.textContent = box.classList.contains('hidden') ? '展开' : '收起';
  }

  function setConnUI(isConnected) {
    connected = isConnected;
    const badge = document.getElementById('connBadge');
    const btn = document.getElementById('btnConnect');
    badge.textContent = isConnected ? '已连接' : '未连接';
    badge.className = 'badge ' + (isConnected ? 'ok' : '');
    btn.textContent = isConnected ? '断开连接' : '连接蓝牙串口';
  }

  async function toggleConnect() {
    if (connected) {
      try {
        if (reader) { await reader.cancel(); reader = null; }
        if (writer) { writer.releaseLock(); writer = null; }
        if (port) { await port.close(); port = null; }
      } catch (e) { appendLog('断开异常: ' + e.message); }
      setConnUI(false);
      return;
    }

    if (!('serial' in navigator)) {
      alert('当前浏览器不支持 Web Serial API，请使用 PC/Android Chrome/Edge 连接蓝牙串口，或通过 Android WebView 桥接使用。');
      return;
    }

    try {
      port = await navigator.serial.requestPort();
      await port.open({ baudRate: 9600 });
      writer = port.writable.getWriter();
      setConnUI(true);
      appendLog('串口已打开 (9600bps)');
      readLoop();
    } catch (e) {
      appendLog('连接失败: ' + e.message);
      setConnUI(false);
    }
  }

  async function readLoop() {
    const decoder = new TextDecoder();
    try {
      while (port && port.readable) {
        reader = port.readable.getReader();
        try {
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            if (value) {
              rxBuffer += decoder.decode(value, { stream: true });
              const lines = rxBuffer.split(/\r?\n/);
              rxBuffer = lines.pop() || '';
              lines.forEach(handleLine);
            }
          }
        } finally {
          reader.releaseLock();
          reader = null;
        }
      }
    } catch (e) {
      appendLog('读取中断: ' + e.message);
    }
    setConnUI(false);
  }

  function handleLine(line) {
    const trimmed = line.trim();
    if (!trimmed) return;
    const parts = trimmed.split(',');
    if (parts.length !== 11) return;

    const nums = parts.map(Number);
    if (nums.some(Number.isNaN)) return;

    [
      state.ph, state.turbidity, state.water_temp,
      state.pump_state, state.control_mode, state.water_mode,
      state.ph_low, state.ph_high, state.turbidity_max,
      state.temp_low, state.temp_high
    ] = nums;

    appendLog('RX: ' + trimmed);
    renderUI();
  }

  //供 Android WebView 原生桥接调用
  window.onBtData = handleLine;

  function renderUI() {
    document.getElementById('valPh').textContent = state.ph.toFixed(1);
    document.getElementById('valTurb').textContent = Math.round(state.turbidity) + '%';
    document.getElementById('valTemp').textContent = state.water_temp.toFixed(1) + ' ℃';
    document.getElementById('valPumpMode').textContent =
      (state.pump_state ? 'ON' : 'OFF') + ' / ' + (state.control_mode ? 'AUTO' : 'MANUAL');

    const wBadge = document.getElementById('waterModeBadge');
    wBadge.textContent = state.water_mode ? '排水模式' : '灌溉模式';

    const mBadge = document.getElementById('modeBadge');
    mBadge.textContent = state.control_mode ? 'AUTO' : 'MANUAL';

    const isAuto = state.control_mode === 1;
    document.getElementById('btnPumpOn').disabled = isAuto;
    document.getElementById('btnPumpOff').disabled = isAuto;

    // 同步阈值输入框（仅未聚焦时更新，避免打断用户输入）
    syncInput('inPhLow', state.ph_low.toFixed(1));
    syncInput('inPhHigh', state.ph_high.toFixed(1));
    syncInput('inTurbMax', Math.round(state.turbidity_max));
    syncInput('inTempLow', state.temp_low.toFixed(1));
    syncInput('inTempHigh', state.temp_high.toFixed(1));

    // JS 端独立计算报警状态
    const alarms = [];
    if (state.ph < state.ph_low || state.ph > state.ph_high) alarms.push('pH 越限');
    if (state.turbidity > state.turbidity_max) alarms.push('浊度超限');
    if (state.water_temp < state.temp_low || state.water_temp > state.temp_high) alarms.push('水温越限');

    const alarmBadge = document.getElementById('alarmBadge');
    const alarmDetail = document.getElementById('alarmDetail');
    if (alarms.length > 0) {
      alarmBadge.textContent = '报警';
      alarmBadge.className = 'badge warn';
      alarmDetail.textContent = '异常项：' + alarms.join('、');
      alarmDetail.className = 'alarm-box active';
    } else {
      alarmBadge.textContent = '正常';
      alarmBadge.className = 'badge ok';
      alarmDetail.textContent = '当前各项参数均在阈值范围内';
      alarmDetail.className = 'alarm-box';
    }
  }

  function syncInput(id, val) {
    const el = document.getElementById(id);
    if (document.activeElement !== el) el.value = val;
  }

  async function sendCmd(cmd) {
    const payload = cmd + '\r\n';
    appendLog('TX: ' + cmd);
    if (window.Android && typeof window.Android.send === 'function') {
      window.Android.send(payload);
      return;
    }
    if (!writer) {
      appendLog('未连接蓝牙串口，指令未发送');
      return;
    }
    try {
      await writer.write(new TextEncoder().encode(payload));
    } catch (e) {
      appendLog('发送失败: ' + e.message);
    }
  }

  function sendThreshold(code, inputId) {
    const val = document.getElementById(inputId).value.trim();
    if (val === '') return;
    sendCmd(`${code},${val}`);
  }

  renderUI();
</script>
</body>
</html>
