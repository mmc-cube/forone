<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2196F3">
<title>稻田水体环境监测与智能调控系统</title>
<style>
  :root {
    --bg: #F5F5F5;
    --card: #FFFFFF;
    --text: #1F2937;
    --sub: #6B7280;
    --primary: #2196F3;
    --primary-weak: #EBF5FF;
    --danger: #DC2626;
    --danger-weak: #FEF2F2;
    --border: #E5E7EB;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
    padding: 14px 14px 84px;
  }
  .container { max-width: 420px; margin: 0 auto; }
  .tab-page { display: none; flex-direction: column; gap: 16px; }
  .tab-page.active { display: flex; }

  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 16px 18px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
  }
  .card-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .bt-status-row {
    display: flex;
    align-items: center;
    font-size: 14px;
    margin-bottom: 12px;
    gap: 8px;
    color: var(--sub);
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #CBD5E1;
    display: inline-block;
  }
  .dot.on { background: var(--primary); }
  .status-text.on { color: var(--primary); font-weight: 600; }

  .select-box {
    width: 100%;
    height: 46px;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0 12px;
    font-size: 14px;
    background: #FFFFFF;
    color: var(--text);
    margin-bottom: 12px;
  }
  .btn {
    width: 100%;
    min-height: 48px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    background: var(--primary);
    color: #FFFFFF;
    margin-bottom: 10px;
  }
  .btn:last-child { margin-bottom: 0; }
  .btn.outline {
    background: #FFFFFF;
    color: var(--primary);
    border: 1px solid var(--primary);
  }
  .btn.danger { background: var(--danger); color: #FFFFFF; }
  .btn:disabled {
    background: #E5E7EB;
    color: #9CA3AF;
    border-color: #E5E7EB;
    cursor: not-allowed;
  }
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; margin-bottom: 0; }
  .hint { font-size: 12px; color: var(--sub); line-height: 1.6; margin-top: 8px; }

  .tag {
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--primary-weak);
    color: var(--primary);
  }
  .tag.alarm { background: var(--danger-weak); color: var(--danger); }

  .metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .metric-box {
    background: #FAFAFA;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .metric-label { font-size: 12px; color: var(--sub); }
  .metric-value { font-size: 20px; font-weight: 700; color: var(--text); margin-top: 4px; }

  .alarm-box {
    padding: 12px 14px;
    border-radius: 10px;
    background: var(--primary-weak);
    color: var(--primary);
    font-weight: 600;
    margin-bottom: 12px;
  }
  .alarm-box.active {
    background: var(--danger-weak);
    color: var(--danger);
  }

  .thr-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid #F3F4F6;
  }
  .thr-item:last-child { border-bottom: none; }
  .thr-label { font-weight: 600; min-width: 96px; }
  .thr-input {
    width: 88px;
    height: 42px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0 8px;
    font-size: 15px;
    text-align: center;
    color: var(--text);
  }
  .thr-btn {
    min-width: 76px;
    min-height: 42px;
    border: none;
    border-radius: 8px;
    background: var(--primary);
    color: #FFFFFF;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .log-box {
    background: #FAFAFA;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    min-height: 280px;
    max-height: 62vh;
    overflow-y: auto;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 12px;
    color: var(--text);
    white-space: pre-wrap;
  }

  .tab-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: #FFFFFF;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: center;
    z-index: 100;
  }
  .tab-bar-inner {
    width: 100%;
    max-width: 420px;
    display: flex;
  }
  .tab-btn {
    flex: 1;
    height: 58px;
    border: none;
    background: #FFFFFF;
    color: var(--sub);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border-top: 2px solid transparent;
  }
  .tab-btn.active {
    color: var(--primary);
    border-top-color: var(--primary);
  }
</style>
</head>
<body>
<div class="container">
  <!-- Tab 1: 监测 -->
  <div id="pageMonitor" class="tab-page active">
    <div class="card">
      <div class="card-title"><span>蓝牙连接</span></div>
      <div class="bt-status-row">
        <span class="dot" id="btDot"></span>
        <span class="status-text" id="btStatus">未连接</span>
      </div>
      <select id="deviceList" class="select-box">
        <option value="">请先扫描已配对蓝牙设备</option>
      </select>
      <div class="row" style="margin-bottom:10px;">
        <button class="btn outline" id="btnScan" onclick="scanDevices()">扫描设备</button>
        <button class="btn" id="btnConnect" onclick="connectSelected()">连接</button>
      </div>
      <button class="btn outline" id="btnDisconnect" onclick="disconnectBt()" style="display:none">断开连接</button>
      <div class="hint">请先在手机系统蓝牙中配对 JDY-31（PIN 常为 1234 / 0000），再回到此页面连接。</div>
    </div>

    <div class="card">
      <div class="card-title">
        <span>实时监测数据</span>
        <span id="waterModeBadge" class="tag">灌溉模式</span>
      </div>
      <div class="metrics">
        <div class="metric-box">
          <div class="metric-label">pH 值</div>
          <div id="valPh" class="metric-value">--</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">水体浊度</div>
          <div id="valTurb" class="metric-value">--</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">水温</div>
          <div id="valTemp" class="metric-value">--</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">水泵 / 模式</div>
          <div id="valPumpMode" class="metric-value" style="font-size:16px;">--</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">
        <span>报警状态</span>
        <span id="alarmBadge" class="tag">正常</span>
      </div>
      <div id="alarmDetail" class="alarm-box">当前各项参数均在阈值范围内</div>
      <button id="btnMute" class="btn outline" onclick="sendViaBt('01')">远程消警</button>
    </div>

    <div class="card">
      <div class="card-title"><span>当前阈值</span></div>
      <div class="metrics">
        <div class="metric-box">
          <div class="metric-label">pH 范围</div>
          <div id="curPhRange" class="metric-value" style="font-size:16px;">5.5 ~ 8.5</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">浊度上限</div>
          <div id="curTurbMax" class="metric-value" style="font-size:16px;">50%</div>
        </div>
        <div class="metric-box" style="grid-column: span 2;">
          <div class="metric-label">水温范围</div>
          <div id="curTempRange" class="metric-value" style="font-size:16px;">15.0 ~ 35.0 ℃</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Tab 2: 控制与设置 -->
  <div id="pageControl" class="tab-page">
    <div class="card">
      <div class="card-title">
        <span>水泵与模式控制</span>
        <span id="modeBadge" class="tag">AUTO</span>
      </div>
      <div class="row" style="margin-bottom:12px;">
        <button id="btnModeAuto" class="btn" onclick="sendViaBt('09,1')">AUTO 模式</button>
        <button id="btnModeMan" class="btn outline" onclick="sendViaBt('09,0')">MANUAL 模式</button>
      </div>
      <div class="row">
        <button id="btnPumpOn" class="btn" onclick="sendViaBt('07')" disabled>开启水泵</button>
        <button id="btnPumpOff" class="btn outline" onclick="sendViaBt('08')" disabled>关闭水泵</button>
      </div>
      <div class="hint">AUTO 模式下水泵由设备自动控制，手动开关已禁用；切换至 MANUAL 后可远程启停。</div>
    </div>

    <div class="card">
      <div class="card-title"><span>阈值设置</span></div>
      <div class="thr-item">
        <span class="thr-label">pH 下限</span>
        <input id="inPhLow" class="thr-input" type="number" step="0.1" value="5.5">
        <button class="thr-btn" onclick="sendThreshold('02', 'inPhLow')">下发</button>
      </div>
      <div class="thr-item">
        <span class="thr-label">pH 上限</span>
        <input id="inPhHigh" class="thr-input" type="number" step="0.1" value="8.5">
        <button class="thr-btn" onclick="sendThreshold('03', 'inPhHigh')">下发</button>
      </div>
      <div class="thr-item">
        <span class="thr-label">浊度上限(%)</span>
        <input id="inTurbMax" class="thr-input" type="number" step="1" value="50">
        <button class="thr-btn" onclick="sendThreshold('04', 'inTurbMax')">下发</button>
      </div>
      <div class="thr-item">
        <span class="thr-label">水温下限(℃)</span>
        <input id="inTempLow" class="thr-input" type="number" step="0.5" value="15.0">
        <button class="thr-btn" onclick="sendThreshold('05', 'inTempLow')">下发</button>
      </div>
      <div class="thr-item">
        <span class="thr-label">水温上限(℃)</span>
        <input id="inTempHigh" class="thr-input" type="number" step="0.5" value="35.0">
        <button class="thr-btn" onclick="sendThreshold('06', 'inTempHigh')">下发</button>
      </div>
    </div>
  </div>

  <!-- Tab 3: 日志 -->
  <div id="pageLog" class="tab-page">
    <div class="card">
      <div class="card-title">
        <span>通信日志</span>
        <button class="tag" style="border:none; cursor:pointer;" onclick="clearLog()">清空</button>
      </div>
      <div id="logBox" class="log-box"></div>
    </div>
  </div>
</div>

<!-- 底部 Tab 栏 -->
<div class="tab-bar">
  <div class="tab-bar-inner">
    <button id="tabMonitor" class="tab-btn active" onclick="switchTab('Monitor')">监测</button>
    <button id="tabControl" class="tab-btn" onclick="switchTab('Control')">控制</button>
    <button id="tabLog" class="tab-btn" onclick="switchTab('Log')">日志</button>
  </div>
</div>

<script>
  function $(id) { return document.getElementById(id); }

  var isBtConnected = false;
  var state = {
    ph: 7.0, turbidity: 0, water_temp: 20.0,
    pump_state: 0, control_mode: 1, water_mode: 0,
    ph_low: 5.5, ph_high: 8.5, turbidity_max: 50,
    temp_low: 15.0, temp_high: 35.0
  };

  function switchTab(name) {
    ['Monitor', 'Control', 'Log'].forEach(function(t) {
      $('page' + t).classList.toggle('active', t === name);
      $('tab' + t).classList.toggle('active', t === name);
    });
  }

  function getBridge() {
    if (window.BluetoothBridge) return window.BluetoothBridge;
    try {
      if (window.top && window.top !== window && window.top.BluetoothBridge) {
        return window.top.BluetoothBridge;
      }
    } catch (e) {}
    return null;
  }

  function addLog(msg) {
    var box = $('logBox');
    var ts = new Date().toLocaleTimeString();
    box.textContent = '[' + ts + '] ' + msg + '\n' + box.textContent.slice(0, 3000);
  }

  function clearLog() {
    $('logBox').textContent = '';
  }

  function scanDevices() {
    var bridge = getBridge();
    if (bridge) {
      addLog('扫描已配对设备...');
      bridge.getPairedDevices();
    } else {
      alert('请在 Android WebView 壳中运行本页面');
      addLog('错误：当前环境没有 BluetoothBridge');
    }
  }

  function connectSelected() {
    var addr = $('deviceList').value;
    if (!addr) {
      alert('请先选择设备；若列表为空，请先在系统蓝牙中配对 JDY-31');
      return;
    }
    var bridge = getBridge();
    if (bridge) {
      addLog('正在连接 ' + addr);
      bridge.connect(addr);
    } else {
      alert('请在 Android WebView 壳中运行本页面');
    }
  }

  function disconnectBt() {
    var bridge = getBridge();
    if (bridge) bridge.disconnect();
  }

  function sendViaBt(cmd) {
    var bridge = getBridge();
    if (!isBtConnected || !bridge) {
      alert('蓝牙未连接，请先连接设备');
      addLog('发送失败：蓝牙未连接');
      return false;
    }
    bridge.send(cmd + '\n');
    addLog('发送 ' + cmd);
    return true;
  }

  function sendThreshold(code, inputId) {
    var val = $(inputId).value.trim();
    if (val === '') return;
    sendViaBt(code + ',' + val);
  }

  window.onBtDeviceList = function(deviceArray) {
    if (typeof deviceArray === 'string') {
      try { deviceArray = JSON.parse(deviceArray); } catch (e) { deviceArray = []; }
    }
    var select = $('deviceList');
    select.innerHTML = '';

    if (!deviceArray || deviceArray.length === 0) {
      var opt = document.createElement('option');
      opt.value = '';
      opt.textContent = '未找到已配对设备，请先在系统蓝牙中配对';
      select.appendChild(opt);
      addLog('扫描完成：没有已配对设备');
      return;
    }

    deviceArray.forEach(function(d) {
      var o = document.createElement('option');
      o.value = d.address;
      o.textContent = (d.name || '未知设备') + ' (' + d.address + ')';
      select.appendChild(o);
    });
    addLog('扫描完成：' + deviceArray.length + ' 个设备');
  };

  window.onBtConnected = function(address) {
    isBtConnected = true;
    address = address || '设备';

    $('btDot').classList.add('on');
    $('btStatus').textContent = '已连接：' + address;
    $('btStatus').classList.add('on');
    $('btnScan').style.display = 'none';
    $('deviceList').disabled = true;
    $('btnConnect').style.display = 'none';
    $('btnDisconnect').style.display = 'block';
    addLog('已连接 ' + address);

    setTimeout(function() {
      var bridge = getBridge();
      if (isBtConnected && bridge) {
        bridge.send('00\n');
        addLog('发送 00（握手）');
      }
    }, 500);
  };

  window.onBtDisconnected = function() {
    isBtConnected = false;

    $('btDot').classList.remove('on');
    $('btStatus').textContent = '未连接';
    $('btStatus').classList.remove('on');
    $('btnScan').style.display = 'block';
    $('deviceList').disabled = false;
    $('btnConnect').style.display = 'block';
    $('btnDisconnect').style.display = 'none';
    addLog('蓝牙已断开');
  };

  window.onBtError = function(errMsg) {
    isBtConnected = false;
    addLog('蓝牙错误：' + errMsg);
    alert('蓝牙错误：' + errMsg);
    window.onBtDisconnected();
  };

  window.onBtData = function(line) {
    line = (line || '').trim();
    if (!line) return;
    var parts = line.split(',');
    if (parts.length !== 11) return;

    var nums = parts.map(Number);
    if (nums.some(isNaN)) return;

    state.ph = nums[0];
    state.turbidity = nums[1];
    state.water_temp = nums[2];
    state.pump_state = nums[3];
    state.control_mode = nums[4];
    state.water_mode = nums[5];
    state.ph_low = nums[6];
    state.ph_high = nums[7];
    state.turbidity_max = nums[8];
    state.temp_low = nums[9];
    state.temp_high = nums[10];

    addLog('收到 ' + line);
    renderUI();
  };

  try {
    if (window.top && window.top !== window) {
      window.top.onBtDeviceList   = window.onBtDeviceList;
      window.top.onBtConnected    = window.onBtConnected;
      window.top.onBtDisconnected = window.onBtDisconnected;
      window.top.onBtError        = window.onBtError;
      window.top.onBtData         = window.onBtData;
    }
  } catch (e) {
    addLog('iframe 镜像失败: ' + e.message);
  }

  function renderUI() {
    $('valPh').textContent = state.ph.toFixed(1);
    $('valTurb').textContent = Math.round(state.turbidity) + '%';
    $('valTemp').textContent = state.water_temp.toFixed(1) + ' ℃';
    $('valPumpMode').textContent =
      (state.pump_state ? 'ON' : 'OFF') + ' / ' + (state.control_mode ? 'AUTO' : 'MANUAL');

    $('waterModeBadge').textContent = state.water_mode ? '排水模式' : '灌溉模式';
    $('modeBadge').textContent = state.control_mode ? 'AUTO' : 'MANUAL';

    var isAuto = state.control_mode === 1;
    $('btnPumpOn').disabled = isAuto;
    $('btnPumpOff').disabled = isAuto;
    $('btnModeAuto').className = isAuto ? 'btn' : 'btn outline';
    $('btnModeMan').className = isAuto ? 'btn outline' : 'btn';

    $('curPhRange').textContent = state.ph_low.toFixed(1) + ' ~ ' + state.ph_high.toFixed(1);
    $('curTurbMax').textContent = Math.round(state.turbidity_max) + '%';
    $('curTempRange').textContent = state.temp_low.toFixed(1) + ' ~ ' + state.temp_high.toFixed(1) + ' ℃';

    var alarms = [];
    if (state.ph < state.ph_low || state.ph > state.ph_high) alarms.push('pH 越限');
    if (state.turbidity > state.turbidity_max) alarms.push('浊度超限');
    if (state.water_temp < state.temp_low || state.water_temp > state.temp_high) alarms.push('水温越限');

    var alarmBadge = $('alarmBadge');
    var alarmDetail = $('alarmDetail');
    var btnMute = $('btnMute');
    if (alarms.length > 0) {
      alarmBadge.textContent = '报警';
      alarmBadge.className = 'tag alarm';
      alarmDetail.textContent = '异常项：' + alarms.join('、');
      alarmDetail.className = 'alarm-box active';
      btnMute.className = 'btn danger';
    } else {
      alarmBadge.textContent = '正常';
      alarmBadge.className = 'tag';
      alarmDetail.textContent = '当前各项参数均在阈值范围内';
      alarmDetail.className = 'alarm-box';
      btnMute.className = 'btn outline';
    }
  }

  renderUI();
</script>
</body>
</html>
